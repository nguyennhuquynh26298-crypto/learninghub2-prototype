<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permissions · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1125sh"><link rel="stylesheet" href="../assets/css/admin.css?v=1125nc"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1125m3">
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body>
<!-- Course Creator & Approval 2.4 + 3.6 · BR-RP-01…07, BR-CA-11 (Notion LH2 Product Docs No 10, Đợt 2 · Gói 6).
     Settings › Permissions: cấp / gỡ quyền Course Creator. Giới hạn 3 khoá là cố định (doc Enrollment), không còn ô cài đặt. -->
<div id="header"></div>
<main>
  <div id="head"></div>
  <section class="adm-box"><div class="adm-box__head"><h2 class="adm-box__title" style="flex:1">Course Creators</h2><button class="btn-cta" id="add" type="button">+ Add Course Creator</button></div>
    <div class="adm-card" id="list"></div></section>
</main>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1126cn"></script>
<script src="../assets/js/lh2-wave2.js?v=1126cn"></script>
<script>
const { Avatar, esc, toast, AdminLayout, AdminHead, AdminTable, AdminEmpty, RowMenu } = LH;
const START = [
  { name: 'Phạm Thanh Long', email: 'long.pham@techvify.com.vn', dept: 'QA', code: 'TVF0412', courses: 3, since: '24/11/2026' },
  { name: 'Trần Minh', email: 'minh.tran@techvify.com.vn', dept: 'QA', code: 'TVF0388', courses: 2, since: '24/11/2026' },
  { name: 'Nguyễn Hải Đăng', email: 'dang.nguyen@techvify.com.vn', dept: 'QC Automation', code: 'TVF0521', courses: 0, since: '25/11/2026' },
];
/* Nhân viên đang làm việc (THRM). Admin L&D (Lê Thị Mai) và người đã là Creator không có trong danh sách */
const EMP = [
  ['Đỗ Minh Quân', 'quan.do@techvify.com.vn', 'QA', 'TVF0602'], ['Vũ Thị Lan', 'lan.vu@techvify.com.vn', 'Development', 'TVF0233'],
  ['Hoàng Anh Tuấn', 'tuan.hoang@techvify.com.vn', 'BA', 'TVF0719'], ['Ngô Bảo Châu', 'chau.ngo@techvify.com.vn', 'Design', 'TVF0150'],
  ['Lê Thị Mai', 'mai.le@techvify.com.vn', 'L&D', 'TVF0007', 'admin'], ...START.map((c) => [c.name, c.email, c.dept, c.code]),
];
let creators = START.map((c) => ({ ...c }));

function render() {
  AdminLayout({ active: 'settings', role: 'admin' });
  document.getElementById('head').innerHTML = AdminHead({ eyebrow: 'Settings', title: 'Permissions', desc: 'Course Creators build and manage their own courses. Their courses and changes to running courses need L&D Admin approval.' });
  document.getElementById('list').innerHTML = creators.length
    ? AdminTable(['Name', 'Email', 'Department', ['Courses Owned', 'num'], 'Granted On', ['', 't-act']],
      creators.map((c, i) => `<tr><td><span class="adm-meta">${Avatar(c.name, 'sm')}<b>${esc(c.name)}</b></span></td><td>${esc(c.email)}</td><td>${esc(c.dept)}</td><td class="num">${c.courses}</td><td>${c.since}</td>
        <td class="t-act">${RowMenu([{ label: 'Revoke', icon: 'trash', danger: true, attrs: `data-rv="${i}"` }])}</td></tr>`).join(''))
    : AdminEmpty({ icon: 'users', title: 'No Course Creators yet.', compact: true });
}

function addPopup() {
  const taken = new Set(creators.map((c) => c.name));
  const pool = EMP.filter((e) => !taken.has(e[0]) && e[4] !== 'admin');
  const picked = new Set();
  const list = (q) => { const n = LH.norm(q); return pool.filter((e) => !n || LH.norm([e[0], e[1], e[3]].join(' ')).includes(n)) /* Quy định chung Course Audience 3.1: mã nhân sự, email, Display name */
    .map((e) => `<label><input type="checkbox" value="${esc(e[0])}" ${picked.has(e[0]) ? 'checked' : ''}>${Avatar(e[0], 'sm')}<span>${esc(e[0])}<br><small>${esc(e[3])} · ${esc(e[1])}</small></span></label>`).join('') || '<p class="adm-hint" style="padding:12px">No matching employees.</p>'; };
  const el = LHW2.pop({ title: 'Add Course Creator', desc: 'Select employees by name, email or employee ID. They will receive an email and see Create new course in Course Management.',
    body: `<div class="w2-field"><span>Employees <span class="req">*</span></span><input data-q placeholder="Search by name, email or employee ID"><div class="w2-list" data-l>${list('')}</div><div class="w2-err" data-err hidden>Please select at least 1 employee.</div></div>`,
    ok: 'Save', onOk: (p) => {
      if (!picked.size) { p.querySelector('[data-err]').hidden = false; return false; }
      [...picked].forEach((n) => { const e = EMP.find((x) => x[0] === n); creators.push({ name: e[0], email: e[1], dept: e[2], code: e[3], courses: 0, since: '20/11/2026' }); });
      render(); toast(`Course Creator access granted to ${picked.size} ${picked.size > 1 ? 'people' : 'person'}`);
    } });
  el.addEventListener('input', (e) => { if (e.target.matches('[data-q]')) el.querySelector('[data-l]').innerHTML = list(e.target.value); });
  el.addEventListener('change', (e) => { const cb = e.target.closest('input[type=checkbox]'); if (!cb) return; cb.checked ? picked.add(cb.value) : picked.delete(cb.value); el.querySelector('[data-err]').hidden = true; });
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#add')) { addPopup(); return; }
  const rv = e.target.closest('[data-rv]');
  if (rv) {
    const c = creators[+rv.dataset.rv];
    LHW2.pop({ title: 'Revoke Course Creator access', danger: true, ok: 'Revoke',
      desc: `Revoke Course Creator access for <b>${esc(c.name)}</b>? They will no longer manage ${c.courses} courses; these courses will be transferred to L&amp;D Admin.`,
      onOk: () => { creators.splice(+rv.dataset.rv, 1); render(); toast(`Course Creator access revoked for ${c.name}`); } });
  }
});
LH.DemoBar('LH2 · Settings › Permissions (Đợt 2 · Gói 6)', [
  { label: 'Data', key: 'd', options: [['list', '3 Course Creators'], ['empty', 'No Course Creators yet (at release)']] },
], (s) => { creators = s.d === 'empty' ? [] : START.map((c) => ({ ...c })); render(); });
</script>
</body>
</html>
