<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý khoá — Đối tượng · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1113c"><link rel="stylesheet" href="../assets/css/base.css?v=1113c"><link rel="stylesheet" href="../assets/css/components.css?v=1113c"><link rel="stylesheet" href="../assets/css/admin.css?v=1113c">
<style>
  /* Course Assignment — Figma 179:2227: Chi tiết gán khoá (trái) · Xem trước học viên (phải) · Danh sách học viên (dưới) */
  .aud-card { display: flex; flex-direction: column; gap: 24px; }
  .aud-card .panel { border: 1px solid var(--adm-stroke) !important; border-radius: 12px !important; }
  .pv-stat { display: flex; align-items: baseline; gap: 8px; } .pv-stat b { font-size: 32px; font-weight: 600; color: var(--adm-text); }
  .pv-row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--adm-stroke); font-size: 15px; }
  .rule-grid { display: grid; grid-template-columns: 140px 1fr; gap: 14px 16px; align-items: start; }
  .rule-grid > .lbl { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; height: 36px; }
  .rule-grid > .lbl svg { width: 16px; height: 16px; color: var(--text-subtle); }
  details.excl summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; }
  details.excl summary svg { width: 16px; height: 16px; transition: transform .15s; }
  details.excl[open] summary svg { transform: rotate(180deg); }
  .src { display: flex; flex-wrap: wrap; gap: 4px; }
  .rule-grid > :not(.lbl) { min-width: 0; }
  .aud-dates { display: flex; flex-wrap: wrap; gap: 16px; }
  .aud-dates > .field { flex: 1 1 180px; max-width: 240px; }
  @media (max-width: 1023px) { .rule-grid { grid-template-columns: minmax(0, 1fr); gap: 6px; } .rule-grid > .lbl { height: auto; margin-top: 8px; } }
</style>
</head>
<body>
<div id="header"></div>
<main>
  <div class="adm-head"><div class="adm-head__text"><a class="adm-back" href="admin-courses.html" id="back">Quay lại</a><span class="adm-head__eyebrow">Course Assignment</span>
    <h1><span data-ctitle>Claude Certified Architect – Foundations</span> <span class="stage-tag stage-tag--published">Đang chạy</span></h1>
    <p>Gán khoá cho học viên và phòng ban, đặt lịch học, gửi email thông báo.</p></div><span id="export-slot"></span></div>
  <div class="combo"><button>Thông tin</button><button onclick="location.href='admin-test-practice.html?st=ok'">Nội dung</button><button class="is-active">Đối tượng</button><button>Học viên</button></div>
  <div class="adm-grid-2">
    <section class="adm-card aud-card"><h2 class="adm-card__title" style="margin:0">Chi tiết gán khoá</h2>
      <div class="adm-field"><span class="adm-label">Phạm vi <span class="req">*</span></span>
        <div class="choice-cards" id="scope">
          <label class="choice-card" data-v="all"><input type="radio" name="scope" value="all"><div><b>Mọi người</b><div class="adm-hint">Toàn công ty</div></div></label>
          <label class="choice-card" data-v="limited"><input type="radio" name="scope" value="limited"><div><b>Giới hạn</b><div class="adm-hint">Phòng ban, vị trí, cá nhân</div></div></label>
        </div></div>
      <div id="rules"></div>
      <section class="panel" id="extra-panel"></section>
      <section class="panel" id="paid-panel"></section>
      <div class="adm-btn-combo" style="align-items:center;padding-top:0"><label class="check" style="flex:1"><input type="checkbox" id="mail"><span>Gửi email thông báo cho học viên mới</span></label>
        <a class="btn-cta btn-cta--line" href="admin-courses.html">Huỷ</a><button class="btn-cta" id="save">Lưu</button></div>
    </section>
    <aside class="adm-card" id="preview"></aside>
  </div>
  <section class="adm-card" id="members"></section>
</main>

<script src="../assets/js/components.js?v=1113c"></script>
<script src="../assets/js/data.js?v=1113c"></script>
<script src="../assets/js/export-modal.js?v=1113c"></script>
<script>
/* Tên khoá theo dòng đã bấm ở Quản lý khoá học */
(() => { const t = new URLSearchParams(location.search).get('t') || sessionStorage.getItem('lhAdminCourse'); if (!t) return; sessionStorage.setItem('lhAdminCourse', t); document.querySelectorAll('[data-ctitle]').forEach((el) => { el.textContent = t; }); })();
const { ICON, Alert, Badge, Avatar, Modal, Button, toast, esc, AdminLayout, Tag } = LH;
document.getElementById('back').insertAdjacentHTML('afterbegin', ICON.undo); const D = LHData;
let role = 'Admin';
const base = { scope: 'limited', depts: 'QA|QC Automation', pos: 'Automation Tester' };
const groupChanged = () => st.scope !== base.scope || st.depts.join('|') !== base.depts || st.pos.join('|') !== base.pos;
const toRevision = () => role === 'Creator' && groupChanged();
const st = { start: '2026-11-15', end: '2026-11-30', saved: { start: '2026-11-15', end: '2026-11-30' }, schedErr: '', scope: 'limited', depts: ['QA', 'QC Automation'], pos: ['Automation Tester'], people: ['Đỗ Quang Huy'], paid: false, due: '', members: [...D.members], excluded: [...D.excluded], err: '' };
document.querySelectorAll('.chev').forEach((c) => c.innerHTML = ICON.chevronR);

const tagInput = (key, list, ph) => `<div class="tag-input" data-key="${key}">${list.map((v) => `<span class="tag">${esc(v)}<button data-rm="${key}" data-v="${esc(v)}" aria-label="Bỏ ${esc(v)}">${ICON.x}</button></span>`).join('')}<input placeholder="${ph}"></div>`;
function render() {
  AdminLayout({ active: 'courses', collapsed: true, role });
  document.getElementById('export-slot').innerHTML = `<button class="btn-cta btn-cta--line" id="open-export">${ICON.download}Xuất dữ liệu</button>`;
  document.querySelectorAll('#scope .choice-card').forEach((c) => { c.classList.toggle('is-selected', c.dataset.v === st.scope); c.querySelector('input').checked = c.dataset.v === st.scope; });
  const limited = st.scope === 'limited';
  document.getElementById('rules').innerHTML = !limited ? '' :
    `<hr class="sep" style="margin-bottom:16px"><div class="rule-grid">
      <span class="lbl">${ICON.building}Phòng ban</span>${tagInput('depts', st.depts, 'Tìm phòng ban…')}
      <span class="lbl">${ICON.briefcase}Vị trí</span>${tagInput('pos', st.pos, 'Tìm vị trí…')}
      <span class="lbl">${ICON.user}Cá nhân</span>${tagInput('people', st.people, 'Tìm theo tên, email hoặc mã NV…')}
    </div>${st.err ? `<div class="field__error" style="margin-top:12px">${ICON.alert}${st.err}</div>` : ''}`;

  const isAdmin = role === 'Admin';
  // #4 §3.4 — Lịch học (Must Have, chỉ Admin L&D sửa) · §3.5 Khoá có phí (Could Have)
  const changed = st.start !== st.saved.start || st.end !== st.saved.end;
  document.getElementById('extra-panel').innerHTML = `<div class="panel__head"><b class="t-sm grow">Lịch học</b>${isAdmin ? '' : Badge('Chỉ xem', 'neutral', 'lock')}</div>
    <div class="panel__body stack gap-16">
      <div class="aud-dates" style="align-items:flex-end">
        <div class="field"><span class="field__label">Ngày bắt đầu</span><input class="input" type="date" id="d-start" value="${st.start}" ${isAdmin ? '' : 'disabled'}></div>
        <div class="field"><span class="field__label">Ngày kết thúc</span><input class="input ${st.schedErr ? 'is-error' : ''}" type="date" id="d-end" value="${st.end}" ${isAdmin ? '' : 'disabled'}></div>
        ${isAdmin && changed && st.saved.start ? `<label class="check"><input type="checkbox" id="mail-sched"><span>Gửi email báo đổi lịch</span></label>` : ''}</div>
      ${st.schedErr ? `<div class="field__error" style="margin-top:-8px">${ICON.alert}${st.schedErr}</div>` : ''}
    </div>`;
  document.getElementById('paid-panel').innerHTML = `<div class="panel__head"><b class="t-sm grow">Khoá có phí</b>${Badge('Could Have · sau Đợt 1', 'neutral')}</div>
    <div class="panel__body stack gap-16">
      <div class="row gap-16"><label class="check grow"><input type="checkbox" id="paid" ${st.paid ? 'checked' : ''}><span>Khoá có phí</span></label></div>
      ${!limited && st.paidTry ? `<div class="field__error" style="margin-top:-8px">${ICON.alert}Khoá có phí cần chọn đối tượng cụ thể.</div>` : ''}
    </div>`;

  const sv = document.getElementById('save'); sv.textContent = toRevision() ? 'Lưu vào bản sửa' : 'Lưu';
  document.getElementById('export-slot').classList.toggle('hidden', role !== 'Admin' && !st.wave2);
  const rows = limited ? st.members : [];
  const byDept = {}; rows.forEach((m) => { byDept[m.dept] = (byDept[m.dept] || 0) + 1; });
  document.getElementById('preview').innerHTML = `<h2 class="adm-card__title">Xem trước học viên</h2>
    ${limited ? `<div class="pv-stat"><b>${rows.length}</b><span class="adm-hint">học viên được học</span></div>
      <div style="margin-top:16px">${Object.entries(byDept).map(([d, n]) => `<div class="pv-row"><span class="adm-meta">${ICON.building}${esc(d)}</span><b>${n}</b></div>`).join('')}
      <div class="pv-row"><span class="adm-meta">${ICON.lock}Đã loại trừ</span><b>${st.excluded.length}</b></div></div>`
    : `<div class="pv-stat"><b>Toàn công ty</b></div><p class="adm-hint">Mọi nhân viên đang làm việc đều thấy và học được khoá.</p>`}`;
  document.getElementById('members').innerHTML = `<div class="adm-box__head" style="margin-bottom:20px"><h2 class="adm-box__title">Danh sách học viên</h2>${Tag(limited ? rows.length + ' học viên' : 'Toàn công ty', 'info')}<span style="flex:1"></span>
      <label class="adm-inline-search"><input placeholder="Tìm học viên…"><span>${ICON.search}</span></label></div>
    ${limited ? `<div class="adm-scroll"><table class="adm-table"><tr><th>Họ tên</th><th>Phòng ban</th><th>Vị trí</th><th>Nguồn</th><th>Trạng thái học</th><th></th></tr>
    ${rows.map((m, k) => `<tr><td><div class="person">${Avatar(m.name, 'sm')}<div><div class="fw-500">${esc(m.name)}</div><div class="t-xs muted">${esc(m.email)}</div></div></div></td>
      <td>${esc(m.dept)}</td><td>${esc(m.pos)}</td><td><div class="src">${m.src.map((s) => Badge(s, s === 'Cá nhân' ? 'violet' : 'info')).join('')}</div></td>
      <td>${Tag(m.status, m.status === 'Hoàn thành' ? 'published' : m.status === 'Đang học' ? 'rejected' : 'neutral')}</td>
      <td style="text-align:right"><button class="btn-cta btn-cta--line btn-cta--sm" style="color:#f04438" data-remove="${k}">Gỡ khỏi khoá</button></td></tr>`).join('')}</table></div>
    <div style="padding-top:16px"><details class="excl" ${st.excluded.length ? '' : ''}><summary>Đã loại trừ (${st.excluded.length}) ${ICON.chevronD}</summary>
      ${st.excluded.length ? `<div class="adm-scroll" style="margin-top:12px"><table class="adm-table">${st.excluded.map((m, k) => `<tr><td><div class="person">${Avatar(m.name, 'sm')}<div><div class="fw-500">${esc(m.name)}</div><div class="t-xs muted">${esc(m.email)}</div></div></div></td><td>${esc(m.dept)}</td><td>${Badge('Mất quyền', 'neutral', 'lock')}</td><td style="text-align:right"><button class="btn btn--outline btn--sm" data-readd="${k}">${ICON.undo}Thêm lại</button></td></tr>`).join('')}</table></div>` : '<p class="t-sm muted">Chưa có ai.</p>'}
    </details></div>`
    : `<p class="adm-hint">Phạm vi Mọi người — không có danh sách riêng.</p>`}`;
}

document.addEventListener('click', (e) => {
  const rm = e.target.closest('[data-rm]'); if (rm) { st[rm.dataset.rm] = st[rm.dataset.rm].filter((v) => v !== rm.dataset.v); st.err = ''; render(); return; }
  const card = e.target.closest('#scope .choice-card'); if (card) {
    e.preventDefault(); const v = card.dataset.v; if (v === st.scope) return;
    if (v === 'all') { document.body.insertAdjacentHTML('beforeend', Modal({ id: 'm-all', size: 'sm', icon: 'globe', iconTone: 'warning', title: 'Mọi nhân viên đều học được khoá này. Tiếp tục?', body: '', foot: Button({ label: 'Huỷ', variant: 'secondary', attrs: 'data-close' }) + Button({ label: 'Tiếp tục', attrs: 'id="ok-all"' }) })); }
    else { st.scope = 'limited'; render(); }
    return;
  }
  if (e.target.closest('#ok-all')) { st.scope = 'all'; st.paid = false; document.getElementById('m-all').remove(); render(); return; }
  const r = e.target.closest('[data-remove]'); if (r) {
    const m = st.members[+r.dataset.remove];
    document.body.insertAdjacentHTML('beforeend', Modal({ id: 'm-rm', size: 'sm', icon: 'alert', iconTone: 'danger', title: `Gỡ ${esc(m.name)} khỏi khoá học?`, body: '<p class="t-sm">Người này mất quyền vào nội dung ngay, tiến độ được giữ.</p>', foot: Button({ label: 'Huỷ', variant: 'secondary', attrs: 'data-close' }) + Button({ label: 'Gỡ', variant: 'danger', attrs: `data-confirm-rm="${r.dataset.remove}"` }) }));
    return;
  }
  const c = e.target.closest('[data-confirm-rm]'); if (c) { const [m] = st.members.splice(+c.dataset.confirmRm, 1); st.excluded.push(m); document.getElementById('m-rm').remove(); render(); document.querySelector('details.excl').open = true; toast(`Đã gỡ ${m.name} — tiến độ được giữ`); return; }
  const ra = e.target.closest('[data-readd]'); if (ra) { const [m] = st.excluded.splice(+ra.dataset.readd, 1); st.members.push({ ...m, status: 'Đang học' }); render(); toast(`Đã thêm lại ${m.name}`); return; }
  if (e.target.closest('#open-export')) { LHExport.open({ role, limited: st.scope === 'limited' }); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'paid') { if (st.scope !== 'limited') { st.paidTry = true; e.target.checked = false; render(); return; } st.paid = e.target.checked; render(); }
  if (e.target.id === 'd-start') { st.start = e.target.value; st.schedErr = ''; render(); }
  if (e.target.id === 'd-end') { st.end = e.target.value; st.schedErr = ''; render(); }
});
document.getElementById('save').onclick = () => {
  if (st.start && st.end && st.end < st.start) { st.schedErr = 'Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.'; render(); return; }
  if (st.end && st.end !== st.saved.end && st.end < '2026-11-11') { st.schedErr = 'Ngày kết thúc không được ở quá khứ.'; render(); return; }
  if (!st.warned) st.mailSched = !!document.getElementById('mail-sched')?.checked;
  if (st.scope === 'limited' && !st.depts.length && !st.pos.length && !st.people.length) { st.err = 'Chọn ít nhất một phòng ban, vị trí hoặc cá nhân.'; render(); return; }
  // #4 §3.4 — cảnh báo gán nhầm (luật cố định, chỉ nhắc, không chặn lưu): người thêm theo Cá nhân không thuộc phòng ban / vị trí đã chọn
  const odd = st.scope === 'limited' ? st.members.filter((m) => m.src.includes('Cá nhân') && st.people.includes(m.name) && !st.depts.includes(m.dept) && !st.pos.includes(m.pos)) : [];
  if (odd.length && !st.warned) {
    document.body.insertAdjacentHTML('beforeend', Modal({ id: 'm-warn', size: 'sm', icon: 'alert', iconTone: 'warning', title: 'Kiểm tra lại đối tượng',
      body: `<p class="t-sm">Những người sau được thêm theo Cá nhân nhưng không thuộc phòng ban / vị trí đã chọn:</p><ul class="t-sm" style="margin:8px 0 0 18px">${odd.map((m) => `<li><b>${esc(m.name)}</b> — ${esc(m.dept)} · ${esc(m.pos)}</li>`).join('')}</ul>`,
      foot: Button({ label: 'Xem lại', variant: 'secondary', attrs: 'data-close' }) + Button({ label: 'Vẫn lưu', attrs: 'id="warn-ok"' }) }));
    document.getElementById('warn-ok').onclick = () => { document.getElementById('m-warn').remove(); st.warned = true; document.getElementById('save').click(); st.warned = false; };
    return;
  }
  const schedMsg = st.mailSched ? ' · đã gửi email báo đổi lịch' : ''; st.saved = { start: st.start, end: st.end };
  if (toRevision()) { render(); toast('Đã lưu vào bản sửa — gửi duyệt để áp dụng'); return; }
  toast(`Đã cập nhật đối tượng — ${st.scope === 'limited' ? st.members.length + ' học viên' : 'toàn công ty'}${document.getElementById('mail').checked ? ' · đã gửi email cho 2 người mới' : ''}${schedMsg}`); render();
};
LH.DemoBar('#4 Đối tượng · #5 Export', [
  { label: 'Vai trò', key: 'role', options: [['Admin', 'Admin L&D'], ['Creator', 'Creator (Đợt 2)']] },
  { label: 'Kịch bản', key: 'sc', options: [['limited', 'Giới hạn (QA)'], ['all', 'Toàn công ty'], ['empty', 'Giới hạn, chưa có quy tắc']] },
], (s) => {
  role = s.role; st.wave2 = s.role === 'Creator'; st.paidTry = false; st.err = '';
  if (s.sc === 'all') st.scope = 'all';
  else { st.scope = 'limited'; if (s.sc === 'empty') { st.depts = []; st.pos = []; st.people = []; } else { st.depts = ['QA', 'QC Automation']; st.pos = ['Automation Tester']; st.people = ['Đỗ Quang Huy']; } }
  render();
});
</script>
</body>
</html>
