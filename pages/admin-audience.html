<head>

<title>Audience · LearningHub</title>
<!-- 18/11/2026: Course Audience là tab Audience trong màn Setup khoá (docs Notion 18/11). Giữ file để link Prototype trên Notion vẫn mở đúng chỗ. -->
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const aud = { limited: 'restricted', all: 'all', empty: 'empty' }[p.get('sc')] || 'restricted';
  location.replace('course-editor.html?r=admin&st=published&tab=audience&pq=on&aud=' + aud + (p.get('t') ? '&t=' + encodeURIComponent(p.get('t')) : ''));
})();
</script>
</head>
<body><p style="font-family:Inter,sans-serif;padding:24px">Opening <a href="course-editor.html?r=admin&amp;st=published&amp;tab=audience">Audience</a>…</p></body>
