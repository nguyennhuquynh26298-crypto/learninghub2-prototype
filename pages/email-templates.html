<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x">
<style>
  /* Review 25/11 (#7): khung email chung theo mẫu email My Techvify (Hara gửi 25/11) — dải navy + logo + dòng nhỏ xanh lá + tiêu đề lớn + Techter;
     thân: lời chào, nội dung, nút CTA xanh lá; chân: email tự động. 8 email của Course Audience và Course Creator & Approval. Chữ email tiếng Anh.
     Góp ý 25/11 (lần 2): xem trước trong khung hộp thư Outlook giả lập; Techter đội mũ cử nhân (ảnh ghép tạm, designer vẽ bản chính thức); logo to hơn.
     Khung Outlook chỉ để trình bày, không phải màn của LearningHub. */
  body { background: var(--neutral-50, #f5f6f8); color: var(--gray-800, #1f2937); font-family: Inter, system-ui, sans-serif; }
  .et { max-width: 1400px; margin: 0 auto; padding: 32px 24px 64px; }
  .et-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .et-head h1 { margin: 0; font-size: 24px; font-weight: 700; }
  .et-head p { margin: 4px 0 0; font-size: 14px; color: var(--gray-600, #4b5563); }
  .et-meta-card { margin-top: 16px; background: #fff; border: 1px solid var(--gray-200, #e5e7eb); border-radius: 12px; padding: 16px 20px; }
  .et-meta-card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .et-meta { margin: 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
  .et-meta dt { color: var(--gray-500, #6b7280); }
  .et-meta dd { margin: 0; color: var(--gray-800, #1f2937); }

  /* ---------- Cửa sổ Outlook giả lập ---------- */
  .ol { --ol-blue: #0f6cbd; --ol-line: #e1dfdd; --ol-sub: #605e5c; --ol-text: #242424; --ol-sel: #e5f1fb;
    height: 780px; display: grid; grid-template-rows: 44px 52px minmax(0, 1fr); border-radius: 10px; overflow: hidden; background: #f3f2f1;
    border: 1px solid #d1d1d1; box-shadow: 0 8px 28px rgba(15, 23, 42, .12); font-family: 'Segoe UI', Inter, system-ui, sans-serif; color: var(--ol-text); font-size: 13px; }
  .ol svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ol-top { background: var(--ol-blue); display: grid; grid-template-columns: 120px minmax(0, 1fr) 120px; align-items: center; padding: 0 14px; }
  .ol-dots { display: flex; gap: 8px; } .ol-dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .ol-dots i:nth-child(2) { background: #febc2e; } .ol-dots i:nth-child(3) { background: #28c840; }
  .ol-search { justify-self: center; width: min(560px, 100%); height: 30px; border-radius: 6px; background: rgba(255,255,255,.16); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
  .ol-tools { background: #fff; border-bottom: 1px solid var(--ol-line); display: flex; align-items: center; gap: 4px; padding: 0 12px; overflow: hidden; white-space: nowrap; }
  .ol-new { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; margin-right: 12px; border-radius: 6px; background: var(--ol-blue); color: #fff; font-weight: 600; font-size: 14px; }
  .ol-tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 4px; color: var(--ol-text); font-size: 14px; }
  .ol-body { display: grid; grid-template-columns: 48px 210px 320px minmax(0, 1fr); min-height: 0; }
  .ol-rail { background: #f3f2f1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px; color: var(--ol-sub); }
  .ol-rail span { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; } .ol-rail span.is-on { background: #fff; color: var(--ol-blue); }
  .ol-folders { background: #f3f2f1; padding: 10px 8px; overflow: hidden; }
  .ol-acct { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px; font-weight: 600; font-size: 13px; min-width: 0; }
  .ol-acct span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-acct svg { width: 14px; height: 14px; }
  .ol-folder { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 22px; border-radius: 4px; color: var(--ol-text); white-space: nowrap; }
  .ol-folder b { margin-left: auto; font-weight: 600; color: var(--ol-blue); font-size: 12px; }
  .ol-folder.is-on { background: #fff; font-weight: 600; }
  .ol-list { background: #fff; border-left: 1px solid var(--ol-line); border-right: 1px solid var(--ol-line); display: flex; flex-direction: column; min-height: 0; }
  .ol-list__head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--ol-line); }
  .ol-tabs { display: inline-flex; background: #f3f2f1; border-radius: 16px; padding: 3px; }
  .ol-tabs span { padding: 4px 14px; border-radius: 14px; font-size: 13px; color: var(--ol-sub); } .ol-tabs span.is-on { background: #fff; color: var(--ol-blue); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ol-list__scroll { overflow-y: auto; min-height: 0; }
  .ol-grp { display: flex; align-items: center; gap: 6px; padding: 10px 12px 4px; font-size: 12px; font-weight: 600; color: var(--ol-sub); }
  .ol-grp svg { width: 12px; height: 12px; }
  .ol-row { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; width: 100%; padding: 10px 12px 10px 18px; border: 0; border-bottom: 1px solid #f3f2f1; background: #fff; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .ol-row:hover { background: #f5f5f5; }
  .ol-row.is-on { background: var(--ol-sel); }
  .ol-row.is-on::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ol-blue); }
  .ol-row.is-unread::after { content: ''; position: absolute; left: 7px; top: 22px; width: 6px; height: 6px; border-radius: 50%; background: var(--ol-blue); }
  .ol-av { width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 1px solid #e1dfdd; display: grid; place-items: center; }
  .ol-av img { width: 22px; height: 22px; }
  .ol-row__l1, .ol-row__l2 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .ol-row__from { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-row__subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ol-text); }
  .ol-row__date { font-size: 12px; color: var(--ol-sub); white-space: nowrap; }
  .ol-row__prev { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ol-sub); }
  .ol-row.is-unread .ol-row__from, .ol-row.is-unread .ol-row__subj { font-weight: 600; } .ol-row.is-unread .ol-row__subj, .ol-row.is-unread .ol-row__date { color: var(--ol-blue); }
  .ol-read { background: #fff; overflow-y: auto; min-height: 0; padding: 18px 24px 32px; }
  .ol-read__subj { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .ol-read__acts { display: flex; gap: 14px; color: var(--ol-sub); }
  .ol-from { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-bottom: 16px; }
  .ol-from .ol-av { width: 44px; height: 44px; } .ol-from .ol-av img { width: 26px; height: 26px; }
  .ol-from__name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ol-from__name span { font-weight: 400; color: var(--ol-sub); }
  .ol-from__to { margin-top: 4px; color: var(--ol-sub); } .ol-from__to b { font-weight: 400; color: var(--ol-text); }
  .ol-from__date { font-size: 12px; color: var(--ol-sub); white-space: nowrap; }
  .ol-mailwrap { display: flex; justify-content: center; padding: 8px 0; }

  /* ---------- Khung email (rộng 600px như email thật) ---------- */
  .mail { width: 600px; max-width: 100%; background: #fff; border: 1px solid #edebe9; border-radius: 4px; overflow: hidden; font-family: Inter, Arial, sans-serif; color: #1f2937; }
  .mail__hero { position: relative; background: linear-gradient(135deg, #0b1f6b 0%, #12309e 100%); color: #fff; padding: 26px 32px 30px; min-height: 230px; overflow: hidden; }
  .mail__hero::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 10px); pointer-events: none; }
  .mail__brand { display: flex; align-items: center; gap: 10px; font-size: 21px; white-space: nowrap; font-weight: 600; letter-spacing: .01em; position: relative; z-index: 1; }
  .mail__brand img { width: 36px; height: 36px; }
  .mail__brand .mail__tvf { width: auto; height: 15px; }
  .mail__div { width: 1px; height: 26px; margin: 0 6px; background: rgba(255,255,255,.35); }
  .mail__brand i { width: 6px; height: 6px; border-radius: 50%; background: #c2f229; display: inline-block; }
  /* Vòng xanh chanh của LearningHub (ảnh footer.png) sau Techter */
  .mail__hero::before { content: ''; position: absolute; right: -46px; top: 34px; width: 230px; height: 230px; border-radius: 50%; border: 28px solid rgba(194, 242, 41, .2); pointer-events: none; }
  .mail__eyebrow { margin: 22px 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tone, #c2f229); position: relative; z-index: 1; }
  .mail__title { margin: 0; max-width: 390px; font-size: 26px; line-height: 1.25; font-weight: 700; position: relative; z-index: 1; }
  .mail__sub { margin: 10px 0 0; max-width: 390px; font-size: 14px; color: #c7d2fe; position: relative; z-index: 1; }
  .mail__techter { position: absolute; right: 26px; bottom: 0; height: 200px; z-index: 1; }
  .mail__body { padding: 28px 32px 8px; font-size: 15px; line-height: 1.6; }
  .mail__body p { margin: 0 0 14px; }
  .mail__body b { font-weight: 600; }
  .mail__kv { margin: 4px 0 18px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
  .mail__kv div { display: grid; grid-template-columns: 140px 1fr; gap: 12px; padding: 10px 14px; font-size: 14px; }
  .mail__kv div + div { border-top: 1px solid #f1f5f9; }
  .mail__kv span { color: #6b7280; }
  .mail__kv s { color: #9ca3af; }
  .mail__note { margin: 4px 0 18px; padding: 12px 14px; border-left: 3px solid #384bfc; background: #f8fafc; border-radius: 0 8px 8px 0; font-size: 14px; }
  .mail__note small { display: block; margin-top: 6px; color: #6b7280; font-size: 12px; }
  .mail__cta { display: inline-block; margin: 6px 0 22px; padding: 12px 28px; border-radius: 8px; background: #384bfc; color: #fff !important; font-size: 15px; font-weight: 600; text-decoration: none; }
  .mail__foot { margin-top: 8px; padding: 20px 32px; background: #f3f4f6; display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 1.6; color: #4b5563; }
  .mail__foot img { width: 28px; height: 28px; flex: none; }
  .mail__foot a { color: #384bfc; font-weight: 600; text-decoration: none; }
  .mail__pre { display: none; }

  @media (max-width: 1340px) { .ol-body { grid-template-columns: 48px 56px 300px minmax(0, 1fr); } .ol-folders { padding: 10px 4px; } .ol-acct, .ol-folder span, .ol-folder b { display: none; } .ol-folder { justify-content: center; padding: 0; } }
  @media (max-width: 1100px) { .ol-body { grid-template-columns: 48px 280px minmax(0, 1fr); } .ol-folders { display: none; } .ol-tool:nth-child(n+6) { display: none; } }
</style>
</head>
<body>
<main class="et">
  <div class="et-head"><div><h1>Email Templates</h1><p>One layout for every LearningHub email, previewed in an Outlook inbox. Pick an email in the message list; its sending rules are below the window.</p></div></div>
  <div class="ol" aria-label="Outlook preview">
    <div class="ol-top"><div class="ol-dots"><i></i><i></i><i></i></div><div class="ol-search" id="ol-search"></div><div></div></div>
    <div class="ol-tools" id="ol-tools"></div>
    <div class="ol-body">
      <div class="ol-rail" id="ol-rail"></div>
      <nav class="ol-folders" id="ol-folders"></nav>
      <div class="ol-list"><div class="ol-list__head"><div class="ol-tabs"><span class="is-on">Focused</span><span>Other</span></div><span id="ol-filter" style="color:#605e5c"></span></div><div class="ol-list__scroll" id="nav" role="listbox" aria-label="Emails"></div></div>
      <section class="ol-read" id="read"></section>
    </div>
  </div>
  <section class="et-meta-card"><h2>Email details</h2><dl class="et-meta" id="meta"></dl></section>
</main>
<script>

  inbox: '<svg viewBox="0 0 24 24"><path d="M3.5 13.5 6 5h12l2.5 8.5V19h-17z"/><path d="M3.5 13.5h5l1 2h5l1-2h5"/></svg>',

};
const rcptOf = (e) => (e.body.match(/^<p>Hi <b>([^<]+)<\/b>/) || [, 'Trần Minh Anh'])[1];
const LOGO = '<img src="../assets/img/logo.png" alt="">';
let cur = new URLSearchParams(location.search).get('e') || 'invite';
const seen = new Set();
document.getElementById('ol-search').innerHTML = `${I.search}Search`;
document.getElementById('ol-tools').innerHTML = `<span class="ol-new">${I.edit}New Email</span>` + [[I.trash, 'Delete'], [I.archive, 'Archive'], [I.shield, 'Report'], [I.move, 'Move'], [I.flag, 'Flag'], [I.unread, 'Mark as Unread']].map(([ic, t]) => `<span class="ol-tool">${ic}${t}</span>`).join('');
document.getElementById('ol-rail').innerHTML = `<span class="is-on">${I.mail}</span><span>${I.cal}</span><span>${I.people}</span><span>${I.star}</span>`;
document.getElementById('ol-filter').innerHTML = I.filter;
function render() {
  const e = EMAILS.find((x) => x.key === cur) || EMAILS[0];
  seen.add(e.key);
  const rcpt = rcptOf(e); const [, longDate] = SENT[e.key];
  const groups = [...new Set(EMAILS.map((x) => x.group))];
  document.getElementById('ol-folders').innerHTML = `<div class="ol-acct" title="${esc(PEOPLE[rcpt] || '')}">${I.chev}<span>${esc(PEOPLE[rcpt] || '')}</span></div>`
    + [[I.inbox, 'Inbox', EMAILS.length - seen.size || ''], [I.draft, 'Drafts', ''], [I.sent, 'Sent', ''], [I.archive, 'Archive', ''], [I.trash, 'Deleted Items', '']]
      .map(([ic, t, n], i) => `<div class="ol-folder ${i ? '' : 'is-on'}" title="${t}">${ic}<span>${t}</span>${n ? `<b>${n}</b>` : ''}</div>`).join('');
  document.getElementById('nav').innerHTML = groups.map((g) => `<div class="ol-grp">${I.chev}${esc(g)}</div>${EMAILS.filter((x) => x.group === g).map((x) => `
    <button type="button" role="option" aria-selected="${x.key === e.key}" class="ol-row ${x.key === e.key ? 'is-on' : ''} ${seen.has(x.key) ? '' : 'is-unread'}" data-e="${x.key}" title="${esc(x.name)} · ${esc(x.when)}">
      <span class="ol-av">${LOGO}</span>
      <span><span class="ol-row__l1"><span class="ol-row__from">LearningHub</span></span>
        <span class="ol-row__l2"><span class="ol-row__subj">${esc(x.subject)}</span><span class="ol-row__date">${SENT[x.key][0]}</span></span>
        <span class="ol-row__prev">${esc(x.pre)}</span></span>
    </button>`).join('')}`).join('');
  document.getElementById('meta').innerHTML = `<dt>Email</dt><dd><b>${esc(e.name)}</b> · ${esc(e.group)}</dd><dt>Subject</dt><dd>${esc(e.subject)}</dd><dt>Preview text</dt><dd>${esc(e.pre)}</dd><dt>To</dt><dd>${esc(e.to)}</dd><dt>Sent when</dt><dd>${esc(e.when)}</dd><dt>Doc</dt><dd>${esc(e.trigger)}</dd>${e.note ? `<dt>Variants</dt><dd>${esc(e.note)}</dd>` : ''}<dt>Sample data</dt><dd>Sender address, recipient and sending time in the inbox are sample data.</dd>`;
  document.getElementById('read').innerHTML = `
    <h2 class="ol-read__subj"><span>${esc(e.subject)}</span><span class="ol-read__acts">${I.reply}${I.replyAll}${I.fwd}</span></h2>
    <div class="ol-from"><span class="ol-av">${LOGO}</span>
      <div style="min-width:0"><div class="ol-from__name">LearningHub <span>&lt;${SENDER}&gt;</span></div><div class="ol-from__to">To: <b>${esc(rcpt)}</b></div></div>
      <div class="ol-from__date">${longDate}</div></div>
    <div class="ol-mailwrap"><div class="mail">
      <span class="mail__pre">${esc(e.pre)}</span>
      <div class="mail__hero" style="--tone:${TONE[e.tone]}"><div class="mail__brand"><img class="mail__tvf" src="../assets/img/techvify-logo.svg" alt="TECHVIFY"><span class="mail__div"></span><img src="../assets/img/logo.png" alt="">Learning<i></i>Hub</div>
        <p class="mail__eyebrow">${esc(e.eyebrow)}</p><h2 class="mail__title">${esc(e.title)}</h2><p class="mail__sub">${esc(e.sub)}</p>
        <img class="mail__techter" src="../assets/img/techter-grad.png" alt=""></div>
      <div class="mail__body">${e.body}<a class="mail__cta" href="${e.href}" target="_blank" rel="noopener">${esc(e.cta)}</a></div>
      <div class="mail__foot"><img src="../assets/img/logo.png" alt=""><div>TECHVIFY · Learning &amp; Development · <a href="../hoc-vien.html" target="_blank" rel="noopener">Open LearningHub</a><br>This email was sent automatically by LearningHub. Please do not reply.</div></div></div></div>`;
  document.getElementById('read').scrollTop = 0;
}
document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-e]'); if (b) { cur = b.dataset.e; history.replaceState(null, '', `?e=${cur}`); render(); } });
render();
</script>
