<style>
  /* Details — Figma nested Section → Lesson → Content */
  .su-panel { min-height: 200px; display: flex; flex-direction: column; gap: 24px; padding: 28px 32px; width: 100%; box-sizing: border-box; }
  .su-sec { border: 1px solid var(--c-border); border-radius: 12px; padding: 16px 20px; background: var(--c-bg-subtle); display: flex; flex-direction: column; gap: 12px; }
  .su-sec__head { display: flex; align-items: center; gap: 8px; }
  .su-sec__name { flex: 1; font-size: var(--fs-md); font-weight: 700; color: var(--adm-text); }
  .su-icon { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .su-icon svg { width: 18px; height: 18px; }
  .su-icon--edit { color: var(--adm-primary); }
  .su-icon--edit:hover { background: var(--adm-primary-50); }
  .su-icon--del { color: var(--c-danger-icon); }
  .su-icon--del:hover { background: var(--c-danger-bg); }
  .su-icon--chev { color: var(--adm-sub); background: var(--c-white); border: 1px solid var(--adm-stroke); border-radius: 999px; width: 28px; height: 28px; }
  .su-les { background: var(--c-white); border: 1px solid var(--c-bg-selected); border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); display: flex; flex-direction: column; gap: 12px; }
  .su-les__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .su-les__title { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-md); font-weight: 600; color: var(--adm-text); flex: 1; min-width: 140px; }
  /* D-186: dòng Quiz — nhãn trạng thái gom thành 1 cụm chữ nhỏ ngay sau tên Quiz; cụm nút ở bên phải */
  .su-les--quiz .su-les__title { flex: 0 1 auto; }
  /* 25/11 Hara "label chạy 2 hàng linh tinh": dòng Quiz 2 tầng có chủ đích — tên Quiz (1 dòng, dài thì "…")
     + dòng phụ trạng thái ngay dưới tên, thẳng mép trái tên; cụm nút căn giữa theo chiều dọc ở bên phải */
  .su-les--quiz .su-les__row { flex-wrap: nowrap; }
  .su-les__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .su-les--quiz .su-les__title { flex: none; min-width: 0; max-width: 100%; overflow: hidden; }
  .qz-status { display: flex; align-items: center; flex-wrap: nowrap; white-space: nowrap; padding-left: 0; }
  .qz-status .qz-pr { height: 20px; padding: 0; }
  .qz-status > * + *::before { content: "·"; margin: 0 8px; color: var(--adm-sub); font-weight: 400; text-decoration: none; display: inline-block; }
  .su-les__title svg { width: 18px; height: 18px; color: var(--adm-primary); flex: none; }
  .su-les__acts { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
  .btn-add-les { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--adm-primary); background: var(--adm-primary-soft); color: var(--adm-primary); font: 500 var(--fs-sm) Inter, sans-serif; cursor: pointer; width: fit-content; }
  .btn-add-les:hover { background: var(--adm-primary-50); }
  .btn-link { border: 0; background: none; color: var(--adm-sub); font: 500 var(--fs-sm) Inter, sans-serif; cursor: pointer; padding: 0 8px; }
  .btn-link--blue { color: var(--adm-primary); }
  .btn-link--danger { color: var(--c-danger-icon); }
  .su-inline { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .su-inline__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .su-inline .adm-field { gap: 6px; }
  .ctype { border: 1.5px dashed var(--c-brand-200); border-radius: 12px; padding: 20px; background: var(--c-white); display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .ctype p { margin: 0; font-size: var(--fs-sm); color: var(--adm-sub); max-width: 420px; }
  .ctype a { color: var(--adm-primary); text-decoration: none; font-weight: 500; }
  .ctype__grid { display: flex; justify-content: center; align-items: flex-start; gap: 32px; width: 100%; flex-wrap: nowrap; }
  .ctype__grid button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 500 var(--fs-sm) Inter, sans-serif; color: var(--adm-body); padding: 8px 4px; border-radius: 8px; min-width: 0; }
  .ctype__grid button:hover { background: var(--adm-primary-50); color: var(--adm-primary); }
  .ctype__grid button span.ctype__label { white-space: nowrap; text-align: center; line-height: 1.3; }
  .ctype__ic { width: 48px; height: 48px; border-radius: 12px; background: var(--adm-primary-soft); color: var(--adm-primary); display: grid; place-items: center; flex: none; }
  .ctype__ic svg { width: 24px; height: 24px; }
  .art-box { border: 1px solid var(--c-brand-200); border-radius: 12px; padding: 16px; background: var(--c-bg-subtle); display: flex; flex-direction: column; gap: 12px; }
  .art-box .adm-btn-combo { padding-top: 0; }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--adm-stroke); border-radius: 8px; background: var(--c-white); flex-wrap: wrap; }
  .file-row__ic { width: 36px; height: 36px; border-radius: 8px; background: var(--c-warning-bg); color: var(--c-warning-icon); display: grid; place-items: center; flex: none; }
  .file-row__ic svg { width: 18px; height: 18px; }
  .file-row__meta { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 2px; }
  .file-row__meta b { font-size: var(--fs-sm); color: var(--adm-text); }
  .file-row__meta span { font-size: var(--fs-xs); color: var(--adm-sub); }
  /* 25/11 Hara: ngày tải lên và trạng thái (Completed / % done) cùng một hàng, trạng thái sát mép phải */
  .file-row__sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .file-row__st { white-space: nowrap; }
  .file-row__st.is-done { color: var(--c-success, #16a34a); font-weight: 500; }
  .file-row__bar { width: 100%; height: 6px; border-radius: 999px; background: var(--c-warning-bg); overflow: hidden; margin-top: 4px; }
  .file-row__bar i { display: block; height: 100%; background: var(--c-star); border-radius: 999px; }
  .file-row__acts { display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .dropzone { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1.5px dashed var(--c-brand-300); border-radius: 12px; padding: 28px 20px; text-align: center; background: var(--c-white); cursor: pointer; color: var(--adm-sub); font-size: var(--fs-sm); }
  .dropzone__ic { width: 44px; height: 44px; border-radius: 999px; background: var(--adm-primary); color: var(--c-white); display: grid; place-items: center; }
  .dropzone__ic svg { width: 20px; height: 20px; }
  .dropzone b { color: var(--adm-text); font-size: var(--fs-sm); }
  .thumb { aspect-ratio: 16/9; max-width: 360px; border-radius: 12px; border: 1.5px dashed var(--adm-field-stroke); background: var(--adm-side); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--adm-sub); font-size: var(--fs-sm); cursor: pointer; }
  .thumb.is-ok { border-style: solid; background: linear-gradient(135deg, var(--adm-primary), var(--c-brand-300)); color: var(--c-white); border-color: transparent; }
  .adm-err { font-size: var(--fs-xs); color: var(--c-danger-icon); margin: 0; }
  .adm-err:empty { display: none; }
  .dur { display: inline-flex; align-items: center; gap: 6px; height: 44px; border: 1px solid var(--adm-field-stroke); border-radius: 8px; padding: 0 12px; width: fit-content; background: var(--c-white); box-shadow: 0 1px 2px rgba(10,13,18,.05); }
  .dur input { border: 0; outline: 0; width: 2.75ch; text-align: center; font: 400 var(--fs-md) Inter, sans-serif; background: none; }
  .cc-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; }
  @media (max-width: 720px) { .cc-row { grid-template-columns: 1fr; } .ctype__grid { flex-wrap: wrap; gap: 16px; } }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  fieldset:disabled { opacity: .65; pointer-events: none; }
  .opt-row { display: grid; grid-template-columns: 28px 1fr 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .q-list { display: flex; flex-direction: column; gap: 8px; }
  .q-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--adm-stroke); border-radius: 8px; background: var(--c-white); }
  .q-item b { flex: 1; font-size: var(--fs-sm); }
  .q-item .meta { font-size: var(--fs-xs); color: var(--adm-sub); }
  #basic, .su-panel--basic { gap: 24px; max-width: none; width: 100%; box-sizing: border-box; }
  .su-panel--basic .rte { min-width: 0; width: 100%; }
  .su-panel--basic .rte__bar { flex-wrap: wrap; row-gap: 6px; }
  .su-panel--basic .rte__body { min-height: 120px; }
  .preview-box { border: 1px solid var(--adm-stroke); border-radius: 10px; padding: 14px 16px; background: var(--c-bg-subtle); position: relative; text-align: left; }
  .preview-box h4 { margin: 0 0 6px; font-size: var(--fs-sm); color: var(--adm-text); }
  .preview-box p { margin: 0; font-size: var(--fs-xs); color: var(--adm-sub); line-height: 1.5; }
  .preview-box .su-icon { position: absolute; top: 8px; right: 8px; }
</style>

<body>
<div id="header"></div>
<main>
  <div id="top"></div>
  <div class="adm-seg" id="tabs" role="tablist"></div>
  <div id="panel"></div>
</main>
<script src="../assets/js/components.js?v=1125d"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/setup-lh2.js?v=1125qd"></script>
<script>
const { ICON, esc, toast, AdminLayout, AdminHead, AdminConfirm, Modal, Richbox, wireRichbox } = LH; const D = LHData;
wireRichbox();
const P = new URLSearchParams(location.search);
const SUBS = { 'Data & AI': ['AI Agent', 'Machine Learning', 'Applied & Advanced'], 'Software Development': ['Testing', 'Web', 'DevOps'], 'Corporate & Mandatory Training': ['Role-based Training', 'Onboarding'], Language: ['English', 'Japanese'] };
const TIMES = [['', 'No limit'], ['5', '5 minutes'], ['10', '10 minutes'], ['15', '15 minutes'], ['30', '30 minutes'], ['45', '45 minutes'], ['60', '60 minutes'], ['90', '90 minutes'], ['120', '120 minutes']];
let role = LH.admRole(P.get('r') || 'admin');
let st = P.get('st') || 'draft';
/* Practice không còn tab riêng — khối trên Details (cùng page Add Question với Exam) */
/* Link cũ ?focus=practice / #practice → mở tab Practice */
let tab = ['basic', 'audience', 'practice'].includes(P.get('tab')) ? P.get('tab') : (P.get('focus') === 'practice' || location.hash === '#practice' ? 'practice' : 'details');
let title = P.get('t') || (st === 'published' ? 'Claude Certified Architect – Foundations' : 'Abc');
let editable = st === 'draft' || st === 'rev-draft';
let hasThumb = !!P.get('thumb');
let basicErr = false;
let lessonSeq = 0;
let creatingSection = false;
let editingSec = null; /* si */
let editingLes = null; /* 'si:li' */

function mkLesson(partial) {
  return {
    id: nextLessonNo(), type: 'lecture', name: '', open: true, content: null, picking: false,
    articleHtml: '', articleEditing: false, files: [], questions: null, quiz: null, ...partial,
  };
}
/* Đề thi mẫu cho Quiz có sẵn (để kiểm trùng đề luyện tập và điều kiện Publish) */
const sampleQs = () => D.examQuestions.map((q) => ({ type: q.type, text: q.text, score: 1, options: [...q.options], correct: [...q.correct], explain: q.explain || '' }));
function normalizeSections(raw) {
  return raw.map((s) => ({
    name: s.name, ui: 'idle', lessons: (s.lessons || []).map((l) => {
      if (l.type === 'quiz' || l.content === 'quiz') {
        return mkLesson({
          id: l.id || nextLessonNo(), type: 'quiz', name: l.name, content: 'quiz',
          questions: l.questions || sampleQs(), quiz: l.quiz || { time: '65', pass: 80, desc: '' },
          open: false, picking: false, // web: dòng Quiz mặc định thu gọn
        });
      }
      const content = l.content === 'video' ? 'video' : (l.content === 'document' || l.content === 'mashup') ? 'document' : l.content === 'article' ? 'article' : null;
      return mkLesson({
        id: l.id || nextLessonNo(), type: 'lecture', name: l.name, content,
        files: content && content !== 'article' ? [{ name: content === 'document' ? 'Slides.pdf' : 'Design.mp4', size: '2mb', at: '11.12.2025, 8:34 AM', pct: 100 }] : [],
        articleHtml: l.article || l.articleHtml || '', open: true, picking: !content,
      });
    }),
  }));
}

let sections = [{ name: 'Introduction', ui: 'idle', lessons: [] }];
if (st === 'published' || title.includes('Claude') || title.includes('Playwright')) {
  sections = normalizeSections(D.course.sessions.slice(0, 2).map((s) => ({
    name: s.name,
    lessons: s.lessons.map(([k, n]) => {
      lessonSeq++;
      return { id: lessonSeq, type: k === 'quiz' ? 'quiz' : 'lecture', name: n, content: k === 'quiz' ? 'quiz' : (k === 'video' ? 'video' : k === 'file' ? 'document' : 'article') };
    }),
  })));
}

const $ = (id) => document.getElementById(id);
const closeModal = () => document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove());
const openModal = (html) => { closeModal(); document.body.insertAdjacentHTML('beforeend', html); };
function nextLessonNo() { lessonSeq++; return lessonSeq; }
/* BR-EX-17: "Lesson n" chung một dãy cho Lecture và Quiz, đánh lại từ 1 ở mỗi Section */
function renumber() {
  sections.forEach((s) => s.lessons.forEach((l, k) => { l.num = k + 1; }));
}
function iconBtn(kind, attrs) {
  if (kind === 'edit') return `<button type="button" class="su-icon su-icon--edit" ${attrs} aria-label="Edit">${ICON.edit}</button>`;
  if (kind === 'del') return `<button type="button" class="su-icon su-icon--del" ${attrs} aria-label="Delete">${ICON.trash}</button>`;
  return `<button type="button" class="su-icon su-icon--chev" ${attrs} aria-label="Toggle">${ICON.chevronU}</button>`;
}

function renderTop() {
  AdminLayout({ active: 'courses', collapsed: false, role });
  const q = '?r=' + role;
  const actions = editable
    ? `<button type="button" class="btn-cta" data-publish>Publish</button>`
    : `<button type="button" class="btn-cta" data-edit>${ICON.edit}Edit</button>`;
  $('top').innerHTML = AdminHead({
    back: 'admin-courses.html' + q + (st === 'published' ? '&t=published' : '&t=draft'),
    title: esc(title),
    right: actions,
  });
  /* D-167 (20/11): Details · Basic Information · Audience — Practice chuyển vào từng dòng Quiz (tab Exam Questions · Practice Questions) */
  const T2 = LHSetup.tabs();
  $('tabs').innerHTML = [['details', 'Details'], ['basic', 'Basic Information'], ['audience', T2.audience]].map(([k, t]) =>
    `<button type="button" role="tab" aria-selected="${tab === k}" class="${tab === k ? 'is-active' : ''} ${k === 'basic' && basicErr ? 'is-err' : ''}" data-tab="${k}">${esc(t)}</button>`).join('');
}

/* ---------- Lesson body (content / quiz) ---------- */
function contentPicker(si, li) {
  return `<div class="ctype">
    <p>Select the main type of content. Files and links can be added as resources. <a href="#" data-learn-types>Learn about content types.</a></p>
    <div class="ctype__grid">
      <button type="button" data-set-content="${si}:${li}:video"><span class="ctype__ic">${ICON.video}</span><span class="ctype__label">Video</span></button>
      <button type="button" data-set-content="${si}:${li}:document"><span class="ctype__ic">${ICON.file}</span><span class="ctype__label">Document (PDF)</span></button>
      <button type="button" data-set-content="${si}:${li}:article"><span class="ctype__ic">${ICON.sheet}</span><span class="ctype__label">Article</span></button>
    </div>
  </div>`;
}
function fileRows(l, si, li) {
  const rows = (l.files || []).map((f, fi) => `<div class="file-row">
    <span class="file-row__ic">${ICON.file}</span>
    <div class="file-row__meta">
      <b>${esc(f.name)}${f.size ? ` (${esc(f.size)})` : ''}</b>
      <span class="file-row__sub"><span>${esc(f.at || '')}</span>${f.pct != null ? `<span class="file-row__st ${f.pct === 100 ? 'is-done' : ''}">${f.pct < 100 ? `${f.pct}% done · ${esc(f.speed || '')}` : 'Completed'}</span>` : ''}</span>
      ${f.pct != null ? `<div class="file-row__bar"><i style="width:${Math.min(100, f.pct)}%"></i></div>` : ''}
    </div>
    <span class="file-row__acts">
      ${editable ? `<button type="button" class="su-icon su-icon--edit" data-add-res="${si}:${li}" title="Add resource" aria-label="Add resource">${ICON.plus}</button>
      <button type="button" class="su-icon su-icon--del" data-file-del="${si}:${li}:${fi}" title="Delete" aria-label="Delete">${ICON.trash}</button>` : ''}
    </span>
  </div>`).join('');
  const drop = editable ? `<label class="dropzone" data-drop="${si}:${li}">
    <span class="dropzone__ic">${ICON.upload}</span>
    <b>Drag &amp; Drop your files here</b>
    <span>Or click to browse files</span>
  </label>` : '';
  return `${rows}${drop}`;
}
function articleBlock(l, si, li) {
  if (l.articleEditing || !l.articleHtml) {
    return `<div class="art-box">
      <span class="adm-label">Article Description</span>
      ${Richbox({ ph: 'Write article...', html: l.articleHtml || '', bodyAttrs: `id="art-${si}-${li}"` })}
      ${editable ? `<div class="adm-btn-combo"><button type="button" class="btn-cta" data-art-save="${si}:${li}">Save</button></div>` : ''}
    </div>`;
  }
  return `<div class="preview-box">
    ${editable ? `<button type="button" class="su-icon su-icon--edit" data-art-edit="${si}:${li}" aria-label="Edit">${ICON.edit}</button>` : ''}
    <h4>Title 1</h4>
    <p>${esc(l.articleHtml.replace(/<[^>]+>/g, ' ').trim().slice(0, 160) || 'Article content')}</p>
  </div>${editable ? fileRows({ files: l.files || [] }, si, li) : ''}`;
}
function practiceKey() { for (let si = 0; si < sections.length; si++) { const li = sections[si].lessons.findIndex((l) => l.type === 'quiz'); if (li >= 0) return `${si}:${li}`; } return ''; }
/* D-172: mỗi Quiz một đề luyện tập riêng. LHSetup giữ đề của Quiz đang mở tab Practice; đề các Quiz khác cất trong banks */
let pqKey = '', banks = {};
const activePQ = () => pqKey || practiceKey();
function bankOf(k) { if (k === activePQ()) return { n: LHSetup.practiceCount(), on: LHSetup.practiceEnabled() }; const b = banks[k]; return { n: b ? b.questions.length : 0, on: !!(b && b.enabled) }; }
function usePractice(k) {
  const cur = activePQ(); if (!k || k === cur) { pqKey = k || pqKey; return; }
  banks[cur] = { questions: LHSetup.practiceDraft(), enabled: LHSetup.practiceEnabled() };
  const next = banks[k] || { questions: [], enabled: false }; delete banks[k];
  LHSetup.restorePractice(next); pqKey = k;
  LHSetup.writePracticeStore({ questions: next.questions, enabled: !!next.enabled, banks, pqKey, course: title });
}
function openPractice(k) {
  if (!k) return; usePractice(k);
  sections.forEach((sec, si) => sec.lessons.forEach((L, li) => { if (L.type === 'quiz' && `${si}:${li}` !== k && L.qtab === 'practice') L.qtab = 'exam'; }));
  const [si, li] = k.split(':').map(Number); const L = sections[si].lessons[li]; L.open = true; L.qtab = 'practice';
}
function openPracticeQuiz() { openPractice(activePQ()); }
function attachPractice() { const h = document.querySelector('[data-pq-host]'); if (h) LHSetup.drawPractice(h); }
function lessonBody(l, si, li) {
  if (l.type === 'quiz') {
    if (LHSetup.qfIs(`${si}:${li}`) && LHSetup.qfEditing() < 0) return `<div class="qz-body">${LHSetup.qfHtml()}</div>`; // Add Question: form dưới dòng Quiz (web)
    if (!l.open) return '';
    /* Kế thừa web (QuizBlock): mở rộng dòng Quiz = danh sách câu (nội dung · loại · điểm · sửa · xoá); sửa câu = form thay chỗ danh sách.
       LH2 thêm (Exam 3.7): dòng Passing Score + số câu cần đúng; câu trùng đề luyện tập hiện đỏ (BR-PQ-03). */
    const key = `${si}:${li}`;
    if (LHSetup.qfIs(key) && LHSetup.qfEditing() >= 0) return `<div class="qz-body">${LHSetup.qfHtml()}</div>`;
    const qs = l.questions || [];
    /* D-167: mỗi Quiz có đề luyện tập riêng — 2 tab Exam Questions · Practice Questions (Practice · Admin 3, Exam 3.7).
       Prototype: đề luyện tập demo gắn với Quiz đầu tiên; Quiz khác hiện đề rỗng. */
    if (l.qtab === 'practice' && key !== activePQ()) usePractice(key);
    const pn = bankOf(key).n;
    const qtabs = `<div class="qz-tabs" role="tablist"><button type="button" role="tab" data-qtab="${key}|exam" class="${l.qtab !== 'practice' ? 'is-active' : ''}">Exam Questions (${qs.length})</button><button type="button" role="tab" data-qtab="${key}|practice" class="${l.qtab === 'practice' ? 'is-active' : ''}">Practice Questions (${pn})</button></div>`;
    if (l.qtab === 'practice') return `<div class="qz-body">${qtabs}<div data-pq-host="${key}"></div></div>`;
    const tot = qs.reduce((a, q) => a + (+q.score || 0), 0), pass = (l.quiz && l.quiz.pass) || 80;
    const errOf = (q) => LHSetup.dupErr('exam', q.text, -1);
    if (!qs.length) return `<div class="qz-body">${qtabs}<p class="qz-empty">No questions yet. Add your first question!</p></div>`;
    return `<div class="qz-body">${qtabs}<p class="qz-pass">Passing Score ${pass}% · learners need <b>${Math.ceil(pass * tot / 100)}/${tot}</b> points</p>
      ${LHSetup.questionRows({ list: qs, ns: key, withScore: true, errOf, editable, fresh: new Set(Array.isArray(l.fresh) ? l.fresh : []) })}</div>`;
  }
  if (!l.open) return '';
  if (l.picking) return contentPicker(si, li);
  if (l.content === 'article') return articleBlock(l, si, li);
  if (l.content === 'video' || l.content === 'document') return fileRows(l, si, li);
  return '';
}

function lessonCard(l, si, li) {
  /* Kế thừa web: "Lesson n: · icon · tên" / "Quiz n: · 💡 · tên". Dòng Quiz: Import Questions · Add Question · sửa · xoá · mở rộng;
     đang mở form thêm câu thì chỉ còn nút đóng (×). LH2 thêm: "n questions · p points" + số câu lỗi, Quiz 0 câu báo vàng (chưa Publish được). */
  const isQuiz = l.type === 'quiz', key = `${si}:${li}`;
  const formAdd = isQuiz && LHSetup.qfIs(key) && LHSetup.qfEditing() < 0;
  const label = `Lesson ${l.num}:`; // BR-EX-17: Quiz và Lecture chung dãy "Lesson n"
  const qn = (l.questions || []).length, qp = (l.questions || []).reduce((a, q) => a + (+q.score || 0), 0);
  const qErr = isQuiz ? (l.questions || []).filter((q) => LHSetup.dupErr('exam', q.text, -1)).length : 0;
  const quizMeta = isQuiz ? (qn
    ? `<span class="quiz-meta">${qn} question${qn === 1 ? '' : 's'} · ${qp} point${qp === 1 ? '' : 's'}</span>${qErr ? `<span class="qz-sum__err">${ICON.alert}${qErr} with errors</span>` : ''}`
    : `<span class="quiz-meta is-warn" title="The course can't be published until this quiz has questions.">${ICON.alert}0 questions</span>`) + (() => { const b = bankOf(key); return `<button type="button" class="qz-pr ${b.on ? 'is-on' : ''}" data-pq-open="${key}" title="Open Practice Questions">${ICON.dumbbell || ''}${b.on ? `Practice on · ${b.n}` : b.n ? `Practice off · ${b.n}` : 'No practice questions'}</button>`; })() : '';
  const ic = isQuiz ? ICON.lightbulb : ICON.book;
  const addContent = editable && l.type === 'lecture' && !l.content && !l.picking
    ? `<button type="button" class="btn-cta btn-cta--outline btn-cta--sm" data-content="${si}:${li}">${ICON.plus}Add Content</button>`
    : (editable && l.type === 'lecture' && l.picking
      ? `<span class="adm-hint" style="font-size: var(--fs-xs)">Select content type</span><button type="button" class="su-icon" data-pick-clear="${si}:${li}" aria-label="Clear">${ICON.x}</button>`
      : '');
  /* BR-EX-20: khoá đang Published → nút câu hỏi tắt như web, rê chuột thấy lý do */
  const lockTip = 'Click Edit to create a draft version before changing questions.';
  /* D-168: nút trên dòng Quiz áp cho tab đang mở. Tab Practice sửa được cả khi khoá Published (BR-PQ-13) */
  const quizActs = !isQuiz || formAdd ? '' : (editable || l.qtab === 'practice')
    ? `<button type="button" class="btn-cta btn-cta--outline btn-cta--sm" data-q-import="${key}">${ICON.upload}Import Questions</button><button type="button" class="btn-cta btn-cta--outline btn-cta--sm" data-q-add="${key}">${ICON.plus}Add Question</button>`
    : `<span title="${lockTip}"><button type="button" class="btn-cta btn-cta--outline btn-cta--sm" disabled>${ICON.upload}Import Questions</button></span><span title="${lockTip}"><button type="button" class="btn-cta btn-cta--outline btn-cta--sm" disabled>${ICON.plus}Add Question</button></span>`;
  return `<div class="su-les ${isQuiz ? 'su-les--quiz' : ''}" data-les="${key}">
    <div class="su-les__row">
      ${isQuiz ? '<div class="su-les__main">' : ''}<span class="su-les__title">${esc(label)} · ${ic}${editingLes === key
        ? `<input class="adm-input" id="les-ren" value="${esc(l.name)}" style="max-width:240px;height:36px"><button type="button" class="btn-cta btn-cta--sm" data-les-ren-save="${key}">Save</button>`
        : `<span title="${esc(l.name)}">${esc(l.name)}</span>`}</span>
      ${isQuiz ? `<span class="qz-status">${quizMeta}</span></div>` : ''}${addContent}${quizActs}
      ${editable ? (formAdd
        ? `<span class="su-les__acts"><button type="button" class="su-icon" data-qf-cancel aria-label="Close">${ICON.x}</button></span>`
        : `<span class="su-les__acts">
        ${iconBtn('edit', `data-les-edit="${key}"`)}
        ${iconBtn('del', `data-les-del="${key}"`)}
        <button type="button" class="su-icon su-icon--chev" data-les-tog="${key}" aria-label="Toggle">${l.open ? ICON.chevronU : ICON.chevronD}</button>
      </span>`) : ''}
    </div>
    ${lessonBody(l, si, li)}
  </div>`;
}

  renumber();
  const draft = creatingSection ? `<div class="su-sec">
    <div class="su-sec__head"><span class="su-sec__name">Section ${sections.length + 1}:</span></div>

  $('panel').innerHTML = `<div class="su-details-stack" style="display:flex;flex-direction:column;gap:24px">

  attachPractice();
}

/* Luật chung field bắt buộc (LH.reqGuard) cho form Quiz: Quiz Title trống / Passing Score ngoài 1–100 → đỏ tại field, nút Save tắt */
/* Luật chung (D-152, D-154): field bắt buộc trống → nút Save tắt; rời field còn trống → đỏ tại field. Áp cho Section, Lecture, Quiz */
const quizGuard = LH.reqGuard({
  root: $('panel'),
  rules: () => [
    /* Section mới: Section Title bắt buộc */
    ...(creatingSection && $('sec-name') ? [{ key: 'sec', el: $('sec-name'), ok: !!$('sec-name').value.trim(), msg: 'Please enter Name', msgEl: $('sec-err') }] : []),

  ].concat(sections.flatMap((s, si) => {
    if (s.ui !== 'newQuiz') return [];

    return [
      { key: `${si}:title`, el: t, ok: !!t.value.trim(), msg: 'Please enter Quiz Title', msgEl: $(`qz-err-${si}`) },
      { key: `${si}:pass`, el: p, ok: pv !== '' && Number.isInteger(pn) && pn >= 1 && pn <= 100, msg: 'Passing Score must be between 1 and 100%.', msgEl: $(`qz-pass-err-${si}`) },
    ];
  })),
  buttons: () => [
    ...(creatingSection ? [{ el: document.querySelector('[data-sec-save]'), keys: ['sec'] }] : []),
    ...sections.map((s, si) => (s.ui === 'newLecture' ? { el: document.querySelector(`[data-lec-save="${si}"]`), keys: [`${si}:lec`] } : null)).filter(Boolean),
    ...sections.map((s, si) => (s.ui === 'newQuiz' ? { el: document.querySelector(`[data-quiz-save="${si}"]`), keys: [`${si}:title`, `${si}:pass`] } : null)).filter(Boolean),
  ],
});

/* Form câu thi ngay tại chỗ (kế thừa web QuestionForm) — Save lưu ngay vào Quiz */
function openExamForm(si, li, index, type = null) {
  const L = sections[si].lessons[li];
  if (index < 0) L.open = false; else L.open = true;
  LHSetup.qfOpen(`${si}:${li}`, { index, q: index >= 0 ? L.questions[index] : null, withScore: true, bank: 'exam', type,
    onSave: (out, idx, again) => {
      L.questions = L.questions || [];
      if (idx >= 0) L.questions[idx] = out; else L.questions.push(out);
      L.open = true; L.fresh = [idx >= 0 ? idx : L.questions.length - 1];
      LHSetup.writePracticeStore({ sectionsSnapshot: sections, course: title });
      toast(idx >= 0 ? `Question ${idx + 1} updated` : `Question ${L.questions.length} added`);
      if (again) { L.fresh = []; openExamForm(si, li, -1, again); return; } // D-187: Save & Add Another
      drawDetails();
    },
    onClose: () => drawDetails() });
  drawDetails(); document.getElementById('qf-text')?.focus();
}
LHSetup.init({
  editable: true,
  getTitle: () => title,
  getExam: () => sections.flatMap((s) => s.lessons.filter((l) => l.type === 'quiz').flatMap((l) => (l.questions || []).map((q, k) => ({ quiz: l.name, n: k + 1, text: q.text })))),
  onChange: () => { renderTop(); if (tab === 'details') drawDetails(); },
  goTab: (t) => { tab = t; render(); },
});

let pendingQResult = LHSetup.consumeQuestionResult();
const pendingQSess = LHSetup.loadQuestionEditorSession();
function hydrateFromQuestionEditor() {
  const r = pendingQResult;
  if (!r) return;
  pendingQResult = null;
  if (pendingQSess?.sectionsSnapshot) sections = pendingQSess.sectionsSnapshot;
  /* Lưu ngay + tô dòng vừa thêm / sửa (câu sửa: đúng vị trí; câu thêm: các vị trí mới) */
  const edIdx = pendingQSess && pendingQSess.index >= 0 ? pendingQSess.index : -1;
  const freshOf = (before, after) => (edIdx >= 0 ? [edIdx] : Array.from({ length: Math.max(0, after - before) }, (_, k) => before + k));
  if (r.bank === 'practice') {
    const before = LHSetup.practiceDraft().length, next = r.questions || [];
    LHSetup.commitPractice(next);
    LHSetup.writePracticeStore({ course: title });
    LHSetup.markPracticeFresh(freshOf(before, next.length));
    toast(edIdx >= 0 ? `Question ${edIdx + 1} updated` : (next.length - before > 1 ? `Questions ${before + 1}–${next.length} added` : `Question ${next.length} added`));
    tab = 'practice';
  } else if (r.bank === 'exam' && r.si != null && r.li != null) {
    const L = sections[r.si]?.lessons?.[r.li];
    if (L) {
      const before = (L.questions || []).length;
      L.questions = (r.questions || []).map((q) => ({ ...q })); L.open = true; L.fresh = freshOf(before, L.questions.length);
      toast(edIdx >= 0 ? `Question ${edIdx + 1} updated` : (L.questions.length - before > 1 ? `Questions ${before + 1}–${L.questions.length} added` : `Question ${L.questions.length} added`));
    }
    LHSetup.writePracticeStore({ sectionsSnapshot: sections, course: title });
    tab = 'details';
  }
  try { sessionStorage.removeItem('lh2-q-editor'); } catch (_) {}
}


document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]') || e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; render(); return; }

  /* Section */
  if (e.target.closest('[data-sec-add]')) { creatingSection = true; editingSec = null; drawDetails(); return; }
  if (e.target.closest('[data-sec-cancel]')) { creatingSection = false; drawDetails(); return; }
  if (e.target.closest('[data-sec-save]')) {
    const name = ($('sec-name')?.value || '').trim();
    const err = $('sec-err');
    if (!name) { if (err) err.textContent = 'Please enter Name'; return; }
    sections.push({ name, ui: 'idle', lessons: [] });
    creatingSection = false; drawDetails(); toast('Section created successfully'); return;
  }
  const se = e.target.closest('[data-sec-edit]'); if (se) { editingSec = +se.dataset.secEdit; editingLes = null; drawDetails(); return; }
  if (e.target.closest('[data-sec-ren-cancel]')) { editingSec = null; drawDetails(); return; }
  const srs = e.target.closest('[data-sec-ren-save]'); if (srs) {
    const name = ($('sec-ren')?.value || '').trim();
    if (!name) { toast('Please enter Name'); return; }
    sections[+srs.dataset.secRenSave].name = name; editingSec = null; drawDetails(); return;
  }
  const sd = e.target.closest('[data-sec-del]'); if (sd) {
    AdminConfirm({ danger: true, title: 'Delete section?', text: 'Lessons inside will be removed.', ok: 'Delete', onOk: () => { sections.splice(+sd.dataset.secDel, 1); drawDetails(); } }); return;
  }

  /* Add lesson pick / lecture / quiz inline */
  const pick = e.target.closest('[data-les-pick]'); if (pick) {
    sections.forEach((s) => { s.ui = 'idle'; });
    sections[+pick.dataset.lesPick].ui = 'addLesson'; drawDetails(); return;
  }
  const lc = e.target.closest('[data-les-cancel]'); if (lc) { sections[+lc.dataset.lesCancel].ui = 'idle'; drawDetails(); return; }
  const nl = e.target.closest('[data-new-lecture]'); if (nl) { sections[+nl.dataset.newLecture].ui = 'newLecture'; drawDetails(); return; }
  const nq = e.target.closest('[data-new-quiz]'); if (nq) { sections[+nq.dataset.newQuiz].ui = 'newQuiz'; drawDetails(); return; }
  const ls = e.target.closest('[data-lec-save]'); if (ls) {
    const si = +ls.dataset.lecSave;
    const name = ($(`lec-name-${si}`)?.value || '').trim();
    const err = $(`lec-err-${si}`);
    if (!name) { if (err) err.textContent = 'Please enter Name'; return; }
    sections[si].lessons.push(mkLesson({ name, picking: false, content: null }));
    sections[si].ui = 'idle'; drawDetails(); toast('Lesson created successfully'); return;
  }
  const qs = e.target.closest('[data-quiz-save]'); if (qs) {
    const si = +qs.dataset.quizSave;
    const name = ($(`qz-title-${si}`)?.value || '').trim();
    const err = $(`qz-err-${si}`);
    if (!name) { if (err) err.textContent = 'Please enter Quiz Title'; return; }
    const pass = +$(`qz-pass-${si}`).value;
    if (!(pass >= 1 && pass <= 100) || !Number.isInteger(pass)) { $(`qz-pass-err-${si}`).textContent = 'Passing Score must be between 1 and 100%.'; return; }
    sections[si].lessons.push(mkLesson({
      type: 'quiz', name, content: 'quiz', questions: [], open: false,
      quiz: { time: $(`qz-time-${si}`).value, pass, desc: ($(`qz-desc-${si}`)?.value || '').trim() }, // BR-EX-14: không có ô số lượt
    }));
    sections[si].ui = 'idle'; drawDetails(); toast('Quiz created successfully'); return;
  }

  /* Lesson card */
  const le = e.target.closest('[data-les-edit]'); if (le) { editingLes = le.dataset.lesEdit; editingSec = null; drawDetails(); return; }
  const lrs = e.target.closest('[data-les-ren-save]'); if (lrs) {
    const [si, li] = lrs.dataset.lesRenSave.split(':').map(Number);
    const name = ($('les-ren')?.value || '').trim();
    if (!name) { toast('Please enter Name'); return; }
    sections[si].lessons[li].name = name; editingLes = null; drawDetails(); return;
  }
  const ld = e.target.closest('[data-les-del]'); if (ld) {
    const [si, li] = ld.dataset.lesDel.split(':').map(Number);
    AdminConfirm({ danger: true, title: 'Delete lesson?', ok: 'Delete', onOk: () => { sections[si].lessons.splice(li, 1); drawDetails(); } }); return;
  }
  const lt = e.target.closest('[data-les-tog]'); if (lt) {
    const [si, li] = lt.dataset.lesTog.split(':').map(Number);
    sections[si].lessons[li].open = !sections[si].lessons[li].open; drawDetails(); return;
  }
  const ct = e.target.closest('[data-content]'); if (ct) {
    const [si, li] = ct.dataset.content.split(':').map(Number);
    sections[si].lessons[li].picking = true; sections[si].lessons[li].open = true; drawDetails(); return;
  }
  const pc = e.target.closest('[data-pick-clear]'); if (pc) {
    const [si, li] = pc.dataset.pickClear.split(':').map(Number);
    sections[si].lessons[li].picking = false; drawDetails(); return;
  }
  const sc = e.target.closest('[data-set-content]'); if (sc) {
    const [si, li, kind] = sc.dataset.setContent.split(':');
    const L = sections[+si].lessons[+li];
    L.content = kind; L.picking = false; L.open = true;
    if (kind === 'article') { L.articleEditing = true; L.files = []; }
    else { L.files = []; L.articleEditing = false; }
    drawDetails(); toast('Content type saved'); return;
  }
  const as = e.target.closest('[data-art-save]'); if (as) {
    const [si, li] = as.dataset.artSave.split(':').map(Number);
    const body = $(`art-${si}-${li}`);
    sections[si].lessons[li].articleHtml = (body?.innerHTML || '').trim();
    sections[si].lessons[li].articleEditing = false;
    drawDetails(); toast('Lesson article created successfully'); return;
  }
  const ae = e.target.closest('[data-art-edit]'); if (ae) {
    const [si, li] = ae.dataset.artEdit.split(':').map(Number);
    sections[si].lessons[li].articleEditing = true; drawDetails(); return;
  }
  const ar = e.target.closest('[data-add-res]'); if (ar) {
    const [si, li] = ar.dataset.addRes.split(':').map(Number);
    const L = sections[si].lessons[li];
    if (!L.files) L.files = [];
    L.files.push({ name: 'file.pdf', size: '2mb', at: '18.11.2026, 11:30 AM', pct: 100 });
    drawDetails(); toast('Resource added'); return;
  }
  const drop = e.target.closest('[data-drop]'); if (drop) {
    const [si, li] = drop.dataset.drop.split(':').map(Number);
    const L = sections[si].lessons[li];
    if (!L.files) L.files = [];
    L.files.push({ name: 'Design.mp4', size: '2mb', at: '18.11.2026, 11:30 AM', pct: 55, speed: '90KB/Sec' });
    drawDetails();
    setTimeout(() => {
      const f = L.files[L.files.length - 1]; if (f && f.pct < 100) { f.pct = 100; f.speed = ''; drawDetails(); }
    }, 1200);
    return;
  }
  const fd = e.target.closest('[data-file-del]'); if (fd) {
    const [si, li, fi] = fd.dataset.fileDel.split(':').map(Number);
    AdminConfirm({
      title: 'Warning', text: 'Are you sure you want to delete this resource?', ok: 'Confirm', danger: false,
      onOk: () => { sections[si].lessons[li].files.splice(fi, 1); drawDetails(); toast('Resource deleted'); },
    }); return;
  }
  if (e.target.closest('[data-learn-types]')) { e.preventDefault(); toast('Content types: Video, Document (PDF), Article'); return; }

  if (e.target.closest('[data-pq-soft]')) { openPracticeQuiz(); tab = 'details'; render(); return; }
  const po = e.target.closest('[data-pq-open]'); if (po) { openPractice(po.dataset.pqOpen); drawDetails(); document.querySelector(`[data-les="${po.dataset.pqOpen}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  /* D-187: "+ Add Question" cuối danh sách câu — mở form ngay, không phải cuộn lên dòng Quiz */
  const qra = e.target.closest('[data-qr-add]'); if (qra) { const ns = qra.dataset.qrAdd;
    if (ns === 'p') document.querySelector('[data-pq-host] [data-pq-add]')?.click();
    else { const [si, li] = ns.split(':').map(Number); openExamForm(si, li, -1); }
    return; }
  const qt = e.target.closest('[data-qtab]'); if (qt) { const [k, v] = qt.dataset.qtab.split('|'); const [si, li] = k.split(':').map(Number); if (v === 'practice') openPractice(k); else sections[si].lessons[li].qtab = v; drawDetails(); return; }
  if (e.target.closest('[data-pq-demo]')) { toast('Prototype: the demo practice set is on the first quiz of the course.'); return; }
  /* Dòng câu thi (component chung LHSetup.questionRows, ns = "si:li"): Delete hỏi xác nhận rồi lưu ngay · Edit mở trang soạn câu */
  const qd = e.target.closest('[data-qr-del]'); if (qd && !qd.dataset.qrDel.startsWith('p|')) {
    const [ns, i] = qd.dataset.qrDel.split('|'); const [si, li] = ns.split(':').map(Number); const L = sections[si].lessons[li];
    AdminConfirm({ cancel: 'Cancel', title: `Delete question ${+i + 1}?`, text: esc(L.questions[+i].text) + (L.questions.length === 1 ? '<br><br>This is the last question. The course can\'t be published until this quiz has questions.' : ''), ok: 'Delete', danger: true,
      onOk: () => { L.questions.splice(+i, 1); LHSetup.writePracticeStore({ sectionsSnapshot: sections, course: title }); drawDetails(); toast(`Question ${+i + 1} deleted`); } });
    return;
  }
  const qr = e.target.closest('[data-qr-edit]'); if (qr && !qr.dataset.qrEdit.startsWith('p|')) {
    const [ns, i] = qr.dataset.qrEdit.split('|'); const [si, li] = ns.split(':').map(Number);
    openExamForm(si, li, +i); return;
  }
  /* D-168: một bộ nút Import Questions · Add Question trên dòng Quiz, áp cho tab đang mở (Exam hoặc Practice) — không lặp nút trong tab */
  const rowBtn = e.target.closest('[data-q-add], [data-q-import]');
  if (rowBtn) {
    const k = rowBtn.dataset.qAdd || rowBtn.dataset.qImport; const [si0, li0] = k.split(':').map(Number); const L0 = sections[si0].lessons[li0];
    if (L0.qtab === 'practice') {
      openPractice(k); if (!document.querySelector('[data-pq-host]')) drawDetails();
      document.querySelector(`[data-pq-host] ${rowBtn.dataset.qAdd ? '[data-pq-add]' : '[data-pq-import]'}`)?.click(); return;
    }
  }
  /* Add Question (web): form hiện ngay dưới dòng Quiz, danh sách thu lại */
  const qa = e.target.closest('[data-q-add]'); if (qa) {
    const [si, li] = qa.dataset.qAdd.split(':').map(Number);
    openExamForm(si, li, -1); return;
  }
  const qe = e.target.closest('[data-q-edit]'); if (qe) {
    const [si, li, qi] = qe.dataset.qEdit.split(':').map(Number);
    openExamForm(si, li, qi); return;
  }
  const qi = e.target.closest('[data-q-import]'); if (qi) {
    const [si, li] = qi.dataset.qImport.split(':').map(Number);
    LHSetup.importModal({ bank: 'exam', onImport: (qs) => { const L = sections[si].lessons[li]; L.questions = L.questions || []; const a = L.questions.length + 1; L.questions.push(...qs.map((q) => ({ ...q, score: q.score != null ? q.score : 1 }))); L.open = true; L.fresh = qs.map((_, k) => a - 1 + k); LHSetup.writePracticeStore({ sectionsSnapshot: sections, course: title }); drawDetails(); return [a, L.questions.length]; } }); return;
  }

  if (e.target.closest('[data-thumb]')) {
    if (!editable) return;
    hasThumb = true; toast('Thumbnail uploaded successfully'); drawBasic(); return;
  }
  if (e.target.closest('[data-basic-save]')) {
    title = $('b-title')?.value.trim() || title; toast('Course updated successfully'); renderTop(); return;
  }
  if (e.target.closest('[data-publish]')) {
    /* Course Information 3.3 (BR-CI-08) → Cannot publish yet; Course Audience 3.7 (BR-AUD-09) → popup Scope + N learners */
    LHSetup.publish({ title, sections, onDone: () => { st = 'published'; editable = false; basicErr = false; toast('Course published successfully'); render(); } }); return;
  }
  if (e.target.closest('[data-edit]')) {
    AdminConfirm({ title: 'Edit Course Version', text: 'This version is published. You can edit it by creating a new version.', ok: 'Continue', onOk: () => {
      st = 'rev-draft'; editable = true; toast('Draft version created'); render();
    } }); return;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'b-cat') drawSub();
  if (e.target.id && e.target.id.startsWith('qz-nolimit-')) {
    const si = e.target.id.replace('qz-nolimit-', '');
    const att = $(`qz-att-${si}`); if (att) att.disabled = e.target.checked;
  }
});

LH.DemoBar('Course setup · Details Figma', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin'], ['editor', 'Editor']] },
  { label: 'Status', key: 'st', options: [['draft', 'DRAFT'], ['published', 'PUBLISHED']] },
  { label: 'Tab', key: 'tab', options: [['details', 'Details'], ['basic', 'Basic Information'], ['audience', 'Audience'], ['practice', 'Details · Quiz → Practice Questions']] },
  { label: 'Practice (first quiz)', key: 'pq', options: [['empty', 'Off · chưa có câu (bài thi cũ)'], ['off', 'Off · có 4 câu'], ['on', 'On · 4 câu'], ['dup', 'On · có câu trùng đề thi'], ['full', 'On · 498 câu (gần giới hạn 500)']] },
  { label: 'Audience', key: 'aud', options: [['all', 'All Company'], ['restricted', 'Restricted · QA, QC Automation'], ['mandatory', 'Restricted QA · Mandatory'], ['empty', 'Restricted · chưa chọn ai']] },
  { label: 'Thumbnail', key: 'thumb', options: [['', 'None'], ['1', 'Uploaded']] },
  { label: 'Import file', key: 'imp', options: [['good', 'Valid Excel'], ['word', 'Word file (.docx)'], ['nohead', 'Excel without header'], ['big', 'Over 200 questions']] },
], (s) => {
  LHSetup.setImportFile(s.imp);
  role = LH.admRole(s.r); st = s.st; hasThumb = !!s.thumb;
  tab = !window.__pqRestored && !P.get('tab') && tab === 'practice' ? 'practice' : s.tab; // giữ tab Practice khi mở bằng link cũ ?focus=practice
  editable = st === 'draft' || st === 'rev-draft';
  basicErr = false; creatingSection = false; editingSec = null; editingLes = null;
  LHSetup.audience.published = st === 'published';
  if (st === 'published') {
    title = P.get('t') || 'Claude Certified Architect – Foundations';
    sections = normalizeSections(D.course.sessions.slice(0, 2).map((sess) => ({
      name: sess.name,
      lessons: sess.lessons.map(([k, n]) => ({
        type: k === 'quiz' ? 'quiz' : 'lecture',
        name: n,
        content: k === 'quiz' ? 'quiz' : (k === 'video' ? 'video' : k === 'file' ? 'document' : 'article'),
      })),
    })));
  } else if (P.get('t')) {
    title = P.get('t');
  }
  LHSetup.seedPractice(s.pq); LHSetup.seedAudience(s.aud); pqKey = ''; banks = {};
  /* Quay về từ màn Practice Questions: đề lấy từ kho chung (trừ khi URL chọn kịch bản pq khác) */
  const pStore = window.__pqRestored ? null : LHSetup.readPracticeStore();
  window.__pqRestored = true; // chỉ khôi phục ở lần nạp đầu; đổi DemoBar sau đó dùng kịch bản đã chọn
  if (pStore && !P.get('pq') && (!pStore.course || pStore.course === title)) { LHSetup.restorePractice(pStore); if (pStore.sectionsSnapshot) sections = pStore.sectionsSnapshot; banks = pStore.banks || {}; pqKey = pStore.pqKey || ''; }
  hydrateFromQuestionEditor();
  render();
});
</script>
</body>
</html>
