<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course setup · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1118p"><link rel="stylesheet" href="../assets/css/base.css?v=1118p"><link rel="stylesheet" href="../assets/css/components.css?v=1118p">
<link rel="stylesheet" href="../assets/css/admin.css?v=1118p">
<style>
  /* Details — Figma nested Section → Lesson → Content */
  .su-panel { min-height: 200px; display: flex; flex-direction: column; gap: 16px; padding: 20px; }
  .su-sec { border: 1px solid #e4e7ec; border-radius: 12px; padding: 16px 20px; background: #fafbff; display: flex; flex-direction: column; gap: 12px; }
  .su-sec__head { display: flex; align-items: center; gap: 8px; }
  .su-sec__name { flex: 1; font-size: 16px; font-weight: 700; color: var(--adm-text); }
  .su-icon { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .su-icon svg { width: 18px; height: 18px; }
  .su-icon--edit { color: var(--adm-primary); }
  .su-icon--edit:hover { background: var(--adm-primary-50); }
  .su-icon--del { color: #f04438; }
  .su-icon--del:hover { background: #fef3f2; }
  .su-icon--chev { color: var(--adm-sub); background: #fff; border: 1px solid var(--adm-stroke); border-radius: 999px; width: 28px; height: 28px; }
  .su-les { background: #fff; border: 1px solid #eef0fe; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); display: flex; flex-direction: column; gap: 12px; }
  .su-les__row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .su-les__title { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--adm-text); flex: 1; min-width: 140px; }
  .su-les__title svg { width: 18px; height: 18px; color: var(--adm-primary); flex: none; }
  .su-les__acts { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
  .btn-add-les { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--adm-primary); background: var(--adm-primary-soft); color: var(--adm-primary); font: 500 14px Inter, sans-serif; cursor: pointer; width: fit-content; }
  .btn-add-les:hover { background: var(--adm-primary-50); }
  .btn-outline-sm { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--adm-primary); background: #fff; color: var(--adm-primary); font: 500 14px Inter, sans-serif; cursor: pointer; }
  .btn-outline-sm:hover { background: var(--adm-primary-50); }
  .btn-link { border: 0; background: none; color: var(--adm-sub); font: 500 14px Inter, sans-serif; cursor: pointer; padding: 0 8px; }
  .btn-link--blue { color: var(--adm-primary); }
  .btn-link--danger { color: #f04438; }
  .su-inline { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .su-inline__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .su-inline .adm-field { gap: 6px; }
  .ctype { border: 1.5px dashed #c7d2fe; border-radius: 12px; padding: 20px; background: #fff; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .ctype p { margin: 0; font-size: 14px; color: var(--adm-sub); max-width: 420px; }
  .ctype a { color: var(--adm-primary); text-decoration: none; font-weight: 500; }
  .ctype__grid { display: flex; justify-content: center; align-items: flex-start; gap: 32px; width: 100%; flex-wrap: nowrap; }
  .ctype__grid button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 500 13px Inter, sans-serif; color: var(--adm-body); padding: 8px 4px; border-radius: 8px; min-width: 0; }
  .ctype__grid button:hover { background: var(--adm-primary-50); color: var(--adm-primary); }
  .ctype__grid button span.ctype__label { white-space: nowrap; text-align: center; line-height: 1.3; }
  .ctype__ic { width: 48px; height: 48px; border-radius: 12px; background: var(--adm-primary-soft); color: var(--adm-primary); display: grid; place-items: center; flex: none; }
  .ctype__ic svg { width: 24px; height: 24px; }
  .art-box { border: 1px solid #c7d2fe; border-radius: 12px; padding: 16px; background: #f8f9ff; display: flex; flex-direction: column; gap: 12px; }
  .art-box .adm-btn-combo { padding-top: 0; }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--adm-stroke); border-radius: 8px; background: #fff; flex-wrap: wrap; }
  .file-row__ic { width: 36px; height: 36px; border-radius: 8px; background: #fef7c3; color: #ca8a04; display: grid; place-items: center; flex: none; }
  .file-row__ic svg { width: 18px; height: 18px; }
  .file-row__meta { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 2px; }
  .file-row__meta b { font-size: 14px; color: var(--adm-text); }
  .file-row__meta span { font-size: 12px; color: var(--adm-sub); }
  .file-row__bar { width: 100%; height: 6px; border-radius: 999px; background: #fef7c3; overflow: hidden; margin-top: 4px; }
  .file-row__bar i { display: block; height: 100%; background: #eab308; border-radius: 999px; }
  .file-row__acts { display: inline-flex; gap: 4px; align-items: center; flex: none; }
  .dropzone { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1.5px dashed #93c5fd; border-radius: 12px; padding: 28px 20px; text-align: center; background: #fff; cursor: pointer; color: var(--adm-sub); font-size: 14px; }
  .dropzone__ic { width: 44px; height: 44px; border-radius: 999px; background: var(--adm-primary); color: #fff; display: grid; place-items: center; }
  .dropzone__ic svg { width: 20px; height: 20px; }
  .dropzone b { color: var(--adm-text); font-size: 15px; }
  .thumb { aspect-ratio: 16/9; max-width: 360px; border-radius: 12px; border: 1.5px dashed var(--adm-field-stroke); background: var(--adm-side); display: grid; place-items: center; text-align: center; padding: 24px; color: var(--adm-sub); font-size: 14px; cursor: pointer; }
  .thumb.is-ok { border-style: solid; background: linear-gradient(135deg, var(--adm-primary), #9396ff); color: #fff; border-color: transparent; }
  .adm-err { font-size: 13px; color: #f04438; margin: 0; }
  .adm-err:empty { display: none; }
  .dur { display: inline-flex; align-items: center; gap: 6px; height: 44px; border: 1px solid var(--adm-field-stroke); border-radius: 8px; padding: 0 12px; width: fit-content; background: #fff; box-shadow: 0 1px 2px rgba(10,13,18,.05); }
  .dur input { border: 0; outline: 0; width: 2.75ch; text-align: center; font: 400 16px Inter, sans-serif; background: none; }
  .cc-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; }
  @media (max-width: 720px) { .cc-row { grid-template-columns: 1fr; } .ctype__grid { flex-wrap: wrap; gap: 16px; } }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  fieldset:disabled { opacity: .65; pointer-events: none; }
  .opt-row { display: grid; grid-template-columns: 28px 1fr 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .q-list { display: flex; flex-direction: column; gap: 8px; }
  .q-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--adm-stroke); border-radius: 8px; background: #fff; }
  .q-item b { flex: 1; font-size: 14px; }
  .q-item .meta { font-size: 13px; color: var(--adm-sub); }
  #basic { gap: 16px; }
  .preview-box { border: 1px solid var(--adm-stroke); border-radius: 10px; padding: 14px 16px; background: #f8fafc; position: relative; text-align: left; }
  .preview-box h4 { margin: 0 0 6px; font-size: 15px; color: var(--adm-text); }
  .preview-box p { margin: 0; font-size: 13px; color: var(--adm-sub); line-height: 1.5; }
  .preview-box .su-icon { position: absolute; top: 8px; right: 8px; }
</style>
</head>
<body>
<div id="header"></div>
<main>
  <div id="top"></div>
  <div class="adm-seg" id="tabs" role="tablist"></div>
  <div id="panel"></div>
</main>
<script src="../assets/js/components.js?v=1118p"></script>
<script src="../assets/js/data.js?v=1118g"></script>
<script src="../assets/js/setup-lh2.js?v=1118p"></script>
<script>
const { ICON, esc, toast, AdminLayout, AdminHead, AdminConfirm, Modal, Richbox, wireRichbox } = LH; const D = LHData;
wireRichbox();
const P = new URLSearchParams(location.search);
const SUBS = { 'Data & AI': ['AI Agent', 'Machine Learning', 'Applied & Advanced'], 'Software Development': ['Testing', 'Web', 'DevOps'], 'Corporate & Mandatory Training': ['Role-based Training', 'Onboarding'], Language: ['English', 'Japanese'] };
const TIMES = [['', 'No limit'], ['5', '5 minutes'], ['10', '10 minutes'], ['15', '15 minutes'], ['30', '30 minutes'], ['45', '45 minutes'], ['60', '60 minutes'], ['90', '90 minutes'], ['120', '120 minutes']];
let role = LH.admRole(P.get('r') || 'admin');
let st = P.get('st') || 'draft';
let tab = ['basic', 'audience', 'practice'].includes(P.get('tab')) ? P.get('tab') : 'details';
let title = P.get('t') || (st === 'published' ? 'Claude Certified Architect – Foundations' : 'Abc');
let editable = st === 'draft' || st === 'rev-draft';
let hasThumb = !!P.get('thumb');
let basicErr = false;
let lessonSeq = 0;
let creatingSection = false;
let editingSec = null; /* si */
let editingLes = null; /* 'si:li' */

function mkLesson(partial) {
  return {
    id: nextLessonNo(), type: 'lecture', name: '', open: true, content: null, picking: false,
    articleHtml: '', articleEditing: false, files: [], questions: null, quiz: null, ...partial,
  };
}
/* Đề thi mẫu cho Quiz có sẵn (để kiểm trùng đề luyện tập và điều kiện Publish) */
const sampleQs = () => D.examQuestions.map((q) => ({ type: q.type, text: q.text, score: 1, options: [...q.options], correct: [...q.correct], explain: q.explain || '' }));
function normalizeSections(raw) {
  return raw.map((s) => ({
    name: s.name, ui: 'idle', lessons: (s.lessons || []).map((l) => {
      if (l.type === 'quiz' || l.content === 'quiz') {
        return mkLesson({
          id: l.id || nextLessonNo(), type: 'quiz', name: l.name, content: 'quiz',
          questions: l.questions || sampleQs(), quiz: l.quiz || { time: '65', pass: 80, desc: '' },
          open: true, picking: false,
        });
      }
      const content = l.content === 'video' ? 'video' : l.content === 'mashup' ? 'mashup' : l.content === 'article' ? 'article' : (l.content === 'document' ? 'video' : null);
      return mkLesson({
        id: l.id || nextLessonNo(), type: 'lecture', name: l.name, content,
        files: content && content !== 'article' ? [{ name: 'Design.mp4', size: '2mb', at: '11.12.2025, 8:34 AM', pct: 100 }] : [],
        articleHtml: l.article || l.articleHtml || '', open: true, picking: !content,
      });
    }),
  }));
}

let sections = [{ name: 'Introduction', ui: 'idle', lessons: [] }];
if (st === 'published' || title.includes('Claude') || title.includes('Playwright')) {
  sections = normalizeSections(D.course.sessions.slice(0, 2).map((s) => ({
    name: s.name,
    lessons: s.lessons.map(([k, n]) => {
      lessonSeq++;
      return { id: lessonSeq, type: k === 'quiz' ? 'quiz' : 'lecture', name: n, content: k === 'quiz' ? 'quiz' : (k === 'video' ? 'video' : 'article') };
    }),
  })));
}

const $ = (id) => document.getElementById(id);
const closeModal = () => document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove());
const openModal = (html) => { closeModal(); document.body.insertAdjacentHTML('beforeend', html); };
function nextLessonNo() { lessonSeq++; return lessonSeq; }
/* BR-EX-17: "Lesson n" chung một dãy cho Lecture và Quiz, đánh lại từ 1 ở mỗi Section */
function renumber() {
  sections.forEach((s) => s.lessons.forEach((l, k) => { l.num = k + 1; }));
}
function iconBtn(kind, attrs) {
  if (kind === 'edit') return `<button type="button" class="su-icon su-icon--edit" ${attrs} aria-label="Edit">${ICON.edit}</button>`;
  if (kind === 'del') return `<button type="button" class="su-icon su-icon--del" ${attrs} aria-label="Delete">${ICON.trash}</button>`;
  return `<button type="button" class="su-icon su-icon--chev" ${attrs} aria-label="Toggle">${ICON.chevronU}</button>`;
}

function renderTop() {
  AdminLayout({ active: 'courses', collapsed: false, role });
  const q = '?r=' + role;
  const actions = editable
    ? `<button type="button" class="btn-cta" data-publish>Publish</button>`
    : `<button type="button" class="btn-cta" data-edit>${ICON.edit}Edit</button>`;
  $('top').innerHTML = AdminHead({
    back: 'admin-courses.html' + q + (st === 'published' ? '&t=published' : '&t=draft'),
    title: esc(title),
    right: actions,
  });
  /* Practice · Admin 3: tab Details · Basic Information · Audience · Practice (n) */
  const T2 = LHSetup.tabs();
  $('tabs').innerHTML = [['details', 'Details'], ['basic', 'Basic Information'], ['audience', T2.audience], ['practice', T2.practice]].map(([k, t]) =>
    `<button type="button" role="tab" aria-selected="${tab === k}" class="${tab === k ? 'is-active' : ''} ${k === 'basic' && basicErr ? 'is-err' : ''}" data-tab="${k}">${esc(t)}</button>`).join('');
}

/* ---------- Lesson body (content / quiz) ---------- */
function contentPicker(si, li) {
  return `<div class="ctype">
    <p>Select the main type of content. Files and links can be added as resources. <a href="#" data-learn-types>Learn about content types.</a></p>
    <div class="ctype__grid">
      <button type="button" data-set-content="${si}:${li}:video"><span class="ctype__ic">${ICON.file}</span><span class="ctype__label">Video</span></button>
      <button type="button" data-set-content="${si}:${li}:mashup"><span class="ctype__ic">${ICON.video}</span><span class="ctype__label">Video &amp; Slide Mashup</span></button>
      <button type="button" data-set-content="${si}:${li}:article"><span class="ctype__ic">${ICON.sheet}</span><span class="ctype__label">Article</span></button>
    </div>
  </div>`;
}
function fileRows(l, si, li) {
  const rows = (l.files || []).map((f, fi) => `<div class="file-row">
    <span class="file-row__ic">${ICON.file}</span>
    <div class="file-row__meta">
      <b>${esc(f.name)}${f.size ? ` (${esc(f.size)})` : ''}</b>
      <span>${esc(f.at || '')}</span>
      ${f.pct != null && f.pct < 100 ? `<div class="file-row__bar"><i style="width:${f.pct}%"></i></div><span>${f.pct}% done · ${esc(f.speed || '')}</span>` : (f.pct === 100 ? `<div class="file-row__bar"><i style="width:100%"></i></div><span>Completed</span>` : '')}
    </div>
    <span class="file-row__acts">
      ${editable ? `<button type="button" class="su-icon su-icon--edit" data-add-res="${si}:${li}" title="Add resource" aria-label="Add resource">${ICON.plus}</button>
      <button type="button" class="su-icon su-icon--del" data-file-del="${si}:${li}:${fi}" title="Delete" aria-label="Delete">${ICON.trash}</button>` : ''}
    </span>
  </div>`).join('');
  const drop = editable ? `<label class="dropzone" data-drop="${si}:${li}">
    <span class="dropzone__ic">${ICON.upload}</span>
    <b>Drag &amp; Drop your files here</b>
    <span>Or click to browse files</span>
  </label>` : '';
  return `${rows}${drop}`;
}
function articleBlock(l, si, li) {
  if (l.articleEditing || !l.articleHtml) {
    return `<div class="art-box">
      <span class="adm-label">Article Description</span>
      ${Richbox({ ph: 'Write article...', html: l.articleHtml || '', bodyAttrs: `id="art-${si}-${li}"` })}
      ${editable ? `<div class="adm-btn-combo"><button type="button" class="btn-cta" data-art-save="${si}:${li}">Save</button></div>` : ''}
    </div>`;
  }
  return `<div class="preview-box">
    ${editable ? `<button type="button" class="su-icon su-icon--edit" data-art-edit="${si}:${li}" aria-label="Edit">${ICON.edit}</button>` : ''}
    <h4>Title 1</h4>
    <p>${esc(l.articleHtml.replace(/<[^>]+>/g, ' ').trim().slice(0, 160) || 'Article content')}</p>
  </div>${editable ? fileRows({ files: l.files || [] }, si, li) : ''}`;
}
function lessonBody(l, si, li) {
  if (!l.open) return '';
  if (l.type === 'quiz') {
    const TYPES = { single: 'Single choice', multi: 'Multiple choice', tf: 'True / False' };
    const qs = (l.questions || []).map((q, qi) => { const dup = LHSetup.dupErr('exam', q.text, -1);
      return `<div class="q-item" ${dup ? 'style="border-color:#f04438;background:#fef3f2"' : ''}><span class="meta">Q${qi + 1}</span><b>${esc(q.text)}${dup ? `<br><small style="color:#b42318;font-weight:500">${esc(dup)}</small>` : ''}</b><span class="meta">${TYPES[q.type] || q.type} · ${q.score} pt</span></div>`; }).join('');
    const tot = (l.questions || []).reduce((a, q) => a + (+q.score || 0), 0), pass = (l.quiz && l.quiz.pass) || 80;
    const need = `${tot ? `<p class="adm-hint">Passing Score ${pass}% · Learners need ${Math.ceil(pass * tot / 100)}/${tot} points to pass</p>` : ''}`;
    return `<div class="q-list">${need}${qs}
      ${editable ? `<div class="su-inline__row">
        <button type="button" class="btn-outline-sm" data-q-import="${si}:${li}">Import Questions</button>
        <button type="button" class="btn-cta btn-cta--soft btn-cta--sm" data-q-add="${si}:${li}">Add Question</button>
      </div>` : ''}
    </div>`;
  }
  if (l.picking) return contentPicker(si, li);
  if (l.content === 'article') return articleBlock(l, si, li);
  if (l.content === 'video' || l.content === 'mashup') return fileRows(l, si, li);
  return '';
}

function lessonCard(l, si, li) {
  const label = `Lesson ${l.num}`;
  const qn = (l.questions || []).length, qp = (l.questions || []).reduce((a, q) => a + (+q.score || 0), 0);
  const quizMeta = l.type === 'quiz' ? `<span class="quiz-meta">${qn} question${qn === 1 ? '' : 's'} · ${qp} point${qp === 1 ? '' : 's'}</span>` : '';
  const ic = l.type === 'quiz' ? ICON.quiz : ICON.book;
  const addContent = editable && l.type === 'lecture' && !l.content && !l.picking
    ? `<button type="button" class="btn-outline-sm" data-content="${si}:${li}">${ICON.plus}Add Content</button>`
    : (editable && l.type === 'lecture' && l.picking
      ? `<span class="adm-hint" style="font-size:13px">Select content type</span><button type="button" class="su-icon" data-pick-clear="${si}:${li}" aria-label="Clear">${ICON.x}</button>`
      : '');
  return `<div class="su-les" data-les="${si}:${li}">
    <div class="su-les__row">
      <span class="su-les__title">${esc(label)} · ${ic}${editingLes === si + ':' + li
        ? `<input class="adm-input" id="les-ren" value="${esc(l.name)}" style="max-width:240px;height:36px"><button type="button" class="btn-cta btn-cta--sm" data-les-ren-save="${si}:${li}">Save</button>`
        : `<span>${esc(l.name)}</span>`}</span>
      ${quizMeta}${addContent}
      ${editable ? `<span class="su-les__acts">
        ${iconBtn('edit', `data-les-edit="${si}:${li}"`)}
        ${iconBtn('del', `data-les-del="${si}:${li}"`)}
        <button type="button" class="su-icon su-icon--chev" data-les-tog="${si}:${li}" aria-label="Toggle">${l.open ? ICON.chevronU : ICON.chevronD}</button>
      </span>` : ''}
    </div>
    ${lessonBody(l, si, li)}
  </div>`;
}

function sectionUi(s, si) {
  if (s.ui === 'addLesson') {
    return `<div class="su-inline__row">
      <button type="button" class="btn-add-les" data-new-lecture="${si}">${ICON.plus}Add Lecture</button>
      <button type="button" class="btn-link" data-les-cancel="${si}">Cancel</button>
      <button type="button" class="btn-link btn-link--blue" data-new-quiz="${si}">${ICON.plus}Quiz</button>
    </div>`;
  }
  if (s.ui === 'newLecture') {
    return `<div class="su-inline">
      <div class="adm-field"><label>Lesson Title <span class="req">*</span></label>
        <input class="adm-input" id="lec-name-${si}" placeholder="Enter lesson title" maxlength="60"><p class="adm-err" id="lec-err-${si}"></p></div>
      <div class="su-inline__row">
        <button type="button" class="btn-cta btn-cta--sm" data-lec-save="${si}">Save</button>
        <button type="button" class="btn-link" data-les-cancel="${si}">Cancel</button>
      </div>
    </div>`;
  }
  if (s.ui === 'newQuiz') {
    return `<div class="su-inline" style="background:#fff;border-radius:10px;padding:14px;border:1px solid var(--adm-stroke)">
      <div class="adm-field"><label>Quiz Title <span class="req">*</span></label><input class="adm-input" id="qz-title-${si}" placeholder="Enter quiz title"><p class="adm-err" id="qz-err-${si}"></p></div>
      <div class="adm-field"><span class="adm-label">Quiz Description</span><textarea class="adm-input" id="qz-desc-${si}" rows="2" placeholder="Optional"></textarea></div>
      <div class="cc-row">
        <div class="adm-field"><label>Time Limit</label><select class="adm-input" id="qz-time-${si}">${TIMES.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>
        <div class="adm-field"><label>Passing Score (%) <span class="req">*</span></label><input class="adm-input" id="qz-pass-${si}" type="number" min="1" max="100" value="80"><p class="adm-err" id="qz-pass-err-${si}"></p></div>
      </div>
      <p class="quiz-note">Every exam has 3 attempts. Later attempts show the previous answers with Correct / Incorrect labels. Correct answers are revealed only after the learner passes or uses all attempts.</p>
      <div class="su-inline__row">
        <button type="button" class="btn-cta btn-cta--sm" data-quiz-save="${si}">Save</button>
        <button type="button" class="btn-link" data-les-cancel="${si}">Cancel</button>
      </div>
    </div>`;
  }
  return editable ? `<button type="button" class="btn-add-les" data-les-pick="${si}">${ICON.plus}Add Lesson</button>` : '';
}

function sectionBlock(s, si) {
  const head = editingSec === si
    ? `<div class="su-sec__head"><span class="su-sec__name">Section ${si + 1}:</span>
        <input class="adm-input" id="sec-ren" value="${esc(s.name)}" style="flex:1;height:36px;max-width:320px">
        <button type="button" class="btn-cta btn-cta--sm" data-sec-ren-save="${si}">Save</button>
        <button type="button" class="btn-link" data-sec-ren-cancel>Cancel</button></div>`
    : `<div class="su-sec__head"><span class="su-sec__name">Section ${si + 1}: ${esc(s.name)}</span>
        ${editable ? `${iconBtn('edit', `data-sec-edit="${si}"`)}${iconBtn('del', `data-sec-del="${si}"`)}` : ''}</div>`;
  return `<div class="su-sec" data-sec="${si}">
    ${head}
    ${s.lessons.map((l, li) => lessonCard(l, si, li)).join('')}
    ${sectionUi(s, si)}
  </div>`;
}

function drawDetails() {
  renumber();
  const draft = creatingSection ? `<div class="su-sec">
    <div class="su-sec__head"><span class="su-sec__name">Section ${sections.length + 1}:</span></div>
    <div class="adm-field"><label>Section Title <span class="req">*</span></label>
      <input class="adm-input" id="sec-name" placeholder="Enter section title" maxlength="60"><p class="adm-err" id="sec-err"></p></div>
    <div class="su-inline__row">
      <button type="button" class="btn-cta btn-cta--sm" data-sec-save>Save</button>
      <button type="button" class="btn-link" data-sec-cancel>Cancel</button>
    </div>
  </div>` : '';
  $('panel').innerHTML = `<div class="adm-card su-panel" id="struct">
    ${sections.map((s, si) => sectionBlock(s, si)).join('')}
    ${draft}
    ${editable && !creatingSection ? `<button type="button" class="btn-cta" data-sec-add style="align-self:flex-start">${ICON.plus}Section</button>` : ''}
  </div>`;
  if (creatingSection) $('sec-name')?.focus();
  if (editingSec != null) $('sec-ren')?.focus();
  if (editingLes) $('les-ren')?.focus();
  const siFocus = sections.findIndex((s) => s.ui === 'newLecture' || s.ui === 'newQuiz');
  if (siFocus >= 0) {
    if (sections[siFocus].ui === 'newLecture') $(`lec-name-${siFocus}`)?.focus();
    if (sections[siFocus].ui === 'newQuiz') $(`qz-title-${siFocus}`)?.focus();
  }
}

function drawBasic() {
  const catOpts = ['<option value="">Select Category</option>'].concat(D.categories.map((c) => `<option ${c === 'Data & AI' ? 'selected' : ''}>${esc(c)}</option>`)).join('');
  $('panel').innerHTML = `<fieldset ${editable ? '' : 'disabled'}><form class="adm-card su-panel" id="basic" style="display:flex;flex-direction:column;gap:16px;max-width:720px">
    <div class="adm-field"><label>Course Title <span class="req">*</span></label><input class="adm-input" id="b-title" value="${esc(title)}"></div>
    <div class="adm-field"><span class="adm-label">Description <span class="req">*</span></span>
      ${Richbox({ id: 'b-desc', ph: 'Course description...', html: 'Course overview for learners.' })}</div>
    <div class="adm-field"><span class="adm-label">Who is this course for <span class="req">*</span></span>
      ${Richbox({ id: 'b-who', html: 'Engineers and L&amp;D teams.' })}</div>
    <div class="adm-field"><span class="adm-label">What will you learn <span class="req">*</span></span>
      ${Richbox({ id: 'b-learn', html: 'Core concepts and practice.' })}</div>
    <div class="adm-field"><label>Category <span class="req">*</span></label><select class="adm-input" id="b-cat">${catOpts}</select></div>
    <div class="cc-row">
      <div class="adm-field"><label>Sub Category <span class="req">*</span></label><select class="adm-input" id="b-sub"></select></div>
      <div class="adm-field"><span class="adm-label">Duration <span class="req">*</span></span>
        <div class="dur"><label><input id="b-h" value="2" inputmode="numeric"><span>h</span></label><b>:</b><label><input id="b-m" value="0" inputmode="numeric"><span>m</span></label></div></div>
    </div>
    <div class="adm-field"><span class="adm-label">Thumbnail</span>
      <div class="thumb ${hasThumb ? 'is-ok' : ''}" id="thumb" data-thumb>${hasThumb ? 'Thumbnail uploaded' : '<b>Click to upload thumbnail</b><br><span>JPG, PNG, WEBP (max 20MB)</span>'}</div></div>
    ${editable ? `<div class="adm-btn-combo"><button type="button" class="btn-cta" data-basic-save>Save</button></div>` : ''}
  </form></fieldset>`;
  drawSub();
}
function drawSub() {
  const c = $('b-cat')?.value; if (!$('b-sub')) return;
  $('b-sub').innerHTML = (SUBS[c] || ['General']).map((s) => `<option>${esc(s)}</option>`).join('');
}
function render() {
  renderTop();
  LHSetup.release();
  if (tab === 'details') drawDetails(); else if (tab === 'basic') drawBasic();
  else if (tab === 'practice') LHSetup.drawPractice($('panel')); else LHSetup.drawAudience($('panel'));
}
LHSetup.init({
  editable: true,
  /* Câu thi của khoá: nguồn kiểm trùng đề luyện tập (BR-PQ-03) */
  getExam: () => sections.flatMap((s) => s.lessons.filter((l) => l.type === 'quiz').flatMap((l) => (l.questions || []).map((q, k) => ({ quiz: l.name, n: k + 1, text: q.text })))),
  onChange: () => renderTop(),
  goTab: (t) => { tab = t; render(); },
});

/* ---------- Quiz question / import modals (kept) ---------- */
function modalQuestion(si, li) {
  openModal(Modal({
    id: 'm-q', size: 'lg', title: 'Add Question',
    body: `<div class="stack" style="display:flex;flex-direction:column;gap:12px">
      <div class="adm-field"><label>Question Type <span class="req">*</span></label>
        <select class="adm-input" id="qq-type"><option value="single">Single choice</option><option value="multi">Multiple choice</option><option value="tf">True / False</option></select></div>
      <div class="adm-field"><span class="adm-label">Question Content <span class="req">*</span></span>
        ${Richbox({ ph: 'Enter question...', bodyAttrs: 'id="qq-text"' })}
        <p class="adm-err" id="qq-err"></p></div>
      <div class="adm-field"><label>Score (Points) <span class="req">*</span></label><input class="adm-input" id="qq-score" type="number" min="1" value="1" style="max-width:120px"></div>
      <div class="adm-field"><span class="adm-label">Answer Option <span class="req">*</span></span>
        <div id="qq-opts"></div>
        <button type="button" class="btn-link btn-link--blue" id="qq-add-opt" style="margin-top:4px;padding:0;align-self:flex-start">+ Add more Answer Option</button>
        <p class="adm-err" id="qq-opt-err"></p></div>
      <div class="adm-field"><span class="adm-label">Explanation <span class="muted">(optional)</span></span>
        <textarea class="adm-input" id="qq-explain" rows="2"></textarea></div>
    </div>`,
    foot: `<button type="button" class="btn-cta btn-cta--line" data-close>Cancel</button><button type="button" class="btn-cta" data-qq-save="${si}:${li}">Save</button>`,
  }));
  drawOpts(['', '']);
  $('qq-type')?.addEventListener('change', () => { drawOpts($('qq-type').value === 'tf' ? ['True', 'False'] : ['', '']); });
  $('qq-add-opt')?.addEventListener('click', () => {
    const rows = [...document.querySelectorAll('#qq-opts .opt-row input[type=text]')].map((i) => i.value);
    if (rows.length >= 4) { toast('Maximum 4 options'); return; }
    rows.push(''); drawOpts(rows);
  });
}
function drawOpts(vals) {
  const host = $('qq-opts'); if (!host) return;
  const tf = $('qq-type')?.value === 'tf';
  host.innerHTML = vals.map((v, i) => `<div class="opt-row">
    <input type="radio" name="qq-correct" value="${i}" ${i === 0 ? 'checked' : ''} aria-label="Correct">
    <input class="adm-input" type="text" value="${esc(v)}" placeholder="Option ${i + 1}" ${tf ? 'readonly' : ''}>
    ${tf || vals.length <= 2 ? '<span></span>' : `<button type="button" class="icon-btn" data-opt-del="${i}" aria-label="Remove">${ICON.x}</button>`}
  </div>`).join('');
  host.querySelectorAll('[data-opt-del]').forEach((b) => b.addEventListener('click', () => {
    const rows = [...host.querySelectorAll('input[type=text]')].map((i) => i.value);
    rows.splice(+b.dataset.optDel, 1); drawOpts(rows);
  }));
  if ($('qq-add-opt')) $('qq-add-opt').style.display = tf ? 'none' : '';
}
function modalImport(si, li) {
  openModal(Modal({
    id: 'm-import', size: 'md', title: 'Import Questions from Excel',
    body: `<div class="stack" style="display:flex;flex-direction:column;gap:12px">
      <p class="adm-hint">Template columns: Question Type, Question Text, Score, Answer Options (1–4), Correct Answer indices. No Explanation column.</p>
      <button type="button" class="btn-cta btn-cta--line" data-dl-tpl style="align-self:flex-start">${ICON.download}Download Template</button>
      <div class="adm-field"><label>Excel File</label>
        <label class="dropzone"><input type="file" id="imp-file" accept=".xlsx,.xls,.csv" hidden>
          <span class="dropzone__ic">${ICON.upload}</span><b>Choose Excel file</b><span>.xlsx / .csv</span></label></div>
    </div>`,
    foot: `<button type="button" class="btn-cta btn-cta--line" data-close>Cancel</button><button type="button" class="btn-cta" data-imp-run="${si}:${li}">Import</button>`,
  }));
}

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]') || e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; render(); return; }

  /* Section */
  if (e.target.closest('[data-sec-add]')) { creatingSection = true; editingSec = null; drawDetails(); return; }
  if (e.target.closest('[data-sec-cancel]')) { creatingSection = false; drawDetails(); return; }
  if (e.target.closest('[data-sec-save]')) {
    const name = ($('sec-name')?.value || '').trim();
    const err = $('sec-err');
    if (!name) { if (err) err.textContent = 'Please enter Name'; return; }
    sections.push({ name, ui: 'idle', lessons: [] });
    creatingSection = false; drawDetails(); toast('Section created successfully'); return;
  }
  const se = e.target.closest('[data-sec-edit]'); if (se) { editingSec = +se.dataset.secEdit; editingLes = null; drawDetails(); return; }
  if (e.target.closest('[data-sec-ren-cancel]')) { editingSec = null; drawDetails(); return; }
  const srs = e.target.closest('[data-sec-ren-save]'); if (srs) {
    const name = ($('sec-ren')?.value || '').trim();
    if (!name) { toast('Please enter Name'); return; }
    sections[+srs.dataset.secRenSave].name = name; editingSec = null; drawDetails(); return;
  }
  const sd = e.target.closest('[data-sec-del]'); if (sd) {
    AdminConfirm({ danger: true, title: 'Delete section?', text: 'Lessons inside will be removed.', ok: 'Delete', onOk: () => { sections.splice(+sd.dataset.secDel, 1); drawDetails(); } }); return;
  }

  /* Add lesson pick / lecture / quiz inline */
  const pick = e.target.closest('[data-les-pick]'); if (pick) {
    sections.forEach((s) => { s.ui = 'idle'; });
    sections[+pick.dataset.lesPick].ui = 'addLesson'; drawDetails(); return;
  }
  const lc = e.target.closest('[data-les-cancel]'); if (lc) { sections[+lc.dataset.lesCancel].ui = 'idle'; drawDetails(); return; }
  const nl = e.target.closest('[data-new-lecture]'); if (nl) { sections[+nl.dataset.newLecture].ui = 'newLecture'; drawDetails(); return; }
  const nq = e.target.closest('[data-new-quiz]'); if (nq) { sections[+nq.dataset.newQuiz].ui = 'newQuiz'; drawDetails(); return; }
  const ls = e.target.closest('[data-lec-save]'); if (ls) {
    const si = +ls.dataset.lecSave;
    const name = ($(`lec-name-${si}`)?.value || '').trim();
    const err = $(`lec-err-${si}`);
    if (!name) { if (err) err.textContent = 'Please enter Name'; return; }
    sections[si].lessons.push(mkLesson({ name, picking: false, content: null }));
    sections[si].ui = 'idle'; drawDetails(); toast('Lesson created successfully'); return;
  }
  const qs = e.target.closest('[data-quiz-save]'); if (qs) {
    const si = +qs.dataset.quizSave;
    const name = ($(`qz-title-${si}`)?.value || '').trim();
    const err = $(`qz-err-${si}`);
    if (!name) { if (err) err.textContent = 'Please enter Quiz Title'; return; }
    const pass = +$(`qz-pass-${si}`).value;
    if (!(pass >= 1 && pass <= 100) || !Number.isInteger(pass)) { $(`qz-pass-err-${si}`).textContent = 'Passing Score must be between 1 and 100%.'; return; }
    sections[si].lessons.push(mkLesson({
      type: 'quiz', name, content: 'quiz', questions: [],
      quiz: { time: $(`qz-time-${si}`).value, pass, desc: ($(`qz-desc-${si}`)?.value || '').trim() }, // BR-EX-14: không có ô số lượt
    }));
    sections[si].ui = 'idle'; drawDetails(); toast('Quiz created successfully'); return;
  }

  /* Lesson card */
  const le = e.target.closest('[data-les-edit]'); if (le) { editingLes = le.dataset.lesEdit; editingSec = null; drawDetails(); return; }
  const lrs = e.target.closest('[data-les-ren-save]'); if (lrs) {
    const [si, li] = lrs.dataset.lesRenSave.split(':').map(Number);
    const name = ($('les-ren')?.value || '').trim();
    if (!name) { toast('Please enter Name'); return; }
    sections[si].lessons[li].name = name; editingLes = null; drawDetails(); return;
  }
  const ld = e.target.closest('[data-les-del]'); if (ld) {
    const [si, li] = ld.dataset.lesDel.split(':').map(Number);
    AdminConfirm({ danger: true, title: 'Delete lesson?', ok: 'Delete', onOk: () => { sections[si].lessons.splice(li, 1); drawDetails(); } }); return;
  }
  const lt = e.target.closest('[data-les-tog]'); if (lt) {
    const [si, li] = lt.dataset.lesTog.split(':').map(Number);
    sections[si].lessons[li].open = !sections[si].lessons[li].open; drawDetails(); return;
  }
  const ct = e.target.closest('[data-content]'); if (ct) {
    const [si, li] = ct.dataset.content.split(':').map(Number);
    sections[si].lessons[li].picking = true; sections[si].lessons[li].open = true; drawDetails(); return;
  }
  const pc = e.target.closest('[data-pick-clear]'); if (pc) {
    const [si, li] = pc.dataset.pickClear.split(':').map(Number);
    sections[si].lessons[li].picking = false; drawDetails(); return;
  }
  const sc = e.target.closest('[data-set-content]'); if (sc) {
    const [si, li, kind] = sc.dataset.setContent.split(':');
    const L = sections[+si].lessons[+li];
    L.content = kind; L.picking = false; L.open = true;
    if (kind === 'article') { L.articleEditing = true; L.files = []; }
    else { L.files = []; L.articleEditing = false; }
    drawDetails(); toast('Content type saved'); return;
  }
  const as = e.target.closest('[data-art-save]'); if (as) {
    const [si, li] = as.dataset.artSave.split(':').map(Number);
    const body = $(`art-${si}-${li}`);
    sections[si].lessons[li].articleHtml = (body?.innerHTML || '').trim();
    sections[si].lessons[li].articleEditing = false;
    drawDetails(); toast('Lesson article created successfully'); return;
  }
  const ae = e.target.closest('[data-art-edit]'); if (ae) {
    const [si, li] = ae.dataset.artEdit.split(':').map(Number);
    sections[si].lessons[li].articleEditing = true; drawDetails(); return;
  }
  const ar = e.target.closest('[data-add-res]'); if (ar) {
    const [si, li] = ar.dataset.addRes.split(':').map(Number);
    const L = sections[si].lessons[li];
    if (!L.files) L.files = [];
    L.files.push({ name: 'file.pdf', size: '2mb', at: '18.11.2026, 11:30 AM', pct: 100 });
    drawDetails(); toast('Resource added'); return;
  }
  const drop = e.target.closest('[data-drop]'); if (drop) {
    const [si, li] = drop.dataset.drop.split(':').map(Number);
    const L = sections[si].lessons[li];
    if (!L.files) L.files = [];
    L.files.push({ name: 'Design.mp4', size: '2mb', at: '18.11.2026, 11:30 AM', pct: 55, speed: '90KB/Sec' });
    drawDetails();
    setTimeout(() => {
      const f = L.files[L.files.length - 1]; if (f && f.pct < 100) { f.pct = 100; f.speed = ''; drawDetails(); }
    }, 1200);
    return;
  }
  const fd = e.target.closest('[data-file-del]'); if (fd) {
    const [si, li, fi] = fd.dataset.fileDel.split(':').map(Number);
    AdminConfirm({
      title: 'Warning', text: 'Are you sure you want to delete this resource?', ok: 'Confirm', danger: false,
      onOk: () => { sections[si].lessons[li].files.splice(fi, 1); drawDetails(); toast('Resource deleted'); },
    }); return;
  }
  if (e.target.closest('[data-learn-types]')) { e.preventDefault(); toast('Content types: Video, Video & Slide Mashup, Article'); return; }

  /* Quiz Q */
  const qa = e.target.closest('[data-q-add]'); if (qa) {
    const [si, li] = qa.dataset.qAdd.split(':').map(Number);
    LHSetup.questionModal({ bank: 'exam', withScore: true, onSave: (q) => { const L = sections[si].lessons[li]; (L.questions = L.questions || []).push(q); drawDetails(); return L.questions.length; } }); return;
  }
  const qsave = e.target.closest('[data-qq-save]'); if (qsave) {
    const [si, li] = qsave.dataset.qqSave.split(':').map(Number);
    const text = ($('qq-text')?.textContent || '').trim();
    const opts = [...document.querySelectorAll('#qq-opts input[type=text]')].map((i) => i.value.trim());
    const correct = +document.querySelector('#qq-opts input[type=radio]:checked')?.value;
    const err = $('qq-err'); const oerr = $('qq-opt-err');
    if (err) err.textContent = ''; if (oerr) oerr.textContent = '';
    if (!text) { if (err) err.textContent = 'Please enter Question Content'; return; }
    if (opts.filter(Boolean).length < 2) { if (oerr) oerr.textContent = 'At least 2 answer options are required'; return; }
    if (!sections[si].lessons[li].questions) sections[si].lessons[li].questions = [];
    sections[si].lessons[li].questions.push({ type: $('qq-type').value, text, score: +$('qq-score').value || 1, options: opts, correct, explain: ($('qq-explain')?.value || '').trim() });
    closeModal(); drawDetails(); toast('Question created successfully'); return;
  }
  const qi = e.target.closest('[data-q-import]'); if (qi) {
    const [si, li] = qi.dataset.qImport.split(':').map(Number);
    LHSetup.importModal({ bank: 'exam', onImport: (qs) => { const L = sections[si].lessons[li]; L.questions = L.questions || []; const a = L.questions.length + 1; L.questions.push(...qs.map((q) => ({ ...q, score: 1 }))); drawDetails(); return [a, L.questions.length]; } }); return;
  }
  if (e.target.closest('[data-dl-tpl]')) { toast('Template downloaded (demo)'); return; }
  const ir = e.target.closest('[data-imp-run]'); if (ir) {
    const [si, li] = ir.dataset.impRun.split(':').map(Number);
    if (!$('imp-file')?.files?.[0]) { toast('Please choose an Excel file'); return; }
    if (!sections[si].lessons[li].questions) sections[si].lessons[li].questions = [];
    sections[si].lessons[li].questions.push(
      { type: 'single', text: 'Imported sample question 1', score: 1, options: ['A', 'B', 'C', 'D'], correct: 0, explain: '' },
      { type: 'tf', text: 'Imported true/false sample', score: 1, options: ['True', 'False'], correct: 0, explain: '' },
    );
    closeModal(); drawDetails(); toast('Questions imported successfully'); return;
  }

  if (e.target.closest('[data-thumb]')) {
    if (!editable) return;
    hasThumb = true; toast('Thumbnail uploaded successfully'); drawBasic(); return;
  }
  if (e.target.closest('[data-basic-save]')) {
    title = $('b-title')?.value.trim() || title; toast('Course updated successfully'); renderTop(); return;
  }
  if (e.target.closest('[data-publish]')) {
    /* Course Information 3.3 (BR-CI-08) → Cannot publish yet; Course Audience 3.7 (BR-AUD-09) → popup Scope + N learners */
    LHSetup.publish({ title, sections, onDone: () => { st = 'published'; editable = false; basicErr = false; toast('Course published successfully'); render(); } }); return;
  }
  if (e.target.closest('[data-edit]')) {
    AdminConfirm({ title: 'Edit Course Version', text: 'This version is published. You can edit it by creating a new version.', ok: 'Continue', onOk: () => {
      st = 'rev-draft'; editable = true; toast('Draft version created'); render();
    } }); return;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'b-cat') drawSub();
  if (e.target.id && e.target.id.startsWith('qz-nolimit-')) {
    const si = e.target.id.replace('qz-nolimit-', '');
    const att = $(`qz-att-${si}`); if (att) att.disabled = e.target.checked;
  }
});

LH.DemoBar('Course setup · Details Figma', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin'], ['editor', 'Editor']] },
  { label: 'Status', key: 'st', options: [['draft', 'DRAFT'], ['published', 'PUBLISHED']] },
  { label: 'Tab', key: 'tab', options: [['details', 'Details'], ['basic', 'Basic Information'], ['audience', 'Audience'], ['practice', 'Practice']] },
  { label: 'Practice', key: 'pq', options: [['empty', 'Off · chưa có câu (khoá cũ)'], ['off', 'Off · có 4 câu'], ['on', 'On · 4 câu'], ['dup', 'On · có câu trùng đề thi']] },
  { label: 'Audience', key: 'aud', options: [['all', 'All Company'], ['restricted', 'Restricted · QA, QC Automation'], ['mandatory', 'Restricted QA · Mandatory'], ['empty', 'Restricted · chưa chọn ai']] },
  { label: 'Thumbnail', key: 'thumb', options: [['', 'None'], ['1', 'Uploaded']] },
], (s) => {
  role = LH.admRole(s.r); st = s.st; tab = s.tab; hasThumb = !!s.thumb;
  editable = st === 'draft' || st === 'rev-draft';
  basicErr = false; creatingSection = false; editingSec = null; editingLes = null;
  LHSetup.audience.published = st === 'published';
  if (st === 'published') {
    title = P.get('t') || 'Claude Certified Architect – Foundations';
    sections = normalizeSections(D.course.sessions.slice(0, 2).map((sess) => ({
      name: sess.name,
      lessons: sess.lessons.map(([k, n]) => ({
        type: k === 'quiz' ? 'quiz' : 'lecture',
        name: n,
        content: k === 'quiz' ? 'quiz' : (k === 'video' ? 'video' : 'article'),
      })),
    })));
  } else if (P.get('t')) {
    title = P.get('t');
  }
  LHSetup.seedPractice(s.pq); LHSetup.seedAudience(s.aud);
  render();
});
