<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Courses · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1123c">
<style>
  .cs-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 12px; }
  .cs-pager { display: flex; gap: 6px; justify-content: center; margin: 24px 0; }
  .cs-pager button { min-width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border-default); background: var(--c-white); cursor: pointer; }
  .cs-pager button[aria-current="page"] { background: var(--c-primary-deep); color: var(--c-white); border-color: var(--c-primary-deep); }
</style>
<link rel="stylesheet" href="../assets/css/ds.css?v=1121a">
</head>
<body class="page">
<!-- Learner Experience 2.1 + 3.1 · BR-CS-01…07 (Notion LH2 Product Docs No 9, Đợt 2 · Gói 5).
     Tìm theo tên, Category, Sub Category (không tag) · My Status · Time · Sort · 12 khoá / trang · giữ bộ lọc trên URL. -->
<div id="header"></div>
<div id="cats"></div>
<main class="container page__in">
  <div id="back"></div>
  <div class="cs-filters" id="filters"></div>
  <div class="search-sum" id="sum"></div>
  <div class="course-grid" id="grid"></div>
  <div class="cs-pager" id="pager"></div>
</main>
<div id="footer"></div>
<script src="../assets/js/components.js?v=1123d"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/lh2-wave2.js?v=1123d"></script>
<script>
const { AppHeader, CategoryNav, AppFooter, BackLink, FilterDropdown, Button, ICON, esc } = LH; const D = LHData;
/* Danh mục khoá: thêm Sub Category, trạng thái của tôi đủ loại, nhãn Mandatory / Paid để minh hoạ 3.1 */
const EXTRA = { 'QA AUTOMATION _ MODULE 2: FUNDAMENTAL TESTING': { mand: true, sub: 'QA Automation' }, 'CCAR-F Claude Certified Architect – Foundations': { sub: 'AI Engineering', paid: true },
  'QA AUTOMATION _ MODULE 1: PROGRAMMING FOUNDATION': { sub: 'QA Automation' }, "PENETRATION TESTING: THE ATTACKER'S MINDSET": { sub: 'Security' },
  'QA IN THE AGE OF AI AGENTS: RETHINKING SOFTWARE QUALITY': { start: '25/11', sub: 'AI Engineering' }, 'HARNESS IS AL YOU NEED': { st: 'closed', my: 50, progress: 40, video: [2, 5], test: [0, 1], sub: 'AI Engineering' },
  'PROMPTS ENGINEERING': { st: 'removed', my: 70, progress: 66, video: [2, 3], test: [0, 0], sub: 'Prompting' }, 'CURSOR TAKE IN HAND': { sub: 'Tools' } };
const ALL = D.catalog.map((c) => ({ ...c, sub: c.tags && c.tags[0], ...(EXTRA[c.title] || {}), start: (EXTRA[c.title] || {}).start || (c.sched && c.sched.start ? c.sched.start.slice(0, 5) : '') }));
const MANY = Array.from({ length: 16 }, (_, i) => ({ title: `TESTING WORKSHOP ${String(i + 1).padStart(2, '0')}`, cat: 'Software Development', sub: 'Testing', lessons: 3, hours: '2h 0m', pub: 300 + i, st: 'none', cover: '' }));

/* 06 §3.1: My Status = All · Not Enrolled · In Progress · Completed (Failed chỉ ở My Courses §3.2) */
const STATUS = [['all', 'All'], ['none', 'Not Enrolled'], ['learning', 'In Progress'], ['done', 'Completed']];
const TIME = [['all', 'All time'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days']];
const p = new URLSearchParams(location.search);
const f = { q: p.get('q') || '', ct: p.get('ct') || 'all', st: p.get('st') || 'all', pd: p.get('pd') || 'all', sort: p.get('sort') || '', page: +(p.get('page') || 1) };
let pool = ALL;
document.getElementById('header').innerHTML = AppHeader({ search: f.q });
document.getElementById('footer').innerHTML = AppFooter();
const qInput = document.querySelector('.search-pill input');

function syncUrl() { const u = new URLSearchParams(); Object.entries(f).forEach(([k, v]) => { if (v && v !== 'all' && !(k === 'page' && v === 1)) u.set(k, v); }); history.replaceState(null, '', '?' + u); }
function run() {
  const q = f.q.trim();
  let out = pool.map((c) => ({ c, r: LHW2.rank(c, q) })).filter((x) => x.r > 0 && ['none', 'learning', 'done', 'fail', 'closed', 'removed'].includes(x.c.st || 'none'));
  if (f.ct !== 'all') out = out.filter((x) => x.c.cat === f.ct);
  if (f.st !== 'all') out = out.filter((x) => (x.c.st || 'none') === f.st);       // BR-CS-05: Closed / Access Removed chỉ ở All
  if (f.pd !== 'all') out = out.filter((x) => x.c.my != null && x.c.my <= +f.pd); // BR-CS-06: chưa đăng ký chỉ ở All time
  const sort = f.sort || (q ? 'rel' : 'new');
  out.sort(sort === 'rel' ? (a, b) => a.r - b.r || a.c.pub - b.c.pub : sort === 'az' ? (a, b) => a.c.title.localeCompare(b.c.title) : (a, b) => a.c.pub - b.c.pub);
  return { q, sort, items: out.map((x) => x.c) };
}
function render() {
  const cats = ['all', ...new Set(ALL.map((c) => c.cat))];
  document.getElementById('cats').innerHTML = CategoryNav(f.ct);
  document.getElementById('back').innerHTML = BackLink('Search Courses', { href: 'home.html' });
  if (document.activeElement !== qInput) qInput.value = f.q;
  const r = run();
  document.getElementById('filters').innerHTML =
    FilterDropdown({ key: 'ct', label: 'Category:', value: f.ct, options: cats.map((c) => [c, c === 'all' ? 'All' : c]) })
    + FilterDropdown({ key: 'st', label: 'My Status:', value: f.st, options: STATUS })
    + FilterDropdown({ key: 'pd', label: 'Time:', value: f.pd, options: TIME });
  const chips = [['ct', f.ct], ['st', (STATUS.find((o) => o[0] === f.st) || [])[1]], ['pd', (TIME.find((o) => o[0] === f.pd) || [])[1]]].filter(([k]) => f[k] !== 'all');
  /* 06 §3.1 Sort: Most Relevant (khi có q) · Newest · Name A–Z — không Recently Accessed */
  const sortOpts = [...(r.q ? [['rel', 'Most Relevant']] : []), ['new', 'Newest'], ['az', 'Name A–Z']];
  document.getElementById('sum').innerHTML = `<span class="search-sum__n">${r.items.length} courses${r.q ? ` for “${esc(r.q)}”` : ''}</span>`
    + chips.map(([k, t]) => `<span class="chip is-active">${esc(t)}<button class="icon-btn" data-rm="${k}" aria-label="Remove ${esc(t)}" style="width:20px;height:20px">${ICON.x}</button></span>`).join('')
    + (chips.length ? '<button class="btn btn--link" data-rm-all>Clear All</button>' : '')
    + '<span class="search-sum__sp"></span>' + FilterDropdown({ key: 'sort', label: 'Sort by:', value: r.sort, def: r.sort, options: sortOpts, align: 'right' });
  const grid = document.getElementById('grid'), pager = document.getElementById('pager');
  if (!r.items.length) {
    /* 06 §2.1 empty: No courses found + Clear Filters khi đang lọc — không thêm hint ngoài Docs */
    grid.innerHTML = `<div class="empty search-empty" style="grid-column:1/-1">${ICON.search}<b>No courses found${r.q ? ` for “${esc(r.q)}”` : ''}</b>${chips.length ? Button({ label: 'Clear Filters', variant: 'outline', attrs: 'data-rm-all' }) : ''}</div>`;
    pager.innerHTML = ''; return;
  }
  const pages = Math.ceil(r.items.length / 12); f.page = Math.min(f.page, pages);
  grid.innerHTML = r.items.slice((f.page - 1) * 12, f.page * 12).map((c) => LHW2.card(c, { q: r.q })).join('');
  pager.innerHTML = pages > 1 ? Array.from({ length: pages }, (_, i) => `<button data-page="${i + 1}" ${i + 1 === f.page ? 'aria-current="page"' : ''}>${i + 1}</button>`).join('') : '';
}
const apply = (patch) => { Object.assign(f, { page: 1 }, patch); syncUrl(); render(); };
document.addEventListener('search:apply', (e) => { e.preventDefault(); apply({ q: e.detail.q, sort: '' }); });
document.addEventListener('search:live', (e) => { if (e.detail.q !== f.q) apply({ q: e.detail.q, sort: '' }); });
document.addEventListener('fdd:change', (e) => apply({ [e.detail.key]: e.detail.value }));
document.addEventListener('click', (e) => {
  const cat = e.target.closest('[data-cat]'); if (cat) { e.preventDefault(); apply({ ct: f.ct === cat.dataset.cat ? 'all' : cat.dataset.cat }); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { apply({ [rm.dataset.rm]: 'all' }); return; }
  if (e.target.closest('[data-rm-all]')) { apply({ ct: 'all', st: 'all', pd: 'all' }); return; } // Clear All / Clear Filters: giữ từ khoá
  const pg = e.target.closest('[data-page]'); if (pg) { f.page = +pg.dataset.page; syncUrl(); render(); scrollTo(0, 0); }
});
LH.DemoBar('LH2 · Search Courses (Đợt 2 · Gói 5)', [
  { label: 'Keyword', key: 'sc', options: [['url', 'From URL'], ['kiem', '“qa automation”'], ['cat', '“data ai” (Category)'], ['many', '28 courses (2 pages)'], ['none', 'No results']] },
], (s) => {
  pool = s.sc === 'many' ? [...ALL, ...MANY] : ALL;
  const preset = { kiem: 'qa automation', cat: 'data ai', none: 'blockchain', many: '' }[s.sc];
  if (preset !== undefined) { apply({ q: preset, sort: '', ct: 'all', st: 'all', pd: 'all' }); return; }
  render();
});
</script>
</body>
</html>
