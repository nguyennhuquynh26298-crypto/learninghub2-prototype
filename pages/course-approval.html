<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Review · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1118w"><link rel="stylesheet" href="../assets/css/base.css?v=1118w"><link rel="stylesheet" href="../assets/css/components.css?v=1118w">
<link rel="stylesheet" href="../assets/css/admin.css?v=1118w"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1118w">
<style>
  .rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  @media (max-width: 1100px) { .rv-grid { grid-template-columns: 1fr; } }
  .rv-hero { border-radius: 20px; background: linear-gradient(135deg, #4757ff, #2a37c4); color: #fff; padding: 24px 28px; }
  .rv-hero h2 { margin: 6px 0; font-size: 22px; } .rv-hero p { margin: 0; color: #dce2ff; }
  .rv-sec { border: 1px solid var(--adm-stroke); border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .rv-sec > b { display: block; padding: 10px 14px; background: var(--adm-side, #f5f6ff); }
  .rv-sec div { padding: 10px 14px; border-top: 1px solid var(--adm-stroke); font-size: 14px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 14px; } .kv span { color: var(--adm-sub); }
  .aud { background: #fffaeb; border: 1px solid #fedf89; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .bn { border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; border: 1px solid; }
  .bn--draft { background: #f9fafb; border-color: #eaecf0; } .bn--pending { background: #eff8ff; border-color: #b2ddff; }
  .bn--changes { background: #fffaeb; border-color: #fedf89; } .bn--rejected { background: #fef3f2; border-color: #fecdca; }
  .bn q { display: block; quotes: none; margin-top: 6px; color: #344054; } .bn small { display: block; color: #667085; margin-top: 4px; }
  .miss { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .miss a { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid #fecdca; border-radius: 10px; color: #b42318; text-decoration: none; font-size: 14px; }
  .miss a:hover { background: #fef3f2; }
</style>
</head>
<body>
<!-- Course Creator & Approval 2.1–2.3, 3.1–3.4, 3.8 · BR-CA-01…13 (Notion LH2 Product Docs No 10, Đợt 2 · Gói 6).
     View = Admin L&D (Course Review) | Course Creator (banner trạng thái + Submit for Approval). Email chỉ minh hoạ bằng toast. -->
<div id="header"></div>
<main>
  <div id="head"></div>
  <div id="banner"></div>
  <div class="rv-grid">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="rv-hero"><span style="font-size:13px;color:#c3cbff" id="h-count"></span><h2 id="h-title"></h2><p>Architecture, tool design, MCP and context management for production Claude solutions.</p></div>
      <section class="adm-card"><h2 class="adm-card__title">Preview — as learners will see it</h2><div id="aud"></div><div id="syl"></div></section>
    </div>
    <aside style="display:flex;flex-direction:column;gap:20px">
      <section class="adm-card"><h2 class="adm-card__title">Submission</h2><div class="kv" id="info"></div></section>
      <section class="adm-card"><h2 class="adm-card__title">Approval History</h2><ul class="w2-hist" id="hist"></ul></section>
    </aside>
  </div>
</main>
<script src="../assets/js/components.js?v=1118w"></script>
<script src="../assets/js/data.js?v=1118w"></script>
<script src="../assets/js/lh2-wave2.js?v=1118w"></script>
<script>
const { ICON, esc, toast, AdminLayout, AdminHead, Tag } = LH;
const TITLE = 'CCAR-F Claude Certified Architect – Foundations', OWNER = 'Phạm Thanh Long';
const SYL = [
  ['Section 1 · Getting started', [['Lesson 1 · Course overview', ''], ['Lesson 2 · Claude model family', 'edit']]],
  ['Section 2 · Tools & MCP', [['Lesson 1 · Tool design principles', ''], ['Lesson 2 · MCP transport (SSE, old)', 'del'], ['Lesson 3 · MCP transport (Streamable HTTP)', 'new'], ['Lesson 4 · Quiz · Tools & MCP', 'edit']]],
  ['Section 3 · Context management', [['Lesson 1 · Context windows', ''], ['Lesson 2 · Final Test', '']]],
];
const TAGS = { new: ['New', 'new'], edit: ['Edited', 'edit'], del: ['Deleted', 'del'] };
let v; // { view, type, status, hist, processed }
const HIST = {
  base: [['Submitted', OWNER, '09:12 · 24/11/2026']],
  changes: [['Submitted', OWNER, '09:12 · 24/11/2026'], ['Changes Requested', 'Lê Thị Mai', '14:30 · 24/11/2026', 'Please add a summary lesson at the end of Section 3 and fix the quiz Time Limit.']],
  rejected: [['Submitted', OWNER, '09:12 · 24/11/2026'], ['Rejected', 'Lê Thị Mai', '15:02 · 24/11/2026', 'This topic is already covered by the official CCAR course. Please join that course instead.']],
};
const histHtml = (h) => h.map(([a, who, at, cm]) => `<li><div><b>${a}</b><small>${esc(who)} · ${at}</small>${cm ? `<q>${esc(cm)}</q>` : ''}</div></li>`).join('');

function render() {
  const admin = v.view === 'admin';
  AdminLayout({ active: 'courses', role: admin ? 'admin' : 'editor' });
  const edit = v.type === 'edit';
  const statusTag = { draft: Tag('Draft', 'draft'), pending: Tag(edit ? 'Published · Edit Pending Approval' : 'Pending Approval', 'pending'), changes: Tag(edit ? 'Published · Edit Changes Requested' : 'Changes Requested', 'rejected'), rejected: Tag('Rejected', 'rejected'), published: Tag('Published', 'published') }[v.status];
  const busy = admin && v.processed;
  const actions = admin
    ? (v.status === 'pending' && !busy ? `<button class="btn-cta btn-cta--line" data-a="edit">${ICON.edit}Edit</button><button class="btn-cta btn-cta--line" data-a="reject">Reject</button><button class="btn-cta btn-cta--line" data-a="changes">Request Changes</button><button class="btn-cta" data-a="approve">Approve</button>` : '')
    : ({ draft: `${edit ? '<button class="btn-cta btn-cta--line" data-a="discard">Discard Draft</button>' : ''}<button class="btn-cta" data-a="submit">Submit for Approval</button>`,
        changes: `${edit ? '<button class="btn-cta btn-cta--line" data-a="discard">Discard Draft</button>' : ''}<button class="btn-cta" data-a="submit">Resubmit</button>`,
        published: '<button class="btn-cta" data-a="newedit">Edit</button>' }[v.status] || '');
  document.getElementById('head').innerHTML = AdminHead({ back: 'admin-courses.html', eyebrow: admin ? 'Course Review' : 'Course Setup', title: `${esc(TITLE)} ${statusTag}`, right: `<div style="display:flex;gap:10px;flex-wrap:wrap">${actions}</div>` });

  /* Banner trạng thái (Creator) · BR-CA-09 người duyệt sau (Admin) */
  const last = (v.hist[v.hist.length - 1] || []);
  document.getElementById('banner').innerHTML = busy ? `<div class="bn bn--pending">This course has already been processed by <b>Nguyễn Thu Hà</b>.</div>`
    : admin ? '' : {
      draft: '<div class="bn bn--draft">Draft — only you and L&amp;D Admins can see this course.</div>',
      pending: '<div class="bn bn--pending">Submitted for approval at 09:12, 24/11/2026. You can\'t edit while L&amp;D is reviewing.</div>',
      changes: `<div class="bn bn--changes"><b>L&amp;D requested changes</b><q>${esc(last[3] || '')}</q><small>${esc(last[1] || '')} · ${last[2] || ''}</small></div>`,
      rejected: `<div class="bn bn--rejected"><b>This course was rejected</b><q>${esc(last[3] || '')}</q><small>${esc(last[1] || '')} · ${last[2] || ''} · You can view it but can't edit or resubmit. Create a new course to try again.</small></div>`,
      published: '<div class="bn bn--draft">Published. Click Edit to create a draft version; learners keep the published version until L&amp;D approves your changes.</div>',
    }[v.status];

  const n = SYL.reduce((a, s) => a + s[1].filter((l) => l[1] !== 'del').length, 0);
  document.getElementById('h-count').textContent = `${SYL.length} sections · ${n} lessons`;
  document.getElementById('h-title').textContent = TITLE;
  document.getElementById('aud').innerHTML = edit ? '<div class="aud"><b>Audience Changes</b><br>Scope: All Company → Restricted · Departments: +QA, −BA · Estimated 20 learners (was 350)</div>' : '';
  document.getElementById('syl').innerHTML = SYL.map(([s, ls]) => `<div class="rv-sec"><b>${s}</b>${ls.map(([l, t]) => `<div class="${edit && t === 'del' ? 'lesson-del' : ''}">${edit || t !== 'del' ? l : ''}${edit && t ? `<span class="diff-tag diff-tag--${TAGS[t][1]}">${TAGS[t][0]}</span>` : ''}</div>`).filter((h) => !h.includes('<div class=""></div>')).join('')}</div>`).join('');
  document.getElementById('info').innerHTML = `<span>Course Title</span><b>${esc(TITLE)}</b><span>Owner</span><b>${OWNER}</b><span>Type</span><b>${edit ? 'Edit of Published Course' : 'New Course'}</b><span>Submitted At</span><b>${v.status === 'draft' ? '—' : '09:12 · 24/11/2026'}</b>`;
  document.getElementById('hist').innerHTML = v.hist.length ? histHtml(v.hist) : '<li><div><small>No history yet.</small></div></li>';
}

function commentPopup(kind) {
  const reject = kind === 'reject';
  LHW2.pop({ title: reject ? 'Reject' : 'Request Changes', danger: reject, ok: reject ? 'Reject' : 'Request Changes',
    desc: reject ? (v.type === 'edit' ? 'The draft version is discarded; the published version stays.' : 'The Creator can view the course but can\'t edit or resubmit it.') : 'The Creator edits and resubmits.',
    body: '<label class="w2-field"><span>Comment <span class="req">*</span></span><textarea data-c maxlength="1200"></textarea><span class="w2-err" data-e hidden>Comment must be 10–1,000 characters.</span></label>',
    onOk: (p) => { const t = p.querySelector('[data-c]').value.trim(); if (t.length < 10 || t.length > 1000) { p.querySelector('[data-e]').hidden = false; return false; }
      v.hist.push([reject ? 'Rejected' : 'Changes Requested', 'Lê Thị Mai', '10:05 · 25/11/2026', t]);
      v.status = reject ? (v.type === 'edit' ? 'published' : 'rejected') : 'changes'; render(); toast(`Email sent to ${OWNER}: ${reject ? `“${TITLE} has been rejected”` : `“Changes requested for ${TITLE}”`}`); } });
}
/* BR-CA-01 = điều kiện Publish chung (Course Information BR-CI-08) */
const MISSING = [['Section 3 · Context management', 'Lesson 2 · Final Test has no questions. Add at least 1 question.'], ['Course Information', 'Short Description is empty.']];
function submit() {
  if (v.incomplete) {
    LHW2.pop({ title: 'Cannot submit yet', cancel: '', ok: 'OK', desc: 'Fix these items, then submit again:',
      body: `<ul class="miss">${MISSING.map(([w, t]) => `<li><a href="course-editor.html">${ICON.alert}<span><b>${w}</b><br>${t}</span></a></li>`).join('')}</ul>` });
    return;
  }
  v.hist.push(['Submitted', OWNER, '09:12 · 24/11/2026']); v.status = 'pending'; render();
  toast(`Email to all L&D Admins: “${OWNER} submitted ${v.type === 'edit' ? 'changes to' : 'new course'} ${TITLE} for approval”`);
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  const k = a.dataset.a;
  if (k === 'approve') {
    LHW2.pop({ title: 'Approve', ok: 'Approve',
      desc: v.type === 'edit' ? 'Replace the published content with this version? Learner progress will be recalculated.' : 'Scope: <b>All Company</b> · <b>350</b> learners can access this course after it is published.',
      onOk: () => { v.hist.push(['Approved', 'Lê Thị Mai', '10:05 · 25/11/2026']); v.status = 'published'; render(); toast(`Email sent to ${OWNER}: “${TITLE} has been approved and published”`); } });
  }
  if (k === 'changes' || k === 'reject') commentPopup(k);
  if (k === 'edit') { v.hist.push(['Edited by Admin', 'Lê Thị Mai', '10:01 · 25/11/2026']); render(); toast('Saved. Approval History: Edited by Admin'); }
  if (k === 'submit') submit();
  if (k === 'discard') LHW2.pop({ title: 'Discard Draft', danger: true, ok: 'Discard', desc: 'Delete this draft version? The published version stays unchanged.', onOk: () => { v.status = 'published'; v.hist = []; render(); toast('Draft discarded'); } });
  if (k === 'newedit') { v.type = 'edit'; v.status = 'draft'; v.hist = []; v.incomplete = false; render(); toast('Draft version created. Learners keep the published version.'); }
});
LH.DemoBar('LH2 · Course Creator & Approval (Đợt 2 · Gói 6)', [
  { label: 'View', key: 'w', options: [['admin', 'Admin L&D · Course Review'], ['creator', 'Course Creator']] },
  { label: 'Case', key: 'k', options: [['new', 'New course'], ['edit', 'Edit of published course'], ['changes', 'Changes Requested'], ['rejected', 'Rejected'], ['incomplete', 'Draft missing items (Creator)'], ['processed', 'Already processed (2 Admins)']] },
], (s) => {
  const k = s.k;
  v = { view: s.w, type: k === 'edit' ? 'edit' : 'new', status: 'pending', hist: HIST.base.map((x) => x.slice()), incomplete: false, processed: k === 'processed' };
  if (k === 'changes') { v.status = 'changes'; v.hist = HIST.changes.map((x) => x.slice()); }
  if (k === 'rejected') { v.status = 'rejected'; v.hist = HIST.rejected.map((x) => x.slice()); }
  if (k === 'incomplete') { v.status = 'draft'; v.hist = []; v.incomplete = true; v.view = 'creator'; }
  if (s.w === 'creator' && (k === 'new' || k === 'edit')) { v.status = 'draft'; v.hist = []; }
  document.querySelectorAll('.w2-pop').forEach((p) => p.remove());
  render();
});
</script>
</body>
</html>
