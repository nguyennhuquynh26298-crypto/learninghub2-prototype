<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Report · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1118w"><link rel="stylesheet" href="../assets/css/base.css?v=1118w"><link rel="stylesheet" href="../assets/css/components.css?v=1118w">
<link rel="stylesheet" href="../assets/css/admin.css?v=1118w"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1118w">
</head>
<body>
<!-- Learning Report v1.0 — Notion LH2 Product Docs · No 8 (Đợt 2 · Gói 4). 10 chỉ số theo sheet "chỉ số báo cáo" của L&D.
     BR-RPT-01…10: ngày chốt kỳ · Creator chỉ khoá mình · "—" khi không có dữ liệu · giờ học, CSAT chỉ có từ khi phát hành. -->
<div id="header"></div>
<main>
  <div id="head"></div>
  <section class="adm-card"><div class="rpt-bar" id="bar"></div></section>
  <h2 class="rpt-h">Courses</h2><div class="rpt-grid rpt-grid--4" id="k-course"></div>
  <h2 class="rpt-h">Learners</h2><div class="rpt-grid rpt-grid--6" id="k-learner"></div>
  <section class="adm-box"><div class="adm-box__head"><h2 class="adm-box__title" style="flex:1">By Course</h2><span class="adm-hint">Click a row to export learner data of that course</span></div><div class="adm-card" id="table"></div></section>
</main>
<script src="../assets/js/components.js?v=1118w"></script>
<script src="../assets/js/data.js?v=1118w"></script>
<script src="../assets/js/export-modal.js?v=1118w"></script>
<script src="../assets/js/lh2-wave2.js?v=1118w"></script>
<script>
const { ICON, esc, AdminLayout, AdminHead, AdminTable, AdminEmpty, toast } = LH;
const HEADCOUNT = 400;           // nhân viên đang làm việc (THRM) tại ngày chốt
const CREATOR = 'Phạm Thanh Long';

/* Khoá Đang chạy. mand = Mandatory Course · sched = Schedule · pub = Publish lần đầu */
const COURSES = [
  { id: 'qa1', code: 'QA-M1', title: 'QA AUTOMATION _ MODULE 1: INTRODUCTION', owner: 'Phạm Thanh Long', scope: 'Restricted', mand: true, sched: '01/11 – 30/11/2026', pub: '2026-10' },
  { id: 'qa2', code: 'QA-M2', title: 'QA AUTOMATION _ MODULE 2: FUNDAMENTAL TESTING', owner: 'Phạm Thanh Long', scope: 'Restricted', mand: true, sched: '15/11 – 15/12/2026', pub: '2026-11' },
  { id: 'ccar', code: 'CCAR-F', title: 'CCAR-F Claude Certified Architect – Foundations', owner: 'Nguyễn Thu Hà', scope: 'All Company', mand: false, sched: '', pub: '2026-10' },
  { id: 'git', code: 'GIT', title: 'Git for Beginners', owner: 'Nguyễn Thu Hà', scope: 'All Company', mand: false, sched: '', pub: '2026-09' },
  { id: 'sql', code: 'SQL', title: 'SQL for Testers', owner: 'Phạm Thanh Long', scope: 'All Company', mand: false, sched: '', pub: '2026-09' },
  { id: 'aiae', code: 'AIAE', title: 'AI Agent Engineering', owner: 'Lê Thị Mai', scope: 'All Company', mand: false, sched: '', pub: '2026-09' },
  { id: 'k8s', code: 'K8S', title: 'Kubernetes Basics', owner: 'Lê Thị Mai', scope: 'All Company', mand: false, sched: '', pub: '2026-11' },
];
/* Số theo khoá và kỳ: [New Enrollments, Active Learners, Completions, First-Attempt Passed, First-Attempt Submitted, Learning Hours, CSAT sum, ratings] */
const DATA = {
  'm:2026-11': { qa1: [42, 58, 19, 21, 30, 96.5, 52, 12], qa2: [35, 33, 0, 4, 7, 41.0, 0, 0], ccar: [18, 22, 6, 5, 8, 54.0, 26, 6], git: [6, 14, 5, 3, 4, 12.5, 18, 4], sql: [4, 9, 3, 2, 3, 8.0, 0, 0], aiae: [3, 7, 1, 0, 1, 6.5, 4, 1], k8s: [0, 0, 0, 0, 0, 0, 0, 0] },
  'm:2026-10': { qa1: [51, 51, 8, 12, 19, 0, 0, 0], ccar: [24, 26, 4, 6, 9, 0, 0, 0], git: [12, 19, 9, 7, 9, 0, 0, 0], sql: [10, 12, 6, 5, 8, 0, 0, 0], aiae: [7, 11, 2, 1, 3, 0, 0, 0] },
  'm:2026-09': { git: [15, 15, 2, 1, 2, 0, 0, 0], sql: [6, 6, 0, 0, 0, 0, 0, 0], aiae: [9, 9, 1, 0, 1, 0, 0, 0] },
  'w:2026-11-16': { qa1: [8, 31, 7, 6, 9, 30.5, 20, 5], qa2: [35, 33, 0, 4, 7, 41.0, 0, 0], ccar: [4, 10, 2, 1, 2, 18.0, 9, 2], git: [1, 5, 2, 1, 1, 4.0, 5, 1], sql: [0, 2, 0, 0, 0, 1.5, 0, 0] },
  'w:2026-11-09': { qa1: [12, 28, 6, 7, 10, 28.0, 17, 4], ccar: [5, 9, 2, 2, 3, 15.5, 13, 3], git: [2, 6, 2, 1, 2, 4.5, 8, 2], sql: [2, 4, 2, 1, 2, 3.5, 0, 0], aiae: [1, 3, 1, 0, 1, 2.5, 4, 1] },
  'w:2026-11-02': { qa1: [22, 30, 6, 8, 11, 38.0, 15, 3], ccar: [9, 12, 2, 2, 3, 20.5, 4, 1], git: [3, 7, 1, 1, 1, 4.0, 5, 1], sql: [2, 5, 1, 1, 1, 3.0, 0, 0], aiae: [2, 4, 0, 0, 0, 4.0, 0, 0] },
  'w:2026-10-26': {},
};
/* Active Learners không trùng giữa các khoá (BR-RPT-05) — số người thật nhỏ hơn tổng theo khoá */
const UNIQUE = { 'm:2026-11': 118, 'm:2026-10': 104, 'm:2026-09': 27, 'w:2026-11-16': 64, 'w:2026-11-09': 47, 'w:2026-11-02': 52, 'w:2026-10-26': 0 };
const UNIQUE_CREATOR = { 'm:2026-11': 82, 'm:2026-10': 58, 'm:2026-09': 6, 'w:2026-11-16': 55, 'w:2026-11-09': 31, 'w:2026-11-02': 33, 'w:2026-10-26': 0 };
/* Giờ học chỉ có từ ngày phát hành 01/11/2026; CSAT chỉ có từ khi có đánh giá khoá (BR-RPT-10) */
const BEFORE_RELEASE = ['m:2026-10', 'm:2026-09', 'w:2026-10-26'];

const PERIODS = {
  month: [['m:2026-11', '11/2026'], ['m:2026-10', '10/2026'], ['m:2026-09', '09/2026']],
  week: [['w:2026-11-16', 'Week 16/11 – 22/11/2026'], ['w:2026-11-09', 'Week 09/11 – 15/11/2026'], ['w:2026-11-02', 'Week 02/11 – 08/11/2026'], ['w:2026-10-26', 'Week 26/10 – 01/11/2026']],
};
const CURRENT = ['m:2026-11', 'w:2026-11-16'];
const AS_OF = '20/11/2026';
const endOf = { 'm:2026-10': '31/10/2026', 'm:2026-09': '30/09/2026', 'w:2026-11-09': '15/11/2026', 'w:2026-11-02': '08/11/2026', 'w:2026-10-26': '01/11/2026' };

let role = 'admin', type = 'month', per = 'm:2026-11';
const dash = '—';
const f1 = (x) => x.toFixed(1), pctF = (a, b) => b ? f1(a / b * 100) + '%' : dash;

function compute() {
  const mine = COURSES.filter((c) => role === 'admin' || c.owner === CREATOR); // BR-RPT-03
  const D = DATA[per] || {}, pre = BEFORE_RELEASE.includes(per);
  const monthKey = per.startsWith('m:') ? per.slice(2) : '2026-11';
  const running = mine.filter((c) => c.pub <= monthKey);
  const rows = running.map((c) => ({ c, v: D[c.id] || [0, 0, 0, 0, 0, 0, 0, 0] }))
    .filter(({ c, v }) => v.some((x) => x) || (per.startsWith('m:') && c.pub === monthKey))
    .sort((a, b) => b.v[0] - a.v[0] || a.c.title.localeCompare(b.c.title));
  const sum = (i) => rows.reduce((s, r) => s + r.v[i], 0);
  const active = (role === 'admin' ? UNIQUE : UNIQUE_CREATOR)[per] || 0;
  const hours = sum(5), ratings = sum(7);
  return {
    rows, pre, active,
    total: running.length,
    newC: running.filter((c) => per.startsWith('m:') && c.pub === monthKey).length,
    mand: running.filter((c) => c.mand).length,
    used: rows.filter((r) => r.v[0] > 0).length,
    enroll: sum(0), comp: sum(2), fp: sum(3), fs: sum(4), hours, csat: ratings ? sum(6) / ratings : null, ratings,
  };
}

function kpi(n, label, tip, sub = '') {
  return `<div class="rpt-kpi" tabindex="0"><div class="rpt-kpi__n">${n}</div><div class="rpt-kpi__l">${esc(label)}<span class="rpt-kpi__i" aria-hidden="true">i</span></div>${sub ? `<div class="rpt-kpi__s">${sub}</div>` : ''}<div class="rpt-kpi__tip" role="tooltip">${esc(tip)}</div></div>`;
}

function render() {
  AdminLayout({ active: 'reports', role });
  const s = compute(), label = PERIODS[type].find(([k]) => k === per)[1], cur = CURRENT.includes(per);
  document.getElementById('head').innerHTML = AdminHead({ eyebrow: 'Reports', title: 'Learning Report',
    desc: role === 'admin' ? '' : 'Showing courses you own only.',
    right: `<button class="btn-cta" id="xls">${ICON.download}Export Excel</button>` });
  document.getElementById('bar').innerHTML = `
    <div class="seg" role="group" aria-label="Period Type"><button data-type="week" aria-pressed="${type === 'week'}">Week</button><button data-type="month" aria-pressed="${type === 'month'}">Month</button></div>
    <select class="rpt-sel" id="per" aria-label="Period">${PERIODS[type].map(([k, t]) => `<option value="${k}" ${k === per ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <span class="rpt-asof">${cur ? `as of ${AS_OF}` : `as of ${endOf[per]}`}</span>`;

  const A = s.active;
  document.getElementById('k-course').innerHTML =
    kpi(s.total, 'Total Course', 'Number of Published courses at the cut-off date of the period.')
    + kpi(per.startsWith('m:') ? s.newC : s.newC, 'New Course', 'Courses published for the first time in the period.')
    + kpi(s.mand, 'Mandatory Courses', 'Published courses marked Mandatory Course and not past End Date at the cut-off date.')
    + kpi(s.total ? pctF(s.used, s.total) : dash, 'Course Utilization Rate', 'Courses with at least 1 enrollment in the period ÷ Total Course × 100.', s.total ? `${s.used}/${s.total} courses` : '');
  document.getElementById('k-learner').innerHTML =
    kpi(A || dash, 'Active Learners', 'Learners with at least 1 learning activity (open a lesson, watch a video, start or submit a quiz) in the period. Login alone does not count.',
      `Active Learner Rate: ${role === 'admin' && A ? pctF(A, HEADCOUNT) : dash}`)
    + kpi(s.enroll || dash, 'New Course Enrollments', 'Total enrollments in the period. Re-enrolling after Unenroll counts as a new one; Re-add and Reopen Attempts do not.')
    + kpi(s.pre || !A ? dash : f1(s.hours / A), 'Average Learning Hours', 'Total learning hours in the period ÷ Active Learners. Hours = real video watch time + quiz time (capped at Time Limit).', s.pre ? 'Available from release date' : 'hours per learner')
    + kpi(A ? (s.comp / A).toFixed(2) : dash, 'Average Course Completions per Learner', 'Course completions in the period ÷ Active Learners.', A ? `${s.comp} completions` : '')
    + kpi(s.fs ? pctF(s.fp, s.fs) : dash, 'First-Attempt Pass Rate', 'Attempt 1 passed ÷ attempt 1 submitted in the period, per learner and quiz. Attempt 1 after Reopen Attempts is not counted.', s.fs ? `${s.fp}/${s.fs} first attempts` : '')
    + kpi(s.pre || s.csat == null ? dash : f1(s.csat), 'Average Learner Satisfaction Score (CSAT)', 'Average course rating (1–5) submitted in the period.', s.pre ? 'Available from release date' : `${s.ratings} ratings`);

  const head = ['Course', ['New Enrollments', 'num'], ['Active Learners', 'num'], ['Completions', 'num'], ['First-Attempt Passed / Submitted', 'num'], ['Learning Hours', 'num'], ['CSAT', 'num']];
  const body = s.rows.length ? s.rows.map(({ c, v }) => `<tr data-course="${c.id}"><td><b>${esc(c.title)}</b><div class="adm-hint">${c.scope}${c.mand ? ' · Mandatory' : ''}${c.sched ? ' · Schedule ' + c.sched : ''}${role === 'admin' ? ' · ' + esc(c.owner) : ''}</div></td>
      <td class="num">${v[0]}</td><td class="num">${v[1]}</td><td class="num">${v[2]}</td><td class="num">${v[4] ? `${v[3]}/${v[4]}` : dash}</td><td class="num">${s.pre ? dash : f1(v[5])}</td><td class="num">${s.pre || !v[7] ? dash : f1(v[6] / v[7])}</td></tr>`).join('')
    : `<tr><td colspan="7">${AdminEmpty({ icon: 'bookOpen', title: 'No learning activity in this period.', compact: true })}</td></tr>`;
  document.getElementById('table').innerHTML = AdminTable(head, body);
}

const fileName = () => per.startsWith('m:') ? `LearningReport_Month-${per.slice(7)}${per.slice(2, 6)}.xlsx` : `LearningReport_Week-${per.slice(10)}${per.slice(7, 9)}${per.slice(2, 6)}.xlsx`;
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-type]'); if (t) { type = t.dataset.type; per = PERIODS[type][0][0]; render(); return; }
  if (e.target.closest('#xls')) { toast(`${fileName()} downloaded · sheets KPIs · By Course · Info`); return; }
  const r = e.target.closest('tr[data-course]');
  if (r) { const c = COURSES.find((x) => x.id === r.dataset.course); LHExport.open({ course: c.title, code: c.code, limited: c.scope === 'Restricted', period: per.startsWith('m:') ? per.slice(2) : '', source: 'Learning Report' }); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'per') { per = e.target.value; render(); } });

LH.DemoBar('LH2 · Learning Report (Đợt 2 · Gói 4)', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin L&D'], ['editor', 'Course Creator']] },
  { label: 'Period', key: 'v', options: [['m11', 'Month 11/2026 (current)'], ['m10', 'Month 10/2026 (before release)'], ['w', 'Week 16/11'], ['empty', 'Week 26/10 (no activity)']] },
], (st) => {
  role = LH.admRole(st.r);
  ({ m11: () => { type = 'month'; per = 'm:2026-11'; }, m10: () => { type = 'month'; per = 'm:2026-10'; }, w: () => { type = 'week'; per = 'w:2026-11-16'; }, empty: () => { type = 'week'; per = 'w:2026-10-26'; } })[st.v]();
  render();
});
</script>
</body>
</html>
