.rp-stars .off { color: var(--c-border); }
.rp-tbl-h { display: flex; align-items: center; gap: 12px; }

/* Ô lọc trong bảng (khác ô tìm kiếm toàn trang trên header): kính lúp xám bên trái, không nút xanh, bo 8, có nút xoá */
.rp-filter { position: relative; display: flex; align-items: center; width: 280px; height: 40px; box-sizing: border-box; border: 1px solid var(--adm-field-stroke); border-radius: 8px; background: var(--c-white); transition: border-color .15s, box-shadow .15s; }
.rp-filter:focus-within { border-color: var(--adm-primary); box-shadow: 0 0 0 3px var(--adm-primary-50); }
.rp-filter__ic { position: absolute; left: 12px; display: grid; place-items: center; color: var(--adm-sub); pointer-events: none; }

.rp-filter input::placeholder { color: var(--adm-placeholder); opacity: 1; }

#table .adm-table :is(th, td).c-enr { width: 124px; } #table .adm-table :is(th, td).c-act { width: 80px; } #table .adm-table :is(th, td).c-comp { width: 120px; } #table .adm-table :is(th, td).c-hrs { width: 80px; } #table .adm-table :is(th, td).c-csat { width: 72px; }

@media (max-width: 1100px) { .rp-cells--4, .rp-cells--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rp-cell { border-left: 0 !important; border-top: 1px solid var(--adm-stroke) !important; } }

/* v1.6 (19/11, D-164): 10 chỉ số gom 4 thẻ theo câu hỏi L&D — Courses · Learners · Learning · Quality.
   Một màu: nền trắng, số chính màu chữ, chỉ vòng % dùng primary. Không màu theo thẻ, không gradient. */

/* 20/11 (D-165): mỗi thẻ một vạch màu đặc trên đầu (không gradient); icon nhóm và vòng % cùng màu vạch */

<body>
<!-- Learning Report v1.0 — Notion LH2 Product Docs · No 8 (Đợt 2 · Gói 4). 10 chỉ số theo sheet "chỉ số báo cáo" của L&D.
     BR-RPT-01…10: ngày chốt kỳ · Creator chỉ khoá mình · "—" khi không có dữ liệu · giờ học, CSAT chỉ có từ khi phát hành. -->
<div id="header"></div>
<main>
  <div id="head"></div>
  <section class="rp-sec"><div class="kg-grid" id="kpis"></div></section>
  <section class="rp-sec"><div class="rp-sec__h rp-tbl-h"><h2>By Course <span class="rp-count" id="q-count" aria-live="polite"></span></h2><label class="rp-filter"><span class="rp-filter__ic" id="q-ic" aria-hidden="true"></span><input id="q" type="search" placeholder="Filter by course name or code" aria-label="Filter courses in this table" autocomplete="off" maxlength="100"><button type="button" class="rp-filter__x" id="q-x" aria-label="Clear filter" hidden></button></label></div><div class="adm-card" id="table"></div></section>
</main>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/export-modal.js?v=1125a"></script>
<script src="../assets/js/lh2-wave2.js?v=1124a"></script>
<script src="../assets/js/period-picker.js?v=1123pp"></script>
<script>
const { ICON, esc, AdminLayout, AdminHead, AdminTable, AdminEmpty, toast } = LH;
const HEADCOUNT = 400;           // nhân viên đang làm việc (THRM) tại ngày chốt
const CREATOR = 'Phạm Thanh Long';

/* Khoá Đang chạy. mand = Mandatory Course · sched = Schedule · pub = Publish lần đầu */
const COURSES = [
  { id: 'qa1', code: 'QA-M1', title: 'QA AUTOMATION _ MODULE 1: INTRODUCTION', owner: 'Phạm Thanh Long', scope: 'Restricted', mand: true, sched: '01/11 – 30/11/2026', pub: '2026-10' },
  { id: 'qa2', code: 'QA-M2', title: 'QA AUTOMATION _ MODULE 2: FUNDAMENTAL TESTING', owner: 'Phạm Thanh Long', scope: 'Restricted', mand: true, sched: '15/11 – 15/12/2026', pub: '2026-11' },
  { id: 'ccar', code: 'CCAR-F', title: 'CCAR-F Claude Certified Architect – Foundations', owner: 'Nguyễn Thu Hà', scope: 'All Company', mand: false, sched: '', pub: '2026-10' },
  { id: 'git', code: 'GIT', title: 'Git for Beginners', owner: 'Nguyễn Thu Hà', scope: 'All Company', mand: false, sched: '', pub: '2026-09' },
  { id: 'sql', code: 'SQL', title: 'SQL for Testers', owner: 'Phạm Thanh Long', scope: 'All Company', mand: false, sched: '', pub: '2026-09' },
  { id: 'aiae', code: 'AIAE', title: 'AI Agent Engineering', owner: 'Lê Thị Mai', scope: 'All Company', mand: false, sched: '', pub: '2026-09' },
  { id: 'k8s', code: 'K8S', title: 'Kubernetes Basics', owner: 'Lê Thị Mai', scope: 'All Company', mand: false, sched: '', pub: '2026-11' },
];
/* Số theo khoá và kỳ: [New Enrollments, Active Learners, Completions, First-Attempt Passed, First-Attempt Submitted, Learning Hours, CSAT sum, ratings] */
const DATA = {
  'm:2026-11': { qa1: [42, 58, 19, 21, 30, 96.5, 52, 12], qa2: [35, 33, 0, 4, 7, 41.0, 0, 0], ccar: [18, 22, 6, 5, 8, 54.0, 26, 6], git: [6, 14, 5, 3, 4, 12.5, 18, 4], sql: [4, 9, 3, 2, 3, 8.0, 0, 0], aiae: [3, 7, 1, 0, 1, 6.5, 4, 1], k8s: [0, 0, 0, 0, 0, 0, 0, 0] },
  'm:2026-10': { qa1: [51, 51, 8, 12, 19, 0, 0, 0], ccar: [24, 26, 4, 6, 9, 0, 0, 0], git: [12, 19, 9, 7, 9, 0, 0, 0], sql: [10, 12, 6, 5, 8, 0, 0, 0], aiae: [7, 11, 2, 1, 3, 0, 0, 0] },
  'm:2026-09': { git: [15, 15, 2, 1, 2, 0, 0, 0], sql: [6, 6, 0, 0, 0, 0, 0, 0], aiae: [9, 9, 1, 0, 1, 0, 0, 0] },
  'w:2026-11-16': { qa1: [8, 31, 7, 6, 9, 30.5, 20, 5], qa2: [35, 33, 0, 4, 7, 41.0, 0, 0], ccar: [4, 10, 2, 1, 2, 18.0, 9, 2], git: [1, 5, 2, 1, 1, 4.0, 5, 1], sql: [0, 2, 0, 0, 0, 1.5, 0, 0] },
  'w:2026-11-09': { qa1: [12, 28, 6, 7, 10, 28.0, 17, 4], ccar: [5, 9, 2, 2, 3, 15.5, 13, 3], git: [2, 6, 2, 1, 2, 4.5, 8, 2], sql: [2, 4, 2, 1, 2, 3.5, 0, 0], aiae: [1, 3, 1, 0, 1, 2.5, 4, 1] },
  'w:2026-11-02': { qa1: [22, 30, 6, 8, 11, 38.0, 15, 3], ccar: [9, 12, 2, 2, 3, 20.5, 4, 1], git: [3, 7, 1, 1, 1, 4.0, 5, 1], sql: [2, 5, 1, 1, 1, 3.0, 0, 0], aiae: [2, 4, 0, 0, 0, 4.0, 0, 0] },
  'w:2026-10-26': {},
};
/* Active Learners không trùng giữa các khoá (BR-RPT-05) — số người thật nhỏ hơn tổng theo khoá */
const UNIQUE = { 'm:2026-11': 118, 'm:2026-10': 104, 'm:2026-09': 27, 'w:2026-11-16': 64, 'w:2026-11-09': 47, 'w:2026-11-02': 52, 'w:2026-10-26': 0 };
const UNIQUE_CREATOR = { 'm:2026-11': 82, 'm:2026-10': 58, 'm:2026-09': 6, 'w:2026-11-16': 55, 'w:2026-11-09': 31, 'w:2026-11-02': 33, 'w:2026-10-26': 0 };
/* Giờ học chỉ có từ ngày phát hành 01/11/2026; CSAT chỉ có từ khi có đánh giá khoá (BR-RPT-10) */
const BEFORE_RELEASE = ['m:2026-10', 'm:2026-09', 'w:2026-10-26'];

/* Kỳ báo cáo: từ tháng có khoá Publish sớm nhất tới kỳ hiện tại (BR-DSH-05) · tuần Thứ Hai → Chủ Nhật */
const P = LH.period;
const TODAY = '2026-11-20', MIN_DATE = '2026-09-01';
const AS_OF = P.dmy(P.parse(TODAY));

let role = 'admin', type = 'month', per = 'm:2026-11';
const dash = '—';
const f1 = (x) => x.toFixed(1), pctF = (a, b) => b ? f1(a / b * 100) + '%' : dash;

function compute(pp = per) {
  const per_ = pp;
  const mine = COURSES.filter((c) => role === 'admin' || c.owner === CREATOR); // BR-RPT-03
  const D = DATA[per_] || {}, pre = BEFORE_RELEASE.includes(per_);
  const monthKey = per_.startsWith('m:') ? per_.slice(2) : P.convert(per_, 'month', TODAY).slice(2);
  const running = mine.filter((c) => c.pub <= monthKey);
  const rows = running.map((c) => ({ c, v: D[c.id] || [0, 0, 0, 0, 0, 0, 0, 0] }))
    .filter(({ c, v }) => v.some((x) => x) || (per_.startsWith('m:') && c.pub === monthKey))
    .sort((a, b) => b.v[0] - a.v[0] || a.c.title.localeCompare(b.c.title));
  const sum = (i) => rows.reduce((s, r) => s + r.v[i], 0);
  const active = (role === 'admin' ? UNIQUE : UNIQUE_CREATOR)[per_] || 0;
  const hours = sum(5), ratings = sum(7);
  return {
    rows, pre, active,
    total: running.length,
    newC: running.filter((c) => per_.startsWith('m:') && c.pub === monthKey).length,
    mand: running.filter((c) => c.mand).length,
    used: rows.filter((r) => r.v[0] > 0).length,
    enroll: sum(0), comp: sum(2), fp: sum(3), fs: sum(4), hours, csat: ratings ? sum(6) / ratings : null, ratings,
  };
}

/* Thẻ chỉ số v1.3: số trước → nhãn → dòng phụ; icon góc phải; vòng % primary · "—" có lý do */
function ring(pct, size = 56) {
  const r = size / 2 - 6, C = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct));
  return `<div class="kp__ring" aria-hidden="true"><svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--t)" stroke-width="7"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--c)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - v / 100)}"/></svg><b>${Math.round(v)}%</b></div>`;
}
/* Biểu đồ thanh ngang theo khoá (kỳ đang xem). series: [{ key, label, color, idx }] */
const stars = (x) => `<span class="rp-stars" aria-label="${f1(x)} out of 5">${[1, 2, 3, 4, 5].map((i) => `<span class="${x >= i - 0.25 ? '' : 'off'}">★</span>`).join('')}</span>`;
let q = '';

function render() {
  AdminLayout({ active: 'reports', role });
  const s = compute(), cur = P.isCurrent(per, TODAY);
  /* Một dải đầu trang: tiêu đề + "As of" bên trái · kỳ + Export bên phải (BR-RPT-02) */
  document.getElementById('head').innerHTML = AdminHead({ eyebrow: 'Reports', title: 'Learning Report',
    desc: `As of <b>${cur ? AS_OF : P.dmy(P.end(per))}</b>${role === 'admin' ? '' : ' · Courses you own'}`,
    right: `<div class="rp-bar" id="bar">
      <div class="adm-seg adm-seg--sm" role="group" aria-label="Period Type"><button type="button" data-type="week" class="${type === 'week' ? 'is-active' : ''}" aria-pressed="${type === 'week'}">Week</button><button type="button" data-type="month" class="${type === 'month' ? 'is-active' : ''}" aria-pressed="${type === 'month'}">Month</button></div>
      ${LH.PeriodPicker({ id: 'per', type, value: per, min: MIN_DATE, today: TODAY })}
      <button class="btn-cta" id="xls">${ICON.download}Export Excel</button></div>` });

  const A = s.active, PRE = 'Available from release date';
  const util = s.total ? s.used / s.total * 100 : null, rate = role === 'admin' && A ? A / HEADCOUNT * 100 : null, fpr = s.fs ? s.fp / s.fs * 100 : null;
  /* Mỗi chỉ số: tên (rê chuột thấy tên đầy đủ + công thức) → giá trị; "—" rê chuột thấy lý do */
  const lab = (label, tip, full = '', note = '') => `<span class="rp-l" tabindex="0">${esc(label)}<span class="rp-tip" role="tooltip">${full ? `<b>${esc(full)}</b>` : ''}${esc(tip)}${note ? `<span class="rp-tip__n">${esc(note)}</span>` : ''}</span></span>`;
  const val = (v, na = 'No data in this period', unit = '') => v === dash ? `<b class="is-na" title="${esc(na)}">${dash}</b>` : `<b>${v}${unit ? `<small>${unit}</small>` : ''}</b>`;
  const row = (label, tip, v, o = {}) => `<div class="kg__row">${lab(label, tip, o.full, o.note)}${val(v, o.na, o.unit)}</div>`;
  const main = (v, label, tip, o = {}) => `<div class="kg__main"><div><div class="rp-n ${v === dash ? 'is-na' : ''}" ${v === dash ? `title="${esc(o.na || 'No data in this period')}"` : ''}>${v}${v !== dash && o.unit ? `<small>${o.unit}</small>` : ''}</div>${lab(label, tip, o.full)}${o.sub ? `<div class="rp-s">${o.sub}</div>` : ''}</div>${o.ring != null && v !== dash ? ring(o.ring, 56) : ''}</div>`;
  const card = (icon, title, body) => `<div class="kg kg--${title.toLowerCase()}"><div class="kg__h">${ICON[icon] || ''}${title}</div>${body}</div>`;
  const T = {
    total: 'Number of Published courses at the cut-off date of the period.',
    newC: 'Courses published for the first time in the period.',
    mand: 'Published courses marked Mandatory Course and not past End Date at the cut-off date.',
    util: 'Courses with at least 1 enrollment in the period ÷ Total Course × 100.',
    active: 'Learners with at least 1 learning activity (open a lesson, watch a video, start or submit a quiz) in the period. Login alone does not count. Active Learner Rate = Active Learners ÷ employees at the cut-off date × 100.',
    enroll: 'Total enrollments in the period. Re-enrolling after Unenroll counts as a new one; Re-add and Reopen Attempts do not.',
    hours: 'Total learning hours in the period ÷ Active Learners. Hours = real video watch time + quiz time (capped at Time Limit).',
    comp: 'Course completions in the period ÷ Active Learners.',
    fpr: 'Attempt 1 passed ÷ attempt 1 submitted in the period, per learner and quiz. Attempt 1 after Reopen Attempts is not counted.',
    csat: 'Average course rating (1–5) submitted in the period.',
  };
  document.getElementById('kpis').innerHTML =
    card('bookOpen', 'Courses',
      main(util == null ? dash : f1(util) + '%', 'Course Utilization Rate', T.util, { ring: util, sub: s.total ? `${s.used} of ${s.total} courses had enrollments` : '' })
      + `<div class="kg__rows">${row('Total Course', T.total, s.total)}${row('New Course', T.newC, s.newC)}${row('Mandatory Courses', T.mand, s.mand)}</div>`)
    + card('users', 'Learners',
      main(A || dash, 'Active Learners', T.active, { ring: rate, sub: rate == null ? (role === 'admin' ? '' : 'Active Learner Rate: —') : `${f1(rate)}% of ${HEADCOUNT} employees` })
      + `<div class="kg__rows">${row('New Enrollments', T.enroll, s.enroll || dash, { full: 'New Course Enrollments' })}</div>`)
    + card('clock', 'Learning',
      main(s.pre || !A ? dash : f1(s.hours / A), 'Avg Learning Hours', T.hours, { unit: 'h', full: 'Average Learning Hours', na: s.pre ? PRE : '', sub: s.pre ? PRE : 'per learner' })
      + `<div class="kg__rows">${row('Avg Completions', T.comp, A ? (s.comp / A).toFixed(2) : dash, { full: 'Average Course Completions per Learner', note: A ? `This period: ${s.comp} completions ÷ ${A} active learners.` : '' })}</div>`)
    + card('circleCheck', 'Quality',
      main(fpr == null ? dash : f1(fpr) + '%', 'First-Attempt Pass Rate', T.fpr, { ring: fpr, sub: s.fs ? `${s.fp}/${s.fs} first attempts` : '' })
      + `<div class="kg__rows">${row('CSAT', T.csat, s.pre || s.csat == null ? dash : f1(s.csat), { full: 'Average Learner Satisfaction Score (CSAT)', na: s.pre ? PRE : 'No ratings in this period', unit: '/5', note: s.pre || s.csat == null ? '' : `This period: ${s.ratings} ratings.` })}</div>`);

  /* Bảng By Course: tên cột gọn (tên đầy đủ ở tooltip + Excel), nhãn nhỏ, nút xuất cuối dòng — vừa khung, không cuộn ngang */
  const th = (short, full, cls = 'num') => [`<abbr title="${full}">${short}</abbr>`, cls];
  const head = ['Course', [`<abbr title="New Enrollments · sorted high to low">Enrollments</abbr><span class="rp-sort" aria-label="sorted descending">↓</span>`, 'num c-enr'], th('Active', 'Active Learners', 'num c-act'), th('Completions', 'Completions', 'num c-comp'), th('1st-attempt pass', 'First-Attempt Passed / Submitted', 'num w-pass'), th('Hours', 'Learning Hours', 'num c-hrs'), th('CSAT', 'Average rating (1–5)', 'num c-csat'), ['', 't-act']];
  const nq = LH.norm(q.trim());
  const rows = s.rows.filter(({ c }) => !nq || LH.norm(c.title).includes(nq) || LH.norm(c.code).includes(nq));
  document.getElementById('q-ic').innerHTML = ICON.search;
  document.getElementById('q-x').innerHTML = ICON.x;
  document.getElementById('q-x').hidden = !q;
  const nC = (n) => `${n} course${n === 1 ? '' : 's'}`;
  document.getElementById('q-count').textContent = s.rows.length ? (nq ? `${rows.length} of ${nC(s.rows.length)}` : nC(s.rows.length)) : '';
  const tipOf = (c) => [c.sched ? `Schedule ${c.sched}` : '', role === 'admin' ? `Owner: ${c.owner}` : ''].filter(Boolean).join(' · ');
  const body = rows.length ? rows.map(({ c, v }) => `<tr data-course="${c.id}" class="${v.some((x) => x) ? '' : 'is-idle'}"><td class="rp-course"><b title="${esc([c.title, tipOf(c)].filter(Boolean).join(' — '))}">${esc(c.title)}</b><div class="rp-tags"><span class="rp-tag">${c.scope}</span>${c.mand ? '<span class="rp-tag rp-tag--mand">Mandatory</span>' : ''}</div></td>
      <td class="num c-enr">${v[0]}</td><td class="num c-act">${v[1]}</td><td class="num c-comp">${v[2]}</td><td class="num w-pass">${v[4] ? `${Math.round(v[3] / v[4] * 100)}% <span class="adm-hint">(${v[3]}/${v[4]})</span>` : dash}</td><td class="num c-hrs">${s.pre ? dash : f1(v[5])}</td><td class="num c-csat">${s.pre || !v[7] ? dash : f1(v[6] / v[7])}</td>
      <td class="t-act"><button type="button" class="rp-x" data-xrow="${c.id}" title="Export learner data" aria-label="Export learner data of ${esc(c.title)}">${ICON.download}</button></td></tr>`).join('')
    : `<tr><td colspan="8">${AdminEmpty({ icon: s.rows.length ? 'search' : 'bookOpen', title: s.rows.length ? `No courses match “${q.trim()}”.` : 'No learning activity in this period.', cta: s.rows.length ? '<button type="button" class="btn-cta btn-cta--outline" data-q-clear>Clear filter</button>' : '', compact: true })}</td></tr>`;
  document.getElementById('table').innerHTML = AdminTable(head, body);
}

const fileName = () => per.startsWith('m:') ? `LearningReport_Month-${per.slice(7)}${per.slice(2, 6)}.xlsx` : `LearningReport_Week-${per.slice(10)}${per.slice(7, 9)}${per.slice(2, 6)}.xlsx`;
document.addEventListener('click', (e) => {
  const t = e.target.closest('.adm-seg [data-type]'); if (t) { if (t.dataset.type !== type) { per = P.convert(per, t.dataset.type, TODAY); type = t.dataset.type; render(); } return; }
  if (e.target.closest('#xls')) { toast(`${fileName()} downloaded · sheets KPIs · By Course · Info`); return; }
  const r = e.target.closest('tr[data-course]');
  if (r) { const c = COURSES.find((x) => x.id === r.dataset.course); LHExport.open({ course: c.title, code: c.code, limited: c.scope === 'Restricted', period: per.startsWith('m:') ? per.slice(2) : '', source: 'Learning Report' }); }
});
document.addEventListener('lh-pp-change', (e) => { per = e.detail.value; render(); });
const clearQ = () => { q = ''; render(); const el = document.getElementById('q'); el.value = ''; el.focus(); };
document.addEventListener('click', (e) => { if (e.target.closest('#q-x, [data-q-clear]')) clearQ(); });
document.addEventListener('keydown', (e) => { if (e.target.id === 'q' && e.key === 'Escape' && q) { e.preventDefault(); clearQ(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('q'); el.value = q; el.focus(); el.setSelectionRange(pos, pos); } });

LH.DemoBar('LH2 · Learning Report (Đợt 2 · Gói 4)', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin L&D'], ['editor', 'Course Creator']] },
  { label: 'Period', key: 'v', options: [['m11', 'Month 11/2026 (current)'], ['m10', 'Month 10/2026 (before release)'], ['w', 'Week 16/11'], ['empty', 'Week 26/10 (no activity)']] },
], (st) => {
  role = LH.admRole(st.r);
  (({ m11: () => { type = 'month'; per = 'm:2026-11'; }, m10: () => { type = 'month'; per = 'm:2026-10'; }, w: () => { type = 'week'; per = 'w:2026-11-16'; }, empty: () => { type = 'week'; per = 'w:2026-10-26'; } })[st.v] || (() => { type = 'month'; per = 'm:2026-11'; }))(); // link có ?v lạ → về tháng hiện tại
  render();
});
</script>
</body>
</html>
