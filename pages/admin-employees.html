<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x">
<link rel="stylesheet" href="../assets/css/admin.css?v=1125qd">
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body>
<div id="header"></div>
<main></main>
<script src="../assets/js/components.js?v=1125d"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/admin-frame.js?v=1120y"></script>
<script>
const { Avatar, esc, Tag } = LH;
const ROLES = ['PM', 'BA', 'CEO/Admin', 'Editor', 'Learner'];
LHFrame.list({
  active: 'employees',
  demoTitle: 'Employee Management · LH1',
  demoRole: [['admin', 'Admin']],
  eyebrow: 'Settings · Employee Management',
  title: 'Employee Management',
  desc: 'Employees sync from HRM (Settings › Sync Data). You can assign roles only — name, email, and department are read-only.',
  search: 'Search employees',
  filters: [['Role', ROLES], ['Department', LHData.hr.departments]],
  cols: ['Employee', 'Email', 'Department', 'Roles', ['Actions', 't-act']],
  rows: [
    { name: 'Alice Nguyen', email: 'alice.nguyen@tvf.com.vn', dept: 'ITS', roles: ['Learner'] },
    { name: 'Celine Tran', email: 'celinetran@tvf.com.vn', dept: 'Management', roles: ['PM', 'Learner'] },
    { name: 'Mina Nguyen', email: 'minanguyen@tvf.com.vn', dept: 'UIUX Design', roles: ['CEO/Admin', 'Learner'] },
    { name: 'Phạm Thanh Long', email: 'long.pt@tvf.com.vn', dept: 'L&D', roles: ['Editor', 'Learner'] },
  ],
  cell: (r) => `<td class="t-name"><span class="adm-meta">${Avatar(r.name, 'sm')}<b>${esc(r.name)}</b></span></td><td>${esc(r.email)}</td><td>${esc(r.dept)}</td>
    <td><span class="stage-wrap">${r.roles.slice(0, 2).map((x) => Tag(x, x.includes('Admin') || x === 'Editor' ? 'info' : 'neutral')).join('')}${r.roles.length > 2 ? Tag('+' + (r.roles.length - 2)) : ''}</span></td>`,
  menu: (r, i) => [{ label: 'Edit', icon: 'edit', attrs: `data-frm-edit="${i}"` }],
  empty: { icon: 'usersRound', title: 'No employees', desc: 'Run Sync Data to pull the list from HRM.', cta: '<a class="btn-cta btn-cta--soft" href="admin-sync.html?r=admin">Go to Sync Data</a>' },
  form: {
    editTitle: 'Edit employee',
    desc: 'Profile fields come from HRM — assign one or more roles below.',
    fields: [
      { key: 'name', label: 'Full name', ro: true },
      { key: 'dept', label: 'Department', ro: true },
      { key: 'email', label: 'Email', ro: true, full: true },
      { key: 'roles', label: 'Roles', type: 'checks', options: ROLES, req: true, full: true,
        hint: 'Roles are defined under Settings › Role Management.' },
    ],
  },
});
</script>
</body>
</html>
