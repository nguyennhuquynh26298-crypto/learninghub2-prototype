<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category Management · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1125sh">
<link rel="stylesheet" href="../assets/css/admin.css?v=1125nc">
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body>
<div id="header"></div>
<main>
  <div id="head"></div>
  <section class="adm-box">
    <div class="adm-box__head adm-box__head--tools"><h2 class="adm-box__title" style="flex:1">Categories</h2>
      <label class="adm-inline-search"><input id="q" placeholder="Search categories"><span></span></label>
      <button class="btn-cta" id="btn-new" type="button"></button></div>
    <div class="adm-card" id="tbl"></div>
  </section>
</main>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script>
const { ICON, esc, toast, AdminLayout, AdminHead, AdminTable, AdminEmpty, Tag, RowMenu, Modal, Button } = LH;
const TYPE = { CATEGORY: 'Category', SUB_CATEGORY: 'Sub category', TOPIC: 'Topic' };
const SAMPLE = [
  { name: 'Software Development', type: 'CATEGORY', parent: '', desc: 'Engineering and delivery skills' },
  { name: 'Web', type: 'SUB_CATEGORY', parent: 'Software Development', desc: '' },
  { name: 'Programming Fundamentals', type: 'TOPIC', parent: 'Web', desc: 'Syntax, logic, clean code' },
  { name: 'Data & AI', type: 'CATEGORY', parent: '', desc: '' },
  { name: 'Machine Learning', type: 'SUB_CATEGORY', parent: 'Data & AI', desc: '' },
  { name: 'AI Agent', type: 'TOPIC', parent: 'Machine Learning', desc: '' },
  { name: 'Language', type: 'CATEGORY', parent: '', desc: 'Business languages' },
  { name: 'English', type: 'SUB_CATEGORY', parent: 'Language', desc: '' },
  { name: 'Corporate & Mandatory Training', type: 'CATEGORY', parent: '', desc: 'Onboarding and compliance' },
];
let role, rows = [], q = '';
const depthOf = (r) => (r.type === 'CATEGORY' ? 0 : r.type === 'SUB_CATEGORY' ? 1 : 2);
function flatTree(list) {
  const order = (a, b) => a.name.localeCompare(b.name);
  const roots = list.filter((x) => x.type === 'CATEGORY').sort(order);
  const out = [];
  roots.forEach((root) => {
    out.push(root);
    list.filter((x) => x.parent === root.name && x.type === 'SUB_CATEGORY').sort(order).forEach((sub) => {
      out.push(sub);
      list.filter((x) => x.parent === sub.name && x.type === 'TOPIC').sort(order).forEach((t) => out.push(t));
    });
  });
  list.filter((x) => !out.includes(x)).forEach((x) => out.push(x));
  return out;
}
document.querySelector('.adm-inline-search span').innerHTML = ICON.search;
document.getElementById('btn-new').innerHTML = ICON.plus + 'Create';
function openModal(editRow) {
  const isNew = !editRow;
  const parents = rows.filter((x) => x.type !== 'TOPIC').map((x) => x.name);
  document.body.insertAdjacentHTML('beforeend', Modal({
    id: 'm-cat', size: 'md', icon: 'list', title: isNew ? 'Create category' : 'Edit category',
    body: `<div class="adm-form">
      <div class="adm-field"><label>Name <span class="req">*</span></label><input class="adm-input" id="f-name" value="${esc(editRow?.name || '')}" placeholder="Category name"></div>
      <div class="adm-field"><label>Type</label><select class="adm-input" id="f-type">${Object.keys(TYPE).map((k) => `<option value="${k}" ${editRow?.type === k ? 'selected' : ''}>${TYPE[k]}</option>`).join('')}</select></div>
      <div class="adm-field"><label>Parent</label><select class="adm-input" id="f-parent"><option value="">—</option>${parents.map((p) => `<option ${editRow?.parent === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="adm-field full"><label>Description</label><textarea class="adm-input" id="f-desc" placeholder="Optional">${esc(editRow?.desc || '')}</textarea></div>
    </div>`,
    foot: Button({ label: 'Cancel', variant: 'secondary', attrs: 'data-close' }) + Button({ label: 'Save', variant: 'primary', attrs: 'id="m-ok"' }),
  }));
  document.getElementById('m-ok').onclick = () => { document.getElementById('m-cat').remove(); toast(isNew ? 'Category saved (stub)' : 'Changes saved (stub)'); };
}
function render() {
  const admin = role === 'admin';
  AdminLayout({ active: 'categories', collapsed: true, role });
  document.getElementById('head').innerHTML = AdminHead({
    eyebrow: 'Settings · Category Management',
    title: 'Category Management',
    desc: 'Manage category tree: Category → Sub category → Topic. Courses link to items in this tree.',
  });
  document.getElementById('btn-new').hidden = !admin;
  const nq = LH.norm(q.trim());
  const list = flatTree(rows).filter((r) => !nq || LH.norm(r.name + r.parent + r.desc).includes(nq));
  const cols = ['Name', 'Type', 'Parent', 'Description', ['Actions', 't-act']];
  document.getElementById('tbl').innerHTML = list.length
    ? AdminTable(cols, list.map((r) => {
      const i = rows.indexOf(r);
      const pad = depthOf(r) * 20;
      return `<tr><td class="t-name"><b style="padding-left:${pad}px;display:inline-block">${esc(r.name)}</b></td>
        <td>${Tag(TYPE[r.type] || r.type, r.type === 'CATEGORY' ? 'info' : 'neutral')}</td>
        <td>${r.parent ? esc(r.parent) : '<span class="adm-hint">—</span>'}</td>
        <td>${r.desc ? esc(r.desc) : '<span class="adm-hint">—</span>'}</td>
        <td class="t-act">${RowMenu([{ label: 'Edit', icon: 'edit', attrs: `data-ed="${i}"` }])}</td></tr>`;
    }).join(''))
    : AdminEmpty({ icon: 'list', title: 'No categories yet', desc: 'Create your first category to group courses.', compact: true });
}
document.getElementById('btn-new').onclick = () => openModal(null);
document.addEventListener('click', (e) => {
  const ed = e.target.closest('[data-ed]'); if (ed) { openModal(rows[+ed.dataset.ed]); return; }
  if (e.target.closest('[data-close]')) { const m = e.target.closest('.modal-backdrop'); if (m) m.remove(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value; render(); document.getElementById('q').focus(); } });
LH.DemoBar('Category Management · LH1', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin'], ['editor', 'Editor']] },
  { label: 'Data', key: 'data', options: [['empty', 'Empty'], ['sample', 'Sample tree']] },
], (s) => {
  role = LH.admRole(s.r);
  rows = s.data === 'sample' ? SAMPLE.map((x) => ({ ...x })) : [];
  render();
});
</script>
</body>
</html>
