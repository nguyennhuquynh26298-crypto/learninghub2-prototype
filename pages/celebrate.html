<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&subset=vietnamese&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1125b">
<style>
  .cel-res { display: grid; grid-template-columns: 140px 1fr; gap: 24px; align-items: center; }
  .cel-score { width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; border: 10px solid var(--c-success-icon); font-size: var(--fs-3xl); font-weight: 700; color: var(--c-success); }
  .cel-score.is-fail { border-color: var(--c-danger); color: var(--c-danger); }
  .cel-stats { display: flex; gap: 24px; margin: 12px 0; font-size: var(--fs-sm); color: var(--c-text-subtle); }
  .cel-stats b { display: block; font-size: var(--fs-xl); color: var(--c-text-strong); }
</style>
<link rel="stylesheet" href="../assets/css/ds.css?v=1121a">
</head>
<body>
<!-- Exam 3.3 + BR-EX-19 (Passed) · Learning Progress 3.3 + BR-LP-13 (Course Completed) · D-148.
     Màn minh hoạ hiệu ứng; màn Kết quả thật (test-result.html) và màn học (lesson-learn.html) gắn LHW2 khi phiên Đợt 1 xong. -->
<div class="quiz-page"><div id="bar"></div><div class="stage-card"><div class="quiz" id="stage"></div></div></div>
<script src="../assets/js/components.js?v=1125c"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/lh2-wave2.js?v=1124a"></script>
<script>
const { QuizTopBar, esc } = LH;
const QUIZ = 'QA Automation · Module 1 Final Test', COURSE = 'QA AUTOMATION _ MODULE 1: INTRODUCTION';
const SCEN = {
  pass: { label: 'Exam Passed (just submitted)', score: 85, pass: true, fx: true },
  revisit: { label: 'Open result again later', score: 85, pass: true, fx: false },
  fail: { label: 'Not Passed', score: 62, pass: false, fx: false },
  last: { label: 'Last lesson passed → Course Completed', score: 90, pass: true, course: true },
  done: { label: 'Course Completed (video last)', course: true, noQuiz: true },
};
function result(s) {
  const right = Math.round(s.score / 5), total = 20;
  return `${s.pass && s.fx ? LHW2.passBanner({ quiz: QUIZ }) : ''}
  <div class="cel-res"><div class="cel-score ${s.pass ? '' : 'is-fail'}">${s.score}</div><div>
    <h1 style="margin:0;font-size: var(--fs-2xl)">${s.pass ? 'Passed' : 'Not Passed'}</h1>
    <div class="cel-stats"><span><b>${right}</b>Correct</span><span><b>${total - right}</b>Incorrect</span><span><b>0</b>Unanswered</span><span><b>${total}</b>Total</span></div>
    <div class="t-sm muted">Passing Score: 85% (17/20) · Attempt ${s.pass ? 2 : 1}/3</div>
    <div style="display:flex;gap:12px;margin-top:16px">${s.pass ? '' : '<button class="wbtn">Retake Exam</button>'}<button class="wbtn wbtn--outline">Review Answers</button><a class="wbtn wbtn--outline" href="course-detail.html">Back to Course</a></div>
  </div></div>`;
}
LH.DemoBar('LH2 · Celebration (BR-EX-19 · BR-LP-13)', [
  { label: 'Scenario', key: 'sc', options: Object.entries(SCEN).map(([k, v]) => [k, v.label]) },
], (st) => {
  const s = SCEN[st.sc];
  document.querySelectorAll('.cel-modal').forEach((m) => m.remove());
  document.getElementById('bar').innerHTML = QuizTopBar({ mode: 'review', title: s.noQuiz ? COURSE : QUIZ, right: '<a class="wbtn wbtn--outline" href="course-detail.html">Close</a>' });
  const stage = document.getElementById('stage');
  if (s.noQuiz) {
    stage.innerHTML = '<div class="empty"><p><b>Lesson completed: Wrap-up video</b></p></div>';
  } else {
    /* Bài cuối là bài thi → chỉ hiện popup khoá, không hiện băng Passed (không chúc mừng hai lần) */
    stage.innerHTML = result({ ...s, fx: s.fx && !s.course });
    if (s.fx && !s.course) LHW2.fireworks();
  }
  if (s.course) LHW2.courseCompleted({ learner: 'Hara Nguyen', course: COURSE, completedAt: '2026-11-20T09:00:00', certNo: 'LH-QA-M1-2026-0118', certHref: 'certificate.html?c=' + encodeURIComponent(COURSE),
  });
});
</script>
</body>
</html>
