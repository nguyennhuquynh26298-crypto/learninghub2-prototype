<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x"><link rel="stylesheet" href="../assets/css/certificate.css?v=1123d"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1125b">
<style>
  .learn-stage .player { position: absolute; inset: 0; border-radius: 0; aspect-ratio: auto; }
  .player__seg { position: absolute; top: 0; bottom: 0; background: rgba(147,150,255,.55); }
  .player__bar { cursor: pointer; }
  .player__pos { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-white); transform: translateX(-50%); }
  .player__time { position: absolute; right: 16px; bottom: 30px; font-size: var(--fs-xs); color: var(--c-border); }
  .doc-stage { display: grid; place-items: center; min-height: 100%; background: var(--c-text-strong); color: var(--c-border); padding: 24px; }
  .doc-stage__paper { width: min(640px, 90%); aspect-ratio: 4/3; background: var(--c-white); border-radius: 8px; box-shadow: 0 12px 40px rgb(0 0 0 / 0.35); display: grid; place-items: center; color: var(--text-strong); padding: 24px; text-align: center; }
  /* 25/11 rà UI: bài Article đọc trên nền trắng trong khung học (trước đây chữ tối trên nền đen) */
  .article-stage { position: absolute; inset: 0; padding: 32px 40px; overflow: auto; text-align: left; background: var(--c-white); color: var(--text-strong); font-size: var(--fs-md); line-height: 1.6; }
  .article-stage ul { padding-left: 20px; }
  .article-stage h2 { font-size: var(--fs-2xl); margin-bottom: 8px; }
  .stage-nav { cursor: pointer; }
</style>
<link rel="stylesheet" href="../assets/css/ds.css?v=1121a">
</head>
<body class="learn-body">
<!-- LH1 /course/[id]/learn — video · PDF/document · article · quiz intro (ModeSelect) -->
<div id="app"></div>
<script src="../assets/js/components.js?v=1125c"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/lh2-wave2.js?v=1124a"></script>
<script>
const { ICON, LearnShell, CourseContent, ModeSelect, ProgressBreakdown, Progress, Gauge, toast, esc } = LH;
const D = LHData; const C = D.course; const T = D.test;
const flat = () => C.sessions.flatMap((s, si) => s.lessons.map(([k, n]) => ({ k, n, session: s.name, si })));
const LESSONS = flat();
let CUR = +new URLSearchParams(location.search).get('i') || 5;
if (!LESSONS[CUR]) CUR = 0;
let lessons = [...D.myResult.lessons];
/* Video player state (chỉ bài video) */
const DUR = 600, NEED = 0.9;
let seen = new Array(DUR + 1).fill(0), pos = 0;
let playing = false, timer = null; // trình phát demo chạy thật (25/11)

const pctSeen = () => Math.floor(seen.reduce((a, x) => a + x, 0) / DUR * 100);
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function stats() {
  const kinds = LESSONS.map((l) => l.k);
  const cnt = (k) => [kinds.filter((x, i) => x === k && lessons[i] === 'done').length, kinds.filter((x) => x === k).length];
  const done = lessons.filter((x) => x === 'done').length;
  return { pct: Math.floor(done / lessons.length * 100), video: cnt('video'), test: cnt('quiz'), doc: cnt('file') };
}
function segments() {
  const out = []; let st = -1;
  for (let i = 0; i <= DUR; i++) { if (seen[i] && st < 0) st = i; if (!seen[i] && st >= 0) { out.push([st, i]); st = -1; } }
  return out;
}
function examState() {
  const KEY = 'lhExamAttempts', rows = JSON.parse(localStorage.getItem(KEY) || '[]');
  const best = rows.length ? Math.max(...rows.map((x) => x.score)) : null;
  if (best >= T.passMark) return { state: 'passed', rows };
  if (rows.length >= T.maxAttempts) return { state: 'out', rows };
  return { state: 'default', rows };
}
function stageHtml() {
  const L = LESSONS[CUR];
  if (L.k === 'video') return `<div class="player" id="player"></div>`;
  if (L.k === 'quiz') {
    const e = examState();
    /* Practice · Learner 3.2: thẻ bài thi chỉ có Start Exam; Exam 3.1: Passing Score · Attempts x/3 left · Highest Score */
    return `<div class="stage-bg">${ModeSelect({
      title: L.n, questions: T.questions, minutes: T.minutes, passMark: T.passMark, totalPts: T.questions,
      attemptsLeft: T.maxAttempts - e.rows.length, maxAttempts: T.maxAttempts, state: e.state, retake: e.rows.length > 0,
      best: e.rows.length ? `${Math.max(...e.rows.map((x) => x.right))}/${T.questions}` : null, // D-182: điểm dạng x/y
    })}</div>`;
  }
  const isArticle = /guide|exam guide/i.test(L.n);
  if (isArticle) {
    return `<div class="article-stage"><h2>${esc(L.n)}</h2><p class="muted t-sm" style="margin-bottom:16px">${esc(L.session)}</p>
      <p>This guide explains how the CCAR-F exam is organised, how much time to plan for each domain and how to use practice before each exam.</p>
      <ul style="margin-top:16px;line-height:1.6"><li>CCAR-F exam format and time per domain</li><li>Passing Score ${T.passMark}% · ${T.maxAttempts} attempts per exam</li><li>Practice does not count toward progress</li></ul></div>`;
  }
  return `<div class="doc-stage"><div class="doc-stage__paper"><div>
    <b class="t-lg">${esc(L.n)}</b>
    <p class="t-sm muted" style="margin-top:8px">${esc(L.session)}</p>
  </div></div></div>`;
}
function belowHtml() {
  const L = LESSONS[CUR];
  if (L.k === 'video') {
    const done = lessons[CUR] === 'done', p = pctSeen();
    return `<div class="watch-meter" id="meter"></div>
`;
  }
  if (L.k === 'quiz') {
    return `<section><h2 class="t-lg fw-600">About this lesson</h2>
      <p class="muted t-sm" style="margin-top:8px">${esc(T.desc || 'Practice set for Domain 1 — agentic architecture and orchestration.')}</p></section>`;
  }
  return `<section><h2 class="t-xl fw-700">${esc(L.n)}</h2><p class="t-sm muted" style="margin-top:4px">${esc(L.session)}</p></section>`;
}
function renderPlayer() {
  if (LESSONS[CUR].k !== 'video') return;
  const p = pctSeen();
  const el = document.getElementById('player'); if (!el) return;
  el.innerHTML = `<button type="button" class="player__play" data-player-toggle aria-label="${playing ? 'Pause' : 'Play'}">${playing ? ICON.pause : ICON.play}</button><span class="player__time">${fmt(pos)} / ${fmt(DUR)}</span>
    <div class="player__bar">${segments().map(([a, b]) => `<i class="player__seg" style="left:${a / DUR * 100}%;width:${(b - a) / DUR * 100}%"></i>`).join('')}<span class="player__pos" style="left:${pos / DUR * 100}%"></span></div>`;
  const meter = document.getElementById('meter'); if (!meter) return;
  const done = lessons[CUR] === 'done';
  meter.innerHTML = done ? `<span class="ls ls--done">${ICON.check}</span><b>Completed</b>`
    : `<span class="ls ls--part" style="--p:${p}"></span><span>Watched <b>${p}%</b> · 90% required</span>${Progress(p)}`;
}
function renderShell() {
  const s = stats();
  const marks = lessons.map((m, i) => i === CUR && LESSONS[i].k === 'video' && m !== 'done' ? `part:${pctSeen()}` : m);
  document.getElementById('app').innerHTML = LearnShell({
    course: C.title, pct: s.pct, stage: stageHtml(), below: belowHtml(),
    drawer: `<div id="drawer">${CourseContent(C.sessions, { current: CUR, marks, meta: { [CUR]: LESSONS[CUR].k === 'quiz' ? `${ICON.fileQ}<span>${T.questions} Questions</span>` : '' } })}</div>`,
  });
  renderPlayer();
  const g = document.querySelector('.learn-hd__pg .gauge');
  if (g) g.outerHTML = Gauge(s.pct);
}
/* BR-LP-16 (D-184): tua tới phần chưa xem tối đa 10 giây mỗi lần; tua lùi và tua trong đoạn đã xem tự do */
const SKIP_MAX = 10;
function seekTo(target) {
  target = Math.max(0, Math.min(DUR, Math.floor(target)));
  if (target > pos && !seen[target] && lessons[CUR] !== 'done') {
    const capped = Math.min(target, Math.floor(pos) + SKIP_MAX);
    if (capped < target) toast('You can skip ahead up to 10 seconds at a time.');
    target = capped;
  }
  pos = target; renderPlayer();
}
function play(sec) {
  const end = Math.min(DUR, pos + sec);
  for (let i = Math.floor(pos); i < end; i++) seen[i] = 1;
  pos = end;
  if (lessons[CUR] !== 'done' && pctSeen() >= NEED * 100) { complete(CUR); return; }
  renderPlayer();
}
/* Learning Progress 2.1: video xong ở 90%; Document / Article xong khi mở; xong hết → Completed + popup chúc mừng một lần (BR-LP-13) */
let celebrated = false;
function complete(i) {
  if (lessons[i] === 'done') return;
  lessons[i] = 'done'; toast('Lesson completed: ' + LESSONS[i].n); renderShell();
  if (!celebrated && lessons.every((x) => x === 'done') && window.LHW2) {
    celebrated = true;
    LHW2.courseCompleted({ learner: 'Hara Nguyen', course: C.title, certHref: LH.url('certificate.html') });
  }
}
function goLesson(i) {
  playing = false; clearInterval(timer);
  if (i < 0 || i >= LESSONS.length) return;
  CUR = i;
  if (LESSONS[i].k !== 'video' && LESSONS[i].k !== 'quiz') { setTimeout(() => complete(i), 400); }
  history.replaceState(null, '', `?i=${i}`);
  renderShell();
}
function render() { renderShell(); }
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-go]')) {
    const m = { exam: 'assessment.html#exam', result: 'assessment.html#result' }[e.target.closest('[data-go]').dataset.go];
    if (m) location.href = m; return;
  }
  const sec = e.target.closest('.stage-nav--l'); if (sec) { goLesson(CUR - 1); return; }
  const secR = e.target.closest('.stage-nav--r'); if (secR) { goLesson(CUR + 1); return; }
  const lesson = e.target.closest('.cc-lesson[href]'); if (lesson) { e.preventDefault(); const i = +new URL(lesson.href).searchParams.get('i'); if (!Number.isNaN(i)) goLesson(i); return; }
  const bar = e.target.closest('.player__bar');
  if (bar) { const r = bar.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * DUR); return; }
  if (e.target.closest('[data-player-toggle]')) togglePlay();
});
/* 25/11: trình phát chạy thật (không có nút thử). Play / Pause; demo chạy nhanh: mỗi 0,25 giây = 5 giây video.
   Bấm hoặc kéo thanh thời gian để tua theo BR-LP-16 */
function togglePlay() {
  playing = !playing; clearInterval(timer);
  if (playing) timer = setInterval(() => { if (LESSONS[CUR].k !== 'video' || pos >= DUR) { playing = false; clearInterval(timer); renderPlayer(); return; } play(5); }, 250);
  renderPlayer();
}
let dragBar = null;
document.addEventListener('pointerdown', (e) => { dragBar = e.target.closest('.player__bar'); });
document.addEventListener('pointerup', (e) => { if (!dragBar) return; const r = dragBar.getBoundingClientRect(); dragBar = null; if (e.target.closest('.player__bar')) return; seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * DUR); });
document.addEventListener('click', (e) => {
  const pop = document.querySelector('.popover'); const b = e.target.closest('[data-pop]');
  if (pop && !e.target.closest('.popover')) pop.remove();
  if (!b || pop) return;
  const s = stats(), r = b.getBoundingClientRect();
  document.body.insertAdjacentHTML('beforeend', `<div class="popover" style="top:${r.bottom + 8}px;left:${r.right - 320}px;position:fixed"><b class="t-sm">Your progress</b><div style="margin-top:12px">${ProgressBreakdown({ ...s, mode: 'full', practice: true })}</div></div>`);
});
LH.DemoBar('LH2 Đợt 1 · Learn shell (Learning Progress)', [
  { label: 'Bài', key: 'i', options: [['5', 'Video'], ['0', 'Slide Domain 1 (document)'], ['1', 'Quiz D1'], ['15', 'Exam Guide (article)']] },
  { label: 'Video', key: 'v', options: [['part', 'Đã xem 40%'], ['done', 'Đã xong 100%'], ['new', 'Mới']] },
  { label: 'Tiến độ', key: 'all', options: [['', 'Như dữ liệu mẫu'], ['last', 'Còn 1 video là xong khoá']] },
], (s) => {
  CUR = +s.i;
  seen = new Array(DUR + 1).fill(0); pos = 0;
  lessons = [...D.myResult.lessons];
  const upto = { part: 0.4, done: 1, new: 0 }[s.v];
  for (let i = 0; i < DUR * upto; i++) seen[i] = 1;
  pos = Math.floor(DUR * upto);
  if (s.v === 'done' && LESSONS[CUR].k === 'video') lessons[CUR] = 'done';
  if (s.all === 'last') { lessons = lessons.map((x, i) => (i === CUR && LESSONS[i].k === 'video' ? x : 'done')); celebrated = false; }
  render();
});
</script>
</body>
</html>
