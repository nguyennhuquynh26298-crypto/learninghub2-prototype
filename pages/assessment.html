<!-- LH2 Đợt 1 · docs Notion 18/11/2026 — trọn luồng bài thi của học viên trên 1 trang.
     #start    Màn bắt đầu bài thi: ô Practice Mode (trái, khi bài thi bật luyện tập) + ô Exam Mode (phải) — D-167, Practice · Learner 3.1. Exam: Passing Score · Attempts x/3 left · Highest Score (Exam 3.1)
     #practice Luyện tập: từng câu, Check Answer → Correct/Incorrect + đáp án + giải thích → Next → Tổng kết (Practice · Learner 2.1, 3.3)
     #exam     Thi: lượt 1 làm cả đề. Lượt 2, 3 hiện nguyên đề + nhãn Correct/Incorrect lượt trước; câu Correct giữ sẵn lựa chọn và vẫn sửa được,
               câu Incorrect (gồm bỏ trống) xoá trắng để chọn lại; không hiện đáp án đúng (BR-EX-03). Đồng hồ không dừng khi rời trang (BR-EX-10)
     #result   Kết quả: điểm làm tròn xuống, Passed khi số điểm đúng ≥ số điểm cần đạt (BR-EX-04, 15); Final Score = cao nhất (BR-EX-05);
               đáp án mở khi Passed hoặc hết 3 lượt (BR-EX-07); pháo hoa + Techter chỉ ngay sau lượt Passed (BR-EX-19);
               bài cuối làm khoá Completed → chỉ popup hoàn thành khoá (BR-LP-13). -->
<div id="app"></div>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/lh2-wave2.js?v=1124a"></script>
<script>
const { LearnShell, ModeSelect, CourseContent, WebQuestion, DashMeter, QuizTopBar, ExamTimer, QuestionNav, SubmitConfirm,
  ResultSummary, AnswerNote, ReviewFilter, PracticeSummary, AnswerMap, Modal, Alert, Badge, toast, esc } = LH;
const D = LHData, T = D.test, EQ = D.examFull, PQ = D.practiceQuestions, N = EQ.length, MAX = 3, CURRENT = 1;
const TOTAL_PTS = N, NEED = Math.ceil(T.passMark * TOTAL_PTS / 100); // mỗi câu 1 điểm → 80% của 32 = 25,6 → 26 (BR-EX-15)
const app = document.getElementById('app');

const K_PR = 'lhQuizPractice'; const practiceOn = () => localStorage.getItem(K_PR) !== 'off'; // công tắc Enable Practice for this quiz (Practice · Admin)
const K_ATT = 'lhExamAttempts', K_RUN = 'lhExamRunning', K_OLD = 'lhExamBeforeReopen', K_LAST = 'lhExamLastLesson';
const store = {
  get att() { return JSON.parse(localStorage.getItem(K_ATT) || '[]'); },
  set att(v) { localStorage.setItem(K_ATT, JSON.stringify(v)); },
  get run() { return JSON.parse(localStorage.getItem(K_RUN) || 'null'); },
  set run(v) { v ? localStorage.setItem(K_RUN, JSON.stringify(v)) : localStorage.removeItem(K_RUN); },
  get old() { return JSON.parse(localStorage.getItem(K_OLD) || '[]'); },
  set old(v) { localStorage.setItem(K_OLD, JSON.stringify(v)); },
};
const isOk = (q, c) => c.length === q.correct.length && c.every((x) => q.correct.includes(x));
const passed = (x) => x.right >= NEED;
/* D-182: điểm hiện dạng số điểm / tổng điểm đề (mỗi câu 1 điểm trong demo) */
const pts = (x) => x.right;
const fmt = (p) => `${p}/${TOTAL_PTS}`;
const bestOf = (A) => A.length ? Math.max(...A.map(pts)) : null;
const passedAny = (A) => A.some(passed);
const locked = (A) => A.length >= MAX || passedAny(A);
const secLeft = (run) => Math.round((run.endAt - Date.now()) / 1000);
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const fmtAt = (iso) => new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
let tick = null, justSubmitted = false;
function go(view) { if (location.hash !== '#' + view) location.hash = view; else route(); }
function shell(isLearn) { clearInterval(tick); document.body.classList.toggle('learn-body', isLearn); document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove()); scrollTo({ top: 0 }); }
function checkExpired() { const r = store.run; if (r && secLeft(r) <= 0) { finishExam(r, true); return true; } return false; }

function viewStart() {
  shell(true); const expired = checkExpired();
  const A = store.att, run = store.run, used = A.length;
  const best = bestOf(A);
  const state = run ? 'in-progress' : passedAny(A) ? 'passed' : used >= MAX ? 'out' : 'default';
  const stage = `<div class="stage-bg">${ModeSelect({ title: T.name, questions: N, minutes: T.minutes, passMark: T.passMark, totalPts: TOTAL_PTS,
    attemptsLeft: MAX - used, maxAttempts: MAX, best: best == null ? null : fmt(best), state, retake: used > 0, remain: run ? mmss(Math.max(0, secLeft(run))) : '',
    practice: practiceOn() ? { questions: PQ.length } : null, lastResult: used > 0 })}</div>`;
  /* Review 25/11: bỏ bảng Attempt History ở màn tổng quan — lịch sử lượt nằm ở màn Kết quả (Attempt history (n)) */
  const below = `<section><h2 class="t-lg fw-600">About this lesson</h2><p class="muted t-sm" style="margin-top:8px">${esc(T.desc || 'Practice set for Domain 1 — agentic architecture and orchestration.')}</p></section>`;
  app.innerHTML = LearnShell({ course: D.course.title, pct: passedAny(A) ? 37 : 31, stage, below,
    drawer: CourseContent(D.course.sessions, { current: CURRENT, marks: D.myResult.lessons.map((m, i) => (i === CURRENT ? (passedAny(A) ? 'done' : used ? 'fail' : 'none') : m)), meta: { [CURRENT]: `${LH.ICON.fileQ}<span>${N} Questions</span>` } }) });
  if (run) tick = setInterval(() => { const r = store.run; if (!r) return; const s = secLeft(r); if (s <= 0) { checkExpired(); viewStart(); return; }
    const b = app.querySelector('[data-go="exam"]'); if (b) b.textContent = `Resume Exam · ${mmss(s)} left`; }, 1000);
  if (expired) toast('Your unfinished attempt ran out of time and was submitted automatically.');
}

/* ---------- Practice — từng câu (Practice · Learner 3.3, 3.4 + plan 19/11: Skip, xem lại, phím tắt) ----------
 * Check Answer → Correct/Incorrect + Correct answer + Explanation → Next. Skip khi chưa Check (tính là chưa đúng).
 * Tổng kết: x / n correct · y incorrect · z skipped → Practice n Incorrect & Skipped · Restart · Back to Course.
 * Bấm câu trong danh sách ôn → xem lại chỉ đọc → Back to Summary. Không lưu kết quả (BR-PR-04). */
let P = null; // { st:[{chosen,checked,skipped}], order:[i], pos, done, review }
const newPractice = (only) => ({ st: PQ.map(() => ({ chosen: [], checked: false, skipped: false })), order: only || PQ.map((_, i) => i), pos: 0, done: false, review: false });
const pOk = (i) => P.st[i].checked && isOk(PQ[i], P.st[i].chosen);
const pMark = (i) => (P.st[i].checked ? (pOk(i) ? 'ok' : 'bad') : P.st[i].skipped ? 'skip' : '');
const courseHref = () => LH.url('course-detail.html');
function viewPractice() {
  shell(false); if (!P) P = newPractice();
  const n = P.order.length, i = P.order[P.pos], s = P.st[i], last = P.pos === n - 1;
  const summary = P.done && !P.review;
  /* Practice · Learner (review 25/11): bản đồ câu như Exam — cột phải, màu Correct / Incorrect / Skipped / chưa làm; thanh trên chỉ còn "Question x of n" (D-151) */
  const meter = `<span class="qbar__count">${summary ? `<b>${n}</b> of ${n} done` : `Question <b>${P.pos + 1}</b> of ${n}`}</span>`;
  const map = AnswerMap(P.order.map((k) => pMark(k) || 'todo'), { title: 'Questions', current: summary && !P.review ? -1 : P.pos, nums: P.order.map((k) => k + 1),
    legend: [['ok', 'Correct'], ['bad', 'Incorrect'], ['skip', 'Skipped'], ['todo', 'Not answered']] });
  let main;
  if (summary) {
    main = PracticeSummary({ right: P.order.filter(pOk).length, total: n,
      wrong: P.order.filter((k) => P.st[k].checked && !pOk(k)).map((k) => k + 1),
      skipped: P.order.filter((k) => !P.st[k].checked).map((k) => k + 1) });
  } else if (P.review) {
    /* Xem lại từ tổng kết: chỉ đọc, hiện đáp án đúng + giải thích; câu bỏ qua ghi Unanswered */
    main = `<div class="pr-one"><div class="pr-review">${LH.ICON.eye}Reviewing · ${s.checked ? 'read only' : 'you skipped this question'}</div>
      ${WebQuestion({ n: i + 1, ...PQ[i], chosen: s.chosen, state: 'checked' })}
      <div class="pr-one__foot"><span class="grow"></span><button class="wbtn" data-back-summary>Back to Summary</button></div></div>`;
  } else {
    main = `<div class="pr-one">${WebQuestion({ n: i + 1, ...PQ[i], chosen: s.chosen, state: s.checked ? 'checked' : 'answering', showCheck: true })}
      ${s.checked ? `<div class="pr-one__foot"><span class="grow"></span><button class="wbtn" data-next>${last ? 'See Summary' : 'Next'}</button></div>` : ''}</div>`;
  }
  app.innerHTML = `<div class="quiz-page">${QuizTopBar({ mode: 'practice', title: D.course.title, center: meter, right: '<button class="wbtn wbtn--outline" data-exit-practice>Exit</button>' })}
    <div class="stage-card"><div class="exam-wrap"><div class="quiz">
      <div class="quiz-head"><div class="quiz-head__t"><h1>${esc(T.name)}</h1><span class="quiz-badge">Practice Mode</span></div>
        <p>${n < PQ.length ? `${n} incorrect &amp; skipped questions` : `${PQ.length} questions`}</p></div>
      ${main}
    </div><aside class="exam-side">${map}</aside></div></div></div>`;
}
function pAdvance() { if (P.pos < P.order.length - 1) P.pos++; else P.done = true; viewPractice(); }
function pCheck() { const s = P.st[P.order[P.pos]]; if (!s.chosen.length) return; s.checked = true; s.skipped = false; viewPractice(); }
function pChoose(k) {
  const i = P.order[P.pos], s = P.st[i]; if (s.checked || P.done || P.review || k >= PQ[i].options.length) return;
  s.chosen = PQ[i].type === 'multi' ? (s.chosen.includes(k) ? s.chosen.filter((x) => x !== k) : [...s.chosen, k]) : [k]; s.skipped = false; viewPractice();
}
function pLeave() {
  const any = P.order.some((k) => P.st[k].checked);
  if (P.done || !any) { P = null; go('start'); return; }
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'exit', size: 'sm', icon: 'info', title: 'Exit practice?',
    body: '<p class="t-sm">Your progress in this session will not be saved.</p>',
    foot: '<button class="wbtn wbtn--outline" data-close>Stay</button><button class="wbtn" data-exit-confirm>Exit</button>' }));
}
function practiceClick(e) {
  const s = P.st[P.order[P.pos]];
  if (e.target.closest('[data-check]')) { pCheck(); return; }
  if (e.target.closest('[data-skip]')) { s.skipped = true; pAdvance(); return; }
  const o = e.target.closest('.wq-opt'); if (o) { pChoose(+o.dataset.k); return; }
  if (e.target.closest('[data-next]')) { pAdvance(); return; }
  if (e.target.closest('[data-back-summary]')) { P.review = false; viewPractice(); return; }
  if (e.target.closest('[data-retry-wrong]')) { P = newPractice(P.order.filter((k) => !pOk(k))); viewPractice(); return; }
  if (e.target.closest('[data-restart]')) { P = newPractice(); viewPractice(); return; }
  /* Bản đồ câu / danh sách ôn: đã xong lượt → xem lại chỉ đọc. Đang làm → tới câu đó; câu đã Check hiện lại kết quả, không làm lại */
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); const k = P.order.indexOf(+j.dataset.jump - 1); if (k >= 0) { P.pos = k; P.review = P.done; viewPractice(); } return; }
  if (e.target.closest('[data-back-course]') || e.target.closest('[data-exit-confirm]')) { P = null; document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove()); go('start'); return; }
  if (e.target.closest('[data-exit-practice]')) pLeave();
}
/* Phím tắt: A–D / 1–4 chọn · Enter = Check rồi Next · → = Skip (hoặc Next khi đã Check) */
addEventListener('keydown', (e) => {
  if ((location.hash.slice(1) || 'start') !== 'practice' || !P || P.done || P.review || document.querySelector('.modal-backdrop')) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  const s = P.st[P.order[P.pos]], key = e.key.toLowerCase();
  const idx = key.length === 1 ? Math.max('abcd'.indexOf(key), '1234'.indexOf(key)) : -1;
  if (idx >= 0) { e.preventDefault(); pChoose(idx); return; }
  if (e.key === 'Enter') { e.preventDefault(); if (s.checked) pAdvance(); else pCheck(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); if (!s.checked) s.skipped = true; pAdvance(); }
});

/* ---------- Exam ---------- */
let cur = 0;
function priorOf(r, i) {
  if (!r.prior) return null;
  const ch = r.prior[i] || [];
  return { chosen: [...ch], result: ch.length && isOk(EQ[i], ch) ? 'correct' : 'incorrect' };
}
const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
function navItem(r, i) {
  const c = r.chosen[i], p = priorOf(r, i), flag = r.flag[i];
  if (!p) return { st: c.length ? 'answered' : 'empty', flag };
  if (p.result === 'correct') return { st: same(p.chosen, c) ? 'kept' : 'changed', flag };
  return { st: c.length ? 'redone' : 'redo', flag };
}
function viewExam() {
  shell(false);
  if (checkExpired()) return;
  const A = store.att; if (locked(A)) { go('result'); return; } // BR-EX-06
  let run = store.run;
  if (!run) {
    const prev = A.length ? A[A.length - 1].chosen : null;
    /* BR-EX-03 (D-183): mọi lượt làm lại toàn bộ đề, mọi câu trống, không mang nhãn của lượt trước */
    const chosen = EQ.map(() => []);
    run = { chosen, flag: EQ.map(() => false), prior: null, endAt: Date.now() + T.minutes * 60000, startAt: Date.now() }; store.run = run;
  }
  const no = A.length + 1;
  app.innerHTML = `<div class="quiz-page"><div id="ebar"></div><div class="stage-card"><div class="exam-wrap">
    <div class="quiz">
      <div id="warn"></div>
      <div class="quiz-head"><div class="quiz-head__t"><h1>${esc(T.name)}</h1><span class="quiz-badge quiz-badge--exam">Exam</span></div>
        <p class="exam-line"><b>Attempt ${no}/${MAX}</b></p>
        <p class="exam-line">Passing Score: <b>${T.passMark}% (${NEED}/${TOTAL_PTS})</b> · ${N} Questions · ${T.minutes} Minutes</p></div>
      <div class="wq-list" id="eqs">${EQ.map((q, i) => WebQuestion({ n: i + 1, ...q, chosen: run.chosen[i], state: 'exam', flagged: run.flag[i], prior: priorOf(run, i) })).join('')}</div>
      <div class="quiz-foot"><button class="wbtn" data-submit>Submit</button><span class="t-sm muted" id="efoot"></span><button class="wbtn wbtn--outline" data-leave style="margin-left:auto">Leave Exam</button></div>
    </div>
    <aside class="exam-side"><div id="enav"></div></aside>
  </div></div></div>`;
  examChrome();
  tick = setInterval(() => { const r = store.run; if (!r) return; const s = secLeft(r);
    const t = app.querySelector('.qnav .timer'); if (t) t.outerHTML = ExamTimer(s);
    if (s <= 300) warn5();
    if (s <= 0) finishExam(r, true); }, 1000);
}
function warn5() { const w = document.getElementById('warn'); if (w && !w.innerHTML) w.innerHTML = `<div class="warn-banner">${Alert({ tone: 'warning', icon: 'clock', title: '5 minutes left', text: 'Your answers will be submitted automatically when time runs out.' })}</div>`; }
function examChrome() {
  const r = store.run; const ans = r.chosen.filter((c) => c.length).length;
  document.getElementById('ebar').innerHTML = QuizTopBar({ mode: 'exam', title: T.name, center: `<span class="qbar__count">Answered <b>${ans}</b> / ${N}</span>`, right: '<button class="wbtn wbtn--outline" data-exit-exam>Exit</button><button class="wbtn" data-submit>Submit</button>' });
  document.getElementById('enav').innerHTML = QuestionNav(EQ.map((q, i) => navItem(r, i)), { current: cur, retake: !!r.prior, timer: ExamTimer(Math.max(0, secLeft(r))) });
  document.getElementById('efoot').textContent = `Answered ${ans}/${N}`;
  if (secLeft(r) <= 300) warn5();
}
function examClick(e) {
  const r = store.run; if (!r) return;
  const q = e.target.closest('.wq'); const i = q ? +q.dataset.n - 1 : -1;
  const reQ = () => { document.getElementById('q' + (i + 1)).outerHTML = WebQuestion({ n: i + 1, ...EQ[i], chosen: r.chosen[i], state: 'exam', flagged: r.flag[i], prior: priorOf(r, i) }); store.run = r; examChrome(); };
  if (e.target.closest('[data-flag]')) { r.flag[i] = !r.flag[i]; reQ(); return; }
  const o = e.target.closest('.wq-opt');
  if (o && i >= 0) { const k = +o.dataset.k, c = r.chosen[i]; cur = i;
    r.chosen[i] = EQ[i].type === 'multi' ? (c.includes(k) ? c.filter((x) => x !== k) : [...c, k]) : [k]; reQ(); return; }
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); cur = +j.dataset.jump - 1; document.getElementById('q' + j.dataset.jump).scrollIntoView({ behavior: 'smooth' }); examChrome(); }
  /* DS §3.4: Exit ở màn làm bài → hỏi; đồng hồ vẫn chạy (BR-EX-10), quay lại làm tiếp được */
  if (e.target.closest('[data-exit-exam]')) {
    document.body.insertAdjacentHTML('beforeend', Modal({ id: 'exit-exam', size: 'sm', icon: 'info', title: 'Leave the exam?',
      body: '<p class="t-sm">The timer keeps running. You can come back and continue before time runs out.</p>',
      foot: '<button class="wbtn wbtn--outline" data-close>Stay</button><button class="wbtn" data-go="start">Leave</button>' }));
    return;
  }
  if (e.target.closest('[data-submit]')) {
    const un = r.chosen.filter((c) => !c.length).length, fl = r.flag.filter(Boolean).length;
    const changed = EQ.filter((qq, k) => navItem(r, k).st === 'changed').length;
    document.body.insertAdjacentHTML('beforeend', SubmitConfirm({ unanswered: un, flagged: fl, left: MAX - store.att.length, max: MAX, changed }));
  }
  if (e.target.closest('[data-submit-now]')) finishExam(r, false);
  if (e.target.closest('[data-review-empty]')) { const k = EQ.findIndex((qq, x) => !r.chosen[x].length || r.flag[x] || navItem(r, x).st === 'changed'); if (k >= 0) { cur = k; document.getElementById('q' + (k + 1)).scrollIntoView({ behavior: 'smooth' }); examChrome(); } }
  if (e.target.closest('[data-leave]')) {
    document.body.insertAdjacentHTML('beforeend', Modal({ id: 'leave', size: 'sm', icon: 'alert', iconTone: 'warning', title: 'Leave the exam?',
      body: `<p class="t-sm">Your answers are kept but <b>the timer keeps running</b> (${mmss(Math.max(0, secLeft(r)))} left). When time runs out, your answers are submitted automatically and 1 attempt is used.</p>`,
      foot: '<button class="wbtn wbtn--outline" data-close>Stay</button><button class="wbtn" data-leave-confirm>Leave</button>' }));
  }
  if (e.target.closest('[data-leave-confirm]')) go('start');
}
function finishExam(r, auto) {
  clearInterval(tick);
  const right = EQ.filter((q, i) => isOk(q, r.chosen[i])).length, blank = r.chosen.filter((c) => !c.length).length;
  const end = Math.min(Date.now(), r.endAt);
  /* BR-EX-04 (D-182): màn hình hiện số điểm right/TOTAL_PTS; score % chỉ giữ cho dữ liệu cũ */
  store.att = [...store.att, { score: Math.floor(right / TOTAL_PTS * 100), right, wrong: N - right - blank, blank, chosen: r.chosen,
    minutes: Math.max(1, Math.round((end - r.startAt) / 60000)), at: new Date(end).toISOString(), auto }];
  store.run = null; resSel = null; resFilter = 'all'; justSubmitted = true;
  if (auto && location.hash === '#exam') {
    document.querySelectorAll('.modal-backdrop').forEach((m) => m.remove());
    document.body.insertAdjacentHTML('beforeend', Modal({ id: 'expired', size: 'sm', icon: 'clock', iconTone: 'warning', title: 'Time is up',
      body: `<p class="t-sm">Your answers were submitted automatically. <b>${blank}</b> unanswered questions count as Incorrect. 1 attempt was used.</p>`,
      foot: '<button class="wbtn" data-go="result">View Result</button>' }));
    return;
  }
  if (!auto) go('result');
}

/* ---------- Result — Exam 3.3, 3.4 (review 25/11): điểm + Passed / Not Passed trên đầu; danh sách câu xem lại hiện ngay, không còn nút Review Answers;
   cột phải: bản đồ câu (Correct / Incorrect / Unanswered, bấm để nhảy câu) + "Attempt history (n)" thu gọn, bấm lượt để xem lượt đó ---------- */
let resSel = null, resFilter = 'all', histOpen = false;
function historyList(A, sel) {
  const lock = locked(A), best = bestOf(A), bestK = A.findIndex((x) => pts(x) === best);
  const row = (x, k, old) => `<button type="button" class="rv-hist__row ${k === sel && !old ? 'is-sel' : ''} ${old ? 'is-old' : ''}" ${old ? 'disabled' : `data-k="${k}"`}>
      <span>Attempt ${k + 1}</span><b>${fmt(pts(x))}</b>${passed(x) ? Badge('Passed', 'success') : Badge('Not Passed', 'danger')}
      <small>${fmtAt(x.at)}${old ? ' · Before reopen' : ''}${!old && lock && k === bestK ? ' · Final Score' : ''}${x.auto ? ' · Auto-submitted' : ''}</small></button>`;
  return `<details class="rv-hist" ${histOpen ? 'open' : ''}><summary>Attempt history (${A.length + store.old.length})${LH.ICON.chevronR}</summary>
    <div class="rv-hist__list">${A.map((x, k) => row(x, k, false)).reverse().join('')}${store.old.map((x, k) => row(x, k, true)).reverse().join('')}</div></details>`;
}
function viewResult() {
  shell(false); checkExpired();
  const A = store.att;
  if (!A.length) { go('start'); return; }
  const used = A.length, latest = used - 1, idx = resSel ?? latest, at = A[idx];
  const best = bestOf(A), reveal = locked(A), done = passedAny(A);
  const qs = EQ.map((q, k) => ({ ...q, chosen: at.chosen[k] || [] }));
  const right = qs.filter((q) => isOk(q, q.chosen)).length, blank = qs.filter((q) => !q.chosen.length).length;
  const list = qs.map((q, k) => ({ q, k, ok: isOk(q, q.chosen) })).filter((m) => resFilter === 'all' || (resFilter === 'correct') === m.ok);
  const celebrate = justSubmitted && idx === latest && passed(at);
  const courseDone = celebrate && localStorage.getItem(K_LAST) === '1';
  const marks = qs.map((q) => (!q.chosen.length ? 'blank' : isOk(q, q.chosen) ? 'ok' : 'bad'));
  const dim = qs.map((q, k) => k).filter((k) => !list.some((m) => m.k === k));
  app.innerHTML = `<div class="quiz-page">${QuizTopBar({ mode: 'review', title: T.name, right: '<button class="wbtn wbtn--outline" data-go="start">Exit</button>' })}
    <div class="stage-card"><div class="exam-wrap rv-wrap"><div class="quiz">
      ${celebrate && !courseDone && window.LHW2 ? LHW2.passBanner({ quiz: T.name }) : ''}
      ${at.auto ? `<div style="margin-bottom:16px">${Alert({ tone: 'warning', icon: 'clock', title: 'This attempt was submitted automatically when time ran out' })}</div>` : ''}
      ${ResultSummary({ score: pts(at), passMark: T.passMark, totalPts: TOTAL_PTS, right, wrong: N - right - blank, blank, total: N, minutes: at.minutes,
        attemptNo: idx + 1, maxAttempts: MAX, used, result: passed(at) ? 'pass' : 'fail', canRetry: !reveal && idx === latest, isLatest: idx === latest, best })}
      <div style="margin-bottom:24px">${AnswerNote({ state: done ? 'passed' : reveal ? 'out' : 'hidden', left: MAX - used, best: fmt(best) })}</div>
      <section id="review"><div class="rv-head"><h2>Your answers · Attempt ${idx + 1}</h2>${ReviewFilter(resFilter, { all: N, correct: right, incorrect: N - right })}</div>
        <div class="wq-list">${list.map(({ q, k }) => WebQuestion({ n: k + 1, ...q, state: reveal ? 'review-revealed' : 'review-hidden' })).join('') || `<div class="empty"><p>No ${resFilter} answers in this attempt.</p></div>`}</div></section>
    </div>
    <aside class="exam-side rv-side">${AnswerMap(marks, { title: `Attempt ${idx + 1} · ${fmt(pts(at))}`, dim, legend: [['ok', 'Correct'], ['bad', 'Incorrect'], ['blank', 'Unanswered']] })}${historyList(A, idx)}</aside>
    </div></div></div>`;
  if (celebrate) {
    justSubmitted = false;
    if (courseDone && window.LHW2) LHW2.courseCompleted({ learner: 'Hara Nguyen', course: D.course.title, certHref: LH.url('certificate.html') });
    else if (window.LHW2) LHW2.fireworks();
  } else justSubmitted = false;
}
function resultClick(e) {
  const sum = e.target.closest('.rv-hist > summary'); if (sum) { histOpen = !sum.parentElement.open; return; }
  const r = e.target.closest('[data-k]'); if (r) { resSel = +r.dataset.k; resFilter = 'all'; viewResult(); document.getElementById('review')?.scrollIntoView(); return; }
  const f = e.target.closest('[data-f]'); if (f) { resFilter = f.dataset.f; const y = scrollY; viewResult(); scrollTo({ top: y }); return; }
  /* Bản đồ câu: bấm số → nhảy tới câu; câu đang bị bộ lọc ẩn thì về All trước */
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); const el = () => document.getElementById('q' + j.dataset.jump);
    if (!el()) { resFilter = 'all'; viewResult(); } el()?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (e.target.closest('[data-retry]')) go('exam');
}

const VIEWS = { start: viewStart, practice: viewPractice, exam: viewExam, result: viewResult };
function route() { const v = location.hash.slice(1) || 'start'; (VIEWS[v] || viewStart)(); }
addEventListener('hashchange', route);
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { e.target.closest('.modal-backdrop')?.remove(); }
  const v = location.hash.slice(1) || 'start';
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); if (g.dataset.go === 'practice') P = null; if (g.dataset.go === 'result') { resSel = null; resFilter = 'all'; } go(g.dataset.go); return; }
  if (v === 'practice') practiceClick(e);
  if (v === 'exam') examClick(e);
  if (v === 'result') resultClick(e);
});
addEventListener('beforeunload', (e) => { if (location.hash === '#exam' && store.run) { e.preventDefault(); e.returnValue = ''; } });

/* Kịch bản demo — điểm từng lượt (đề 32 câu, cần 26 câu đúng) */
function sheet(right) {
  const qs = EQ.map((q) => [...q.correct]); // bắt đầu đúng hết rồi làm sai dần
  for (let k = qs.length - 1, wrong = N - right; k >= 0 && wrong > 0; k--, wrong--) qs[k] = k % 4 === 0 ? [] : [(EQ[k].correct[0] + 1) % EQ[k].options.length];
  return qs;
}
const mk = (right, daysAgo, extra = {}) => ({ score: Math.floor(right / N * 100), right, wrong: N - right, blank: 0, chosen: sheet(right), minutes: 40, at: new Date(Date.now() - daysAgo * 864e5).toISOString(), ...extra });
const SEED = {
  keep: null,
  fresh: { att: [], old: [] },
  one: { att: [mk(18, 2)], old: [] },
  two: { att: [mk(18, 3), mk(25, 1)], old: [] },
  pass: { att: [mk(18, 3), mk(27, 1)], old: [] },
  out: { att: [mk(18, 5), mk(21, 3), mk(22, 1)], old: [] },
  reopen: { att: [], old: [mk(18, 9), mk(21, 8), mk(22, 7)] },
};
function seed(k, hash) {
  const s = SEED[k]; if (!s) return;
  store.att = s.att; store.old = s.old; store.run = null; P = null; resSel = null; resFilter = 'all';
  if (hash) location.hash = hash;
}
{ const q = new URLSearchParams(location.search); if (q.get('seed')) { seed(q.get('seed')); if (q.get('last')) localStorage.setItem(K_LAST, '1'); history.replaceState(null, '', location.pathname + location.hash); } }

LH.DemoBar('LH2 Đợt 1 · Practice · Exam · Result (docs 18/11)', [
  { label: 'Data', key: 'seed', options: [['keep', 'Keep current'], ['fresh', 'No attempts'], ['one', 'Attempt 1 · 56 (Not Passed)'], ['two', '2 attempts · 56, 78'], ['pass', 'Passed at attempt 2'], ['out', 'Failed · 3/3 used'], ['reopen', 'After Reopen Attempts']] },
  { label: 'Practice for this quiz', key: 'pr', options: [['on', 'On · Practice Mode + Exam Mode'], ['off', 'Off · Exam Mode only']] },
  { label: 'This quiz is the last lesson', key: 'last', options: [['0', 'No'], ['1', 'Yes → Course Completed popup']] },
  { label: 'Timer', key: 'tm', options: [['', '—'], ['5min', 'Running attempt → 5 min left'], ['5s', 'Running attempt → 5 s left']] },
], (s) => {
  localStorage.setItem(K_LAST, s.last); localStorage.setItem(K_PR, s.pr);
  if (s.seed !== 'keep') seed(s.seed);
  if ((s.tm === '5min' || s.tm === '5s') && store.run) { const r = store.run; r.endAt = Date.now() + (s.tm === '5min' ? 301 : 6) * 1000; store.run = r; }
  route();
});
</script>
