<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Results · Reviews · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1125an"><link rel="stylesheet" href="../assets/css/certificate.css?v=1123d"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1125b">
<style>
  .mr { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .mr { grid-template-columns: 1fr; } }
  .mr-box { background: var(--c-white); border: 1px solid var(--border-default); border-radius: 16px; padding: 20px 24px; }
  .mr-box h2 { margin: 0 0 14px; font-size: var(--fs-xl); display: flex; align-items: center; gap: 10px; }
  .mr-kpi { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .mr-kpi b { display: block; font-size: var(--fs-3xl); color: var(--c-text-strong); }
  .mr-kpi span { font-size: var(--fs-xs); color: var(--c-text-subtle); }
  .mr-t { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .mr-t th, .mr-t td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--c-bg-page); }
  .mr-t th { color: var(--c-text-subtle); font-weight: 500; font-size: var(--fs-sm); }
</style>
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body class="page">
<!-- Learner Experience 2.3, 2.4, 3.5, 3.6 · BR-LP-05, BR-LP-11 (Notion LH2 Product Docs No 9, Đợt 2 · Gói 5).
     Khối My Results trên trang khoá + popup Rate this course + tab Reviews của màn học (thay "Reviews content coming soon..."). -->
<div id="header"></div>
<main class="container page__in stack gap-24">
  <div id="back"></div>
  <div class="mr"><section class="mr-box" id="results"></section><section class="mr-box" id="reviews"></section></div>
</main>
<div id="footer"></div>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/lh2-wave2.js?v=1124a"></script>
<script>
const { AppHeader, AppFooter, BackLink, esc } = LH;
const COURSE = 'QA AUTOMATION _ MODULE 1: PROGRAMMING FOUNDATION';
document.getElementById('header').innerHTML = AppHeader();
document.getElementById('footer').innerHTML = AppFooter();
document.getElementById('back').innerHTML = BackLink(COURSE, { href: 'course-detail.html' });
const STATUS_TAG = { learning: ['In Progress', 'info'], done: ['Completed', 'success'], fail: ['Failed', 'danger'], removed: ['Access Removed', 'neutral'], closed: ['Closed', 'neutral'] };
const SCEN = {
  done: { st: 'done', p: 100, v: [10, 10], q: [4, 4], done: '18/11/2026', cert: 'LH-QA-M1-2026-0087', quizzes: [['Java Basics Test', 85, 2, 'Passed'], ['OOP Test', 90, 1, 'Passed'], ['Git Test', 80, 3, 'Passed'], ['Final Test', 92, 1, 'Passed']] },
  learning: { st: 'learning', p: 33, v: [3, 10], q: [1, 4], quizzes: [['Java Basics Test', 85, 2, 'Passed'], ['OOP Test', 56, 1, 'Not Passed'], ['Git Test', null, 0, 'Not Attempted'], ['Final Test', null, 0, 'Not Attempted']] },
  fail: { st: 'fail', p: 50, v: [6, 8], q: [1, 2], quizzes: [['Java Basics Test', 85, 1, 'Passed'], ['Final Test', 69, 3, 'Failed']] },
  removed: { st: 'removed', p: 45, v: [4, 8], q: [1, 2], quizzes: [['Java Basics Test', 80, 1, 'Passed'], ['Final Test', null, 0, 'Not Attempted']] },
};
let rated = 0, shown = 5, reviews = [
  { name: 'Trần Minh Anh', stars: 5, date: '18/11/2026', text: 'Clear structure, the practice questions helped a lot before the exam.' },
  { name: 'Vũ Ngọc Lan', stars: 4, date: '15/11/2026', text: 'Good content. The Git part could use more examples.' },
  { name: 'Lê Hoàng Nam', stars: 4, date: '12/11/2026', text: '' },
  { name: 'Phạm Thu Hà', stars: 5, date: '11/11/2026', text: 'The OOP lessons are short and easy to follow. Exam questions match the videos.' },
  { name: 'Đỗ Quang Huy', stars: 3, date: '09/11/2026', text: 'Useful, but the Final Test felt longer than the course prepares you for.' },
  { name: 'Nguyễn Bảo Châu', stars: 5, date: '07/11/2026', text: 'Great for someone moving from manual to automation testing.' },
  { name: 'Hoàng Gia Bảo', stars: 4, date: '05/11/2026', text: '' },
  { name: 'Bùi Khánh Linh', stars: 5, date: '04/11/2026', text: 'Loved the practice mode — I could try as many times as I wanted.' },
  { name: 'Trịnh Văn Đức', stars: 2, date: '02/11/2026', text: 'Video audio is quiet in Section 2.' },
  { name: 'Lý Mai Phương', stars: 5, date: '01/11/2026', text: '' },
  { name: 'Ngô Thành Trung', stars: 4, date: '30/10/2026', text: 'Solid foundation course.' },
  { name: 'Đặng Hải Yến', stars: 5, date: '28/10/2026', text: 'Clear examples, good pace.' },
];
const DEFAULT = reviews.slice();
let s;
function renderResults() {
  const [t, tone] = STATUS_TAG[s.st];
  const locked = ['removed', 'closed'].includes(s.st);
  document.getElementById('results').innerHTML = `<h2>My Results <span class="badge badge--${tone}">${t}</span></h2>
    <div class="mr-kpi"><div><b>${s.p}%</b><span>Completion Rate</span></div><div><b>${s.v[0]}/${s.v[1]}</b><span>Videos</span></div><div><b>${s.q[0]}/${s.q[1]}</b><span>Quizzes</span></div></div>
    <table class="mr-t"><thead><tr><th>Quiz</th><th>Highest Score</th><th>Attempts</th><th>Result</th><th></th></tr></thead><tbody>
    ${s.quizzes.map(([n, sc, a, r]) => `<tr><td>${esc(n)}</td><td>${sc == null ? '—' : `<b>${Math.round(sc * 20 / 100)}</b>/20`}</td><td>${a}/3</td><td>${r}</td><td>${a && !locked ? '<a href="test-result.html">Review</a>' : ''}</td></tr>`).join('')}</tbody></table>
    ${s.st === 'done' ? `<div class="mr-cert">${LH.ICON.award}<div class="grow"><b>Certificate</b><span class="t-xs muted">No. ${s.cert} · Issued ${s.done}</span></div><a class="wbtn wbtn--outline" style="height:36px" href="certificate.html">View</a><button class="wbtn" style="height:36px" data-cert-dl>${LH.ICON.download}Download</button></div>
      <div class="mr-rate">${rated ? `<span>Your rating</span><b class="mr-stars">${'★'.repeat(rated)}<i>${'★'.repeat(5 - rated)}</i></b>` : '<span>How was this course?</span><button class="wbtn wbtn--outline" style="height:36px" data-rate>Rate Course</button>'}</div>` : ''}`;
}
function renderReviews() {
  const n = reviews.length, avg = n ? reviews.reduce((a, r) => a + r.stars, 0) / n : 0;
  const dist = [5, 4, 3, 2, 1].map((k) => [k, reviews.filter((r) => r.stars === k).length]);
  document.getElementById('reviews').innerHTML = `<h2>Reviews</h2>${n ? `
    <div class="rv-sum"><b>${avg.toFixed(1)}</b><div><div style="color:var(--c-star);font-size: var(--fs-xl)">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5 - Math.round(avg))}</div><span class="t-sm muted">${n} ratings</span></div>
      <div class="rv-dist">${dist.map(([k, c]) => `<div><span>${k} ★</span><span class="bar"><i style="width:${Math.round(c / n * 100)}%"></i></span><span>${c}</span></div>`).join('')}</div></div>
    ${reviews.slice(0, shown).map((r) => `<div class="rv-item"><div class="rv-item__h"><b>${esc(r.name)}</b><span>${'★'.repeat(r.stars)}</span><small>${r.date}</small></div>${r.text ? `<p>${esc(r.text)}</p>` : ''}</div>`).join('')}
    ${n > shown ? `<button class="wbtn wbtn--outline" data-more style="width:100%;margin-top:8px">Show More Reviews (${n - shown})</button>` : ''}` : '<div class="empty"><p>No reviews yet.</p></div>'}`;
}
const render = () => { renderResults(); renderReviews(); };
const ask = () => LHW2.rateCourse({ course: COURSE, onSubmit: ({ stars, comment }) => { rated = stars; reviews = [{ name: 'Hara Nguyen', stars, date: '20/11/2026', text: comment }, ...reviews]; render(); } });
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-rate]')) ask();
  if (e.target.closest('[data-more]')) { shown += 5; renderReviews(); }
  if (e.target.closest('[data-cert-dl]')) LH.toast(`Certificate downloaded · Certificate_${s.cert}.pdf`);
});
LH.DemoBar('LH2 · My Results + Rating (Đợt 2 · Gói 5)', [
  { label: 'Status', key: 'st', options: [['done', 'Completed'], ['learning', 'In Progress'], ['fail', 'Failed'], ['removed', 'Access Removed']] },
  { label: 'Rating', key: 'rt', options: [['popup', 'Just completed → celebration → rate'], ['later', 'Chose Later'], ['rated', 'Already rated'], ['none', 'No reviews yet']] },
], (st) => {
  s = SCEN[st.st]; rated = st.rt === 'rated' && st.st === 'done' ? 5 : 0; shown = 5;
  reviews = st.rt === 'none' ? [] : DEFAULT.slice();
  if (rated) reviews = [{ name: 'Hara Nguyen', stars: 5, date: '18/11/2026', text: 'Practice before the exam made a big difference.' }, ...reviews];
  document.querySelectorAll('.w2-pop, .cel-modal').forEach((p) => p.remove());
  render();
  /* D-173: Completed → popup chúc mừng (pháo hoa, chứng chỉ, Download) → đóng → Rate this course */
  if (st.st === 'done' && st.rt === 'popup') LHW2.courseCompleted({ learner: 'Hara Nguyen', course: COURSE, completedAt: '2026-11-18T09:00:00', certNo: s.cert, certHref: 'certificate.html',
    onRated: ({ stars, comment }) => { rated = stars; reviews = [{ name: 'Hara Nguyen', stars, date: '23/11/2026', text: comment }, ...reviews]; render(); } });
});
</script>
</body>
</html>
