<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1117a"><link rel="stylesheet" href="../assets/css/base.css?v=1117a"><link rel="stylesheet" href="../assets/css/components.css?v=1117a"><link rel="stylesheet" href="../assets/css/certificate.css?v=1117a">
</head>
<body class="page bg-white">
<!-- LH1 /course/[id]/certificate — chỉ khi enrolled + completed 100% -->
<div id="header"></div>
<main class="container cert-page">
  <div class="cert-page__head">
    <div class="grow" id="back"></div>
    <span id="status"></span>
  </div>
  <div id="empty" class="empty" hidden></div>
  <div id="wrap" hidden>
    <div class="cert-scale"><div class="cert-scale__in" id="sheet"></div></div>
    <div class="cert-actions">
      <button class="wbtn" id="print">Tải / In PDF</button>
      <div class="cert-share">
        <input class="input" id="share" readonly>
        <button class="wbtn wbtn--outline" id="copy">Sao chép link</button>
      </div>
    </div>
  </div>
</main>
<div id="footer"></div>
<script src="../assets/js/components.js?v=1117a"></script>
<script src="../assets/js/data.js?v=1117a"></script>
<script>
const { AppHeader, AppFooter, BackLink, CertificateSheet, Alert, toast, esc } = LH;
const D = LHData;
const courseTitle = () => decodeURIComponent(new URLSearchParams(location.search).get('c') || D.course.title);
document.getElementById('header').innerHTML = AppHeader();
document.getElementById('footer').innerHTML = AppFooter();
document.getElementById('back').innerHTML = BackLink('Certificate', { href: 'course-detail.html' });
let cert, demoCompleted = false;
function shareUrl(token) {
  const u = new URL('certificate-public.html', location.href);
  u.searchParams.set('token', token);
  return u.href;
}
function render() {
  const title = courseTitle();
  const cat = D.catalog.find((c) => c.title === title);
  demoCompleted = cat && cat.st === 'done';
  cert = LHCert.get(title);
  if (!cert && demoCompleted) {
    const [d, m, y] = (cat.done || '12/09/2026').split('/');
    cert = LHCert.mint({ courseTitle: title, completedAt: new Date(`${y}-${m}-${d}T00:00:00.000Z`).toISOString() });
  }
  const ok = !!cert;
  document.getElementById('empty').hidden = ok;
  document.getElementById('wrap').hidden = !ok;
  if (!ok) {
    document.getElementById('empty').innerHTML = `${Alert({ tone: 'warning', icon: 'info', title: 'Chưa có chứng chỉ', text: 'Hoàn thành 100% khoá học để nhận certificate_number (mint một lần, không thu hồi).' })}
      <div style="margin-top:16px"><a class="wbtn" href="course-detail.html">Về trang khoá</a></div>`;
    return;
  }
  document.title = 'Certificate · ' + title;
  document.getElementById('sheet').innerHTML = CertificateSheet(cert);
  const link = shareUrl(cert.shareToken);
  document.getElementById('share').value = link;
  document.getElementById('status').innerHTML = demoCompleted ? '<span class="badge badge--success">Hoàn thành</span>' : '<span class="badge badge--info">Demo</span>';
}
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('share').value).then(() => toast('Đã sao chép link chia sẻ'));
});
document.getElementById('print').addEventListener('click', () => window.print());
LH.DemoBar('LH1 · Certificate (enrolled)', [
  { label: 'Kịch bản', key: 'sc', options: [['done', 'Đã hoàn thành (QA Module 1)'], ['ccar', 'CCAR-F demo mint'], ['empty', 'Chưa hoàn thành']] },
], (s) => {
  if (s.sc === 'done') location.search = '?c=' + encodeURIComponent('QA AUTOMATION _ MODULE 1: PROGRAMMING FOUNDATION');
  else if (s.sc === 'ccar') location.search = '?c=' + encodeURIComponent(D.course.title);
  else location.search = '?c=' + encodeURIComponent('PROMPTS ENGINEERING');
  render();
});
render();
</script>
</body>
</html>
