<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1125sh"><link rel="stylesheet" href="../assets/css/certificate.css?v=1123d">
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body class="page bg-white">
<!-- LH1 /course/[id]/certificate — chỉ khi enrolled + completed 100% -->
<div id="header"></div>
<main class="container cert-page">
  <div class="cert-page__head">
    <div class="grow">
      <div id="back"></div>
      <h1 class="cert-page__title" id="ttl" hidden></h1>
      <p class="cert-page__sub" id="sub" hidden></p>
    </div>
    <div class="cert-page__acts" id="acts" hidden>
      <button class="wbtn wbtn--outline" id="copy"></button>
      <button class="wbtn" id="print"></button>
    </div>
  </div>
  <div id="empty" class="empty" hidden></div>
  <div id="wrap" hidden>
    <div class="cert-scale"><div class="cert-scale__in" id="sheet"></div></div>
  </div>
</main>
<div id="footer"></div>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script>
const { AppHeader, AppFooter, BackLink, CertificateSheet, Alert, toast, esc, ICON } = LH;
const D = LHData;
const courseTitle = () => decodeURIComponent(new URLSearchParams(location.search).get('c') || D.course.title);
document.getElementById('header').innerHTML = AppHeader();
document.getElementById('footer').innerHTML = AppFooter();
document.getElementById('back').innerHTML = BackLink('', { href: 'course-detail.html' });
document.getElementById('copy').innerHTML = ICON.copy + 'Copy share link';
document.getElementById('print').innerHTML = ICON.download + 'Download PDF';
let cert, demoCompleted = false, firstDemo = true;
function shareUrl(token) {
  const u = new URL('certificate-public.html', location.href);
  u.searchParams.set('token', token);
  return u.href;
}
function render() {
  const title = courseTitle();
  const cat = D.catalog.find((c) => c.title === title);
  demoCompleted = cat && cat.st === 'done';
  cert = LHCert.get(title);
  if (!cert && demoCompleted) {
    const [d, m, y] = (cat.done || '12/09/2026').split('/');
    cert = LHCert.mint({ courseTitle: title, completedAt: new Date(`${y}-${m}-${d}T00:00:00.000Z`).toISOString() });
  }
  const ok = !!cert;
  document.getElementById('empty').hidden = ok;
  ['wrap', 'ttl', 'sub', 'acts'].forEach((id) => { document.getElementById(id).hidden = !ok; });
  if (!ok) {
    document.getElementById('empty').innerHTML = `${Alert({ tone: 'warning', icon: 'info', title: 'No certificate yet', text: 'Complete the course to receive your certificate.' })}
      <div style="margin-top:16px"><a class="wbtn" href="course-detail.html">Back to Course</a></div>`;
    return;
  }
  document.title = 'Certificate · ' + title;
  document.getElementById('ttl').innerHTML = `Certificate of Completion <span class="badge badge--success">Verified</span>`;
  document.getElementById('sub').textContent = `${title} · Issued ${LHCert.fmtDate(cert.completedAt)}`;
  document.getElementById('sheet').innerHTML = CertificateSheet(cert);
  LH.fitCertScale();
}
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(shareUrl(cert.shareToken)).then(() => toast('Share link copied'));
});
document.getElementById('print').addEventListener('click', () => window.print());
LH.DemoBar('LH1 · Certificate (enrolled)', [
  { label: 'Kịch bản', key: 'sc', options: [['done', 'Đã hoàn thành (QA Module 1)'], ['ccar', 'CCAR-F demo mint'], ['empty', 'Chưa hoàn thành']] },
], (s) => {
  /* Sửa 20/11: trước đây luôn gán location.search khi trang tải → tải lại vô hạn. Chỉ đổi khi khoá chọn khác khoá đang mở. */
  const want = s.sc === 'done' ? 'QA AUTOMATION _ MODULE 1: PROGRAMMING FOUNDATION' : s.sc === 'ccar' ? D.course.title : 'PROMPTS ENGINEERING';
  const cur = new URLSearchParams(location.search).get('c');
  if (firstDemo) { firstDemo = false; if (cur !== null) { render(); return; } } /* mở từ link ?c= (popup, trang khoá) → giữ đúng khoá, không ép về kịch bản mặc định */
  if (cur !== null && cur !== want) { location.search = '?c=' + encodeURIComponent(want); return; }
  if (cur === null && new URLSearchParams(location.search).get('sc')) { location.search = '?c=' + encodeURIComponent(want); return; }
  render();
});
render();
</script>
</body>
</html>
