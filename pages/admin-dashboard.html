<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · LearningHub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x">
<link rel="stylesheet" href="../assets/css/admin.css?v=1120z">
<style>
  .dsh-alert { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-radius: 12px; background: var(--c-warning-bg); border: 1px solid var(--c-warning-border); color: var(--c-warning); font-size: var(--fs-sm); }
  .dsh-alert svg { width: 20px; height: 20px; flex: none; }
  .dsh-alert b { color: var(--c-warning); }
  .dsh-alert .grow { flex: 1 1 260px; }
</style>
<link rel="stylesheet" href="../assets/css/ds.css?v=1121a">
</head>
<body>
<div id="header"></div>
<!-- Figma: Dashboard 71:1346 — Header (Welcome back) · 3 Content/Card có % · Quick Actions 3 thẻ có nút · Recent Activity (Admin / Table row).
     [KT] bố cục gốc · [MỚI] LH2 #3: dòng cảnh báo chờ duyệt, trạng thái Chờ duyệt / Bản sửa, biến thể Course Creator.
     Learning Dashboard LH2 #10 chuyển sang Báo cáo (admin-reports.html). -->
<main>
  <div id="head"></div>
  <div id="alert"></div>
  <div class="kpi-grid kpi-grid--3" id="kpis"></div>
  <section class="adm-box"><div class="adm-box__head"><h2 class="adm-box__title">Shortcuts</h2></div><div class="qa-grid qa-grid--3" id="qa"></div></section>
  <section class="adm-box"><div class="adm-box__head"><h2 class="adm-box__title" style="flex:1">Recent activity</h2><a class="btn-cta btn-cta--line btn-cta--sm" id="see-all" href="admin-courses.html">View all</a></div><div class="adm-card" id="recent"></div></section>
</main>
<script src="../assets/js/components.js?v=1123a"></script>
<script src="../assets/js/data.js?v=1120y"></script>
<script>
const { ICON, esc, AdminLayout, AdminHead, AdminTable, AdminEmpty, TrendKpi, StageTag, RowMenu, Avatar } = LH;
const ME = 'Phạm Thanh Long';
/* Hoạt động gần đây: khoá vừa tạo / sửa / gửi duyệt. Cột theo Figma: Tên · Danh mục · Danh mục con · Phiên bản · Thời lượng · Trạng thái · Phụ trách */
const META = {
  'Automated Testing with Playwright': ['Software Development', 'Testing', '1.0', '6 hours'],
  'Claude Certified Architect – Foundations': ['Data & AI', 'AI Agent', '2.0', '12 hours'],
  'API Testing with Postman': ['Software Development', 'Testing', '1.0', '4 hours'],
  'Clean Code for Frontend': ['Software Development', 'Web', '1.0', '5 hours'],
  'AI Agent Engineering': ['Data & AI', 'AI Agent', '1.0', '8 hours'],
  'Docker for Beginners': ['Software Development', 'DevOps', '2.0', '4 hours'],
  'ADLC Guideline: Techvify SpecKit': ['Data & AI', 'Applied & Advanced', '2.0', '7 minutes'],
  'Corporate Onboarding 2026': ['Corporate & Mandatory Training', 'Role-based Training', '10.0', '2 hours'],
};
const COURSES = LHData.adminCourses.filter((c) => META[c.title]).map((c, i) => ({ ...c, i, cat: META[c.title][0], sub: META[c.title][1], ver: c.revision ? META[c.title][2] : '1.0', dur: META[c.title][3] }));
let role = 'admin', data = 'full';

function render() {
  const admin = role === 'admin'; const q = '?r=' + role;
  AdminLayout({ active: 'dashboard', role });
  const list = data === 'empty' ? [] : COURSES.filter((c) => admin || c.owner === ME);
  const pend = list.filter((c) => c.status === 'pending' || c.revision === 'pending');
  const back = list.filter((c) => c.status === 'rejected' || c.revision === 'rejected');

  document.getElementById('head').innerHTML = AdminHead({ xl: true, eyebrow: 'Welcome back!',
    title: admin ? 'Learning platform overview' : 'Your courses',
    desc: admin ? 'Here is an overview of your learning platform.' : 'Numbers only include courses you own.' });

  /* [MỚI] #3 — Admin: khoá chờ duyệt · Creator: chờ duyệt + bị trả về */
  document.getElementById('alert').innerHTML = pend.length || (!admin && back.length)
    ? `<div class="dsh-alert">${ICON.alert}<span class="grow">${admin
        ? `<b>${pend.length} courses</b> are waiting for your approval (${pend.filter((c) => c.revision).length} edits of published courses).`
        : `<b>${pend.length}</b> courses pending L&amp;D approval · <b>${back.length}</b> courses need changes.`}</span>
       <a class="btn-cta btn-cta--sm" href="admin-courses.html${q}&t=${admin ? 'pending' : 'rejected'}">${admin ? 'Review now' : 'View courses to fix'}</a></div>` : '';

  /* Content / Card có % (3 thẻ Figma) */
  const n = (v) => (data === 'empty' ? 0 : v);  document.getElementById('kpis').innerHTML = admin
    ? TrendKpi('Total courses', n(156), data === 'empty' ? null : 12, 'bookOpen') + TrendKpi('Employees learning', n(2847).toLocaleString('en-US'), data === 'empty' ? null : 8, 'usersRound', 'pink') + TrendKpi('Course completions', n(1234).toLocaleString('en-US'), data === 'empty' ? null : 10, 'award', 'success')
    : TrendKpi('Courses owned', list.length, data === 'empty' ? null : 50, 'bookOpen') + TrendKpi('Learners in progress', n(86), data === 'empty' ? null : 6, 'usersRound', 'pink') + TrendKpi('Course completions', n(31), data === 'empty' ? null : -4, 'award', 'success');

  /* Quick Actions — Figma: Tạo khoá · Xem tất cả khoá · Gán khoá. Creator không gán khoá (D-52) → Báo cáo */
  /* 13/11: thẻ ngang bấm cả thẻ, bỏ nút riêng (Figma Admin / Quick action) */
  const qa = (href, icon, t, sub) => `<a class="qa-row" href="${href}" title="${esc(sub)}"><span class="qa-row__ic">${ICON[icon]}</span><span class="qa-row__txt"><b>${t}</b><small>${sub}</small></span>${ICON.chevronR}</a>`;
  document.getElementById('qa').innerHTML = qa('course-editor.html' + q, 'plus', 'Create course', admin ? 'Add a new course to the platform.' : 'Build content, then submit it to L&D for approval.')
    + qa('admin-courses.html' + q, 'bookOpen', admin ? 'All courses' : 'My courses', admin ? 'Review and manage every course.' : 'See approval status and fix returned courses.')
    + (admin ? qa('admin-audience.html?role=Admin', 'network', 'Assign course', 'Assign courses to employees or departments and set a schedule.')
      : qa('admin-reports.html' + q, 'chart', 'Learning Report', 'Track learner progress in courses you own.'));

  document.getElementById('see-all').href = 'admin-courses.html' + q;
  document.getElementById('recent').innerHTML = list.length
    ? AdminTable([['Course Name', 't-name'], 'Category', ['Sub Category', 'col-opt'], 'Version', ['Duration', 'col-opt'], 'Status', 'Owner', ['', 't-act']],
      list.map((c) => {
        const canReview = admin && (c.status === 'pending' || c.revision === 'pending');
        const menu = [{ label: 'Xem', icon: 'eye', href: `course-approval.html?k=${c.revision ? 'rev' : 'new'}&r=${role}` },
          { label: 'Edit', icon: 'edit', href: 'course-editor.html' + q },
          ...(canReview ? [{ label: 'Review', icon: 'shieldCheck', href: `course-approval.html?k=${c.revision ? 'rev' : 'new'}` }] : []),
          ...(admin ? [{ label: 'Audience', icon: 'network', href: 'admin-audience.html?role=Admin' }] : [])];
        return `<tr><td class="t-name"><b>${esc(c.title)}</b><div class="adm-hint">Updated ${c.updated}</div></td><td>${esc(c.cat)}</td><td class="col-opt">${esc(c.sub)}</td>
          <td>Ver ${c.ver}</td><td class="col-opt">${c.dur}</td><td>${StageTag(c.status, c.revision)}</td>
          <td><span class="adm-meta">${Avatar(c.owner, 'sm')}${esc(c.owner)}</span></td><td class="t-act">${RowMenu(menu)}</td></tr>`;
      }).join(''))
    : AdminEmpty({ icon: 'bookOpen', title: 'No data yet', desc: admin ? 'No courses yet. Create your first course to get started.' : 'You do not own any course yet.', cta: `<a class="btn-cta" href="course-editor.html${q}">${ICON.plus}Create course</a>` });
}

LH.DemoBar('Dashboard — Figma 71:1346', [
  { label: 'Vai trò', key: 'r', options: [['admin', 'Admin L&D'], ['creator', 'Course Creator']] },
  { label: 'Dữ liệu', key: 'data', options: [['full', 'Có dữ liệu'], ['empty', 'Chưa có dữ liệu']] },
], (s) => { role = s.r === 'creator' ? 'creator' : 'admin'; data = s.data; render(); });
</script>
</body>
</html>
