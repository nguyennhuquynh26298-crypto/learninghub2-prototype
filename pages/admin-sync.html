<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync Data · LearningHub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1125sh">
<link rel="stylesheet" href="../assets/css/admin.css?v=1125nc">
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body>
<div id="header"></div>
<!-- Figma: Setting/ sync data 464:3450 (chọn mục → Sync) · Setting/ Details 461:4285 (lịch sử). Notion Sync Data: lấy phòng ban, nhân viên, dự án từ HRM. -->
<main>
  <div id="head"></div>
  <section class="adm-box"><div class="adm-box__head"><h2 class="adm-box__title" style="flex:1">Data from HRM</h2><button class="btn-cta" id="do-sync" disabled>Sync</button></div>
    <div class="adm-card" id="items"></div></section>
  <section class="adm-box"><div class="adm-box__head"><h2 class="adm-box__title">Sync history</h2></div><div class="adm-card" id="history"></div></section>
</main>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script>
const { ICON, esc, Tag, toast, AdminLayout, AdminHead, AdminTable, AdminEmpty, AdminConfirm } = LH;
let role;
const ITEMS = [['emp', 'Employee', 'Name, email, department, position'], ['ent', 'Entity', 'Department / unit tree'], ['prj', 'Project', 'Running projects']];
const SAMPLE = [{ item: 'Employee', date: '02/10/2025 4:40 PM', ok: true, by: 'System' }, { item: 'Entity', date: '02/10/2025 4:40 PM', ok: true, by: 'System' }, { item: 'Project', date: '02/10/2025 4:41 PM', ok: false, by: 'System' }];
let hist = []; const sel = new Set();
const now = () => { const d = new Date(); return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); };
function render() {
  AdminLayout({ active: 'sync', collapsed: true, role });
  document.getElementById('head').innerHTML = AdminHead({ eyebrow: 'Settings · Sync Data', title: 'Sync Data', desc: 'Select HRM data types and run sync. LearningHub data is overwritten from HRM.' });
  const last = (name) => hist.find((h) => h.item === name);
  document.getElementById('items').innerHTML = AdminTable([['<input type="checkbox" id="all" aria-label="Select all">', 't-chk'], 'Item', 'Last synced', 'Status'],
    ITEMS.map(([k, n, d]) => { const h = last(n); return `<tr><td class="t-chk"><input type="checkbox" data-it="${k}" ${sel.has(k) ? 'checked' : ''} aria-label="${esc(n)}"></td><td><b>${esc(n)}</b><div class="adm-hint">${esc(d)}</div></td>
      <td>${h ? h.date : '<span class="adm-hint">Never synced</span>'}</td><td>${h ? Tag(h.ok ? 'Success' : 'Failed', h.ok ? 'published' : 'pending') : Tag('No data yet')}</td></tr>`; }).join(''));
  document.getElementById('all').checked = sel.size === ITEMS.length;
  const b = document.getElementById('do-sync'); b.disabled = !sel.size; b.innerHTML = `${ICON.repeat}Sync${sel.size ? ` (${sel.size})` : ''}`;
  b.title = sel.size ? '' : 'Select at least 1 item'; // D-154: lý do nút tắt nằm ở chú thích rê chuột
  const modOf = (name) => { const hit = ITEMS.find(([, n]) => n === name); return hit ? hit[0] : 'emp'; };
  document.getElementById('history').innerHTML = hist.length
    ? AdminTable(['Item', 'Time', 'Status', 'Run by', ['Actions', 't-act']], hist.map((h, i) => `<tr><td><b><a href="admin-sync-detail.html?m=${modOf(h.item)}">${esc(h.item)}</a></b></td><td>${h.date}</td><td>${Tag(h.ok ? 'Success' : 'Failed', h.ok ? 'published' : 'pending')}</td><td>${esc(h.by)}</td>
      <td class="t-act"><a class="btn-cta btn-cta--line btn-cta--sm" href="admin-sync-detail.html?m=${modOf(h.item)}">Detail</a>${h.ok ? '' : ` <button class="btn-cta btn-cta--soft btn-cta--sm" data-retry="${i}">${ICON.repeat}Retry</button>`}</td></tr>`).join(''))
    : AdminEmpty({ icon: 'repeat', title: 'No data yet', desc: 'Nothing synced yet. Select items above, then click Sync.', compact: true });
}
document.addEventListener('change', (e) => {
  if (e.target.id === 'all') { ITEMS.forEach(([k]) => (e.target.checked ? sel.add(k) : sel.delete(k))); render(); return; }
  const it = e.target.dataset.it; if (it) { e.target.checked ? sel.add(it) : sel.delete(it); render(); }
});
document.addEventListener('click', (e) => {
  if (e.target.closest('#do-sync')) {
    AdminConfirm({ title: `Sync ${sel.size} items from HRM?`, text: 'Current data will be updated from HRM. This takes a few minutes.', ok: 'Sync', onOk: () => {
      const names = ITEMS.filter(([k]) => sel.has(k)).map(([, n]) => n);
      hist = [...names.map((n) => ({ item: n, date: now(), ok: true, by: 'Lê Thị Mai' })), ...hist]; sel.clear(); render(); toast(`Synced ${names.length} items`);
    } });
    return;
  }
  const r = e.target.closest('[data-retry]'); if (r) { const h = hist[+r.dataset.retry]; hist.unshift({ ...h, date: now(), ok: true, by: 'Lê Thị Mai' }); render(); toast('Re-run: ' + h.item); }
});
LH.DemoBar('Sync Data · LH1', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin']] },
  { label: 'Data', key: 'data', options: [['empty', 'Empty'], ['sample', 'Sample history']] },
], (s) => {
  role = LH.admRole(s.r);
  hist = s.data === 'sample' ? SAMPLE.map((x) => ({ ...x })) : [];
  sel.clear();
  render();
});
</script>
</body>
</html>
