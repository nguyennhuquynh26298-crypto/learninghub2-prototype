<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify certificate · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x"><link rel="stylesheet" href="../assets/css/certificate.css?v=1123d">
<link rel="stylesheet" href="../assets/css/ds.css?v=1121a">
</head>
<body class="page bg-white">
<!-- LH1 GET /certificate/[token] — public, không cần đăng nhập -->
<main class="container cert-page cert-public">
  <a class="logo" href="home.html" style="display:inline-block;margin-bottom:24px">Learning<b>Hub</b><i></i></a>
  <div id="banner"></div>
  <div id="wrap" hidden>
    
    <div class="cert-scale" style="margin-top:24px"><div class="cert-scale__in" id="sheet"></div></div>
  </div>
  <div id="empty" class="empty" hidden></div>
</main>
<script src="../assets/js/components.js?v=1124a"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script>
const { CertificateSheet, Alert, Badge, esc } = LH;
const token = new URLSearchParams(location.search).get('token') || '';
function render() {
  const cert = token ? LHCert.byToken(token) : null;
  document.getElementById('wrap').hidden = !cert;
  document.getElementById('empty').hidden = !!cert;
  if (!cert) {
    document.getElementById('empty').innerHTML = Alert({ tone: 'danger', icon: 'x', title: 'Certificate not found', text: 'This link is invalid or the certificate no longer exists.' });
    return;
  }
  document.title = 'Verified · ' + cert.courseTitle;
  document.getElementById('banner').innerHTML = Alert({ tone: 'success', icon: 'check', title: 'Valid certificate', text: `Issued to <strong>${esc(cert.learnerName)}</strong> on ${esc(LHCert.fmtDate(cert.completedAt))} · No. <strong>${esc(cert.certificateNumber)}</strong>` });
  document.getElementById('sheet').innerHTML = CertificateSheet({ ...cert, showMascot: true });
  LH.fitCertScale();
}
LH.DemoBar('LH1 · Certificate public', [
  { label: 'Token', key: 't', options: [['demo', 'Token demo QA M1'], ['bad', 'Token sai']] },
], (s) => {
  /* Sửa 20/11: trước đây luôn gán location.search khi trang tải → tải lại vô hạn. Chỉ đổi khi token khác token đang mở. */
  const q = new URLSearchParams(location.search);
  const want = s.t === 'demo' ? LHCert.DEMO_TOKEN : '00000000-0000-0000-0000-000000000099';
  if (q.get('token') && !q.get('t')) return; // mở bằng link chia sẻ: giữ nguyên token trong link
  if (q.get('token') === want) return;
  q.set('token', want); q.delete('t'); location.search = '?' + q.toString();
});
render();
</script>
</body>
</html>
