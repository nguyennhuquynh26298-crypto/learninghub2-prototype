<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soạn bài test — Practice · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css">
<style>
  .wrap { max-width: 960px; }
  .qe-row { cursor: pointer; } .qe-row:hover { border-color: var(--primary-200); }
  .qe-row__ans { color: var(--success-text); font-weight: 600; }
  .qe-opt { display: grid; grid-template-columns: 28px 24px 1fr 36px; gap: 8px; align-items: center; }
  .qe-opt__k { font-size: 12px; font-weight: 600; color: var(--text-subtle); text-align: center; }
  .qe-opt input[type=radio], .qe-opt input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green-600); margin: 0; }
  .qe-opt.is-right .input { border-color: var(--green-600); background: var(--green-50, #f0fdf4); }
  .qe-type { display: inline-flex; border: 1px solid var(--border-control); border-radius: var(--radius-md); overflow: hidden; }
  .qe-type button { border: 0; background: #fff; padding: 0 14px; height: 34px; font: inherit; font-size: var(--fs-sm); cursor: pointer; }
  .qe-type button.is-on { background: var(--primary-900); color: #fff; }
  .qe-err { border: 1px solid var(--red-600); background: var(--red-50); border-radius: var(--radius); padding: 10px 12px; }
  .qe-err ul { margin: 4px 0 0 18px; padding: 0; font-size: var(--fs-xs); color: var(--danger-text); }
  .counter { font-size: var(--fs-xs); color: var(--text-subtle); text-align: right; }
  .drop { border: 1.5px dashed var(--border-control); border-radius: var(--radius-lg, 12px); padding: 28px; text-align: center; background: var(--bg-subtle); cursor: pointer; }
  .drop:hover, .drop.is-over { border-color: var(--primary-900); background: var(--primary-50); }
  .drop svg { width: 28px; height: 28px; color: var(--primary-900); }
  .imp-table td { vertical-align: top; font-size: 13px; }
  .imp-table tr.is-bad td { background: var(--red-50); }
  .imp-sum { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div id="header"></div>
<div class="admin-bar"><div class="container stack gap-12" style="padding-top:16px">
  <nav class="breadcrumb"><a href="admin-audience.html">Quản lý khoá học</a><span class="chev"></span><a href="admin-audience.html">Claude Certified Architect – Foundations</a><span class="chev"></span><span>Session 1</span></nav>
  <div class="row gap-12"><h1 class="page-title grow">Test Domain 1 — Agentic Architecture</h1><span class="badge badge--neutral">Bài kiểm tra</span></div>
  <div class="tabs" style="border:0"><button class="tab">Thông tin</button><button class="tab">Đề thi (32)</button><button class="tab is-active">Practice <span id="tab-count"></span></button><button class="tab">Cài đặt chấm</button></div>
</div></div>
<main class="container screen">
  <div class="wrap stack gap-24">
    <section class="panel">
      <div class="panel__body stack gap-12">
        <label class="switch"><input type="checkbox" id="sw"><span class="switch__track"></span>Cho phép luyện tập</label>
      </div>
    </section>
    <div id="legacy"></div>
    <section class="panel" id="list-panel">
      <div class="panel__head"><b class="t-sm grow">Danh sách câu Practice</b><span class="t-sm muted" id="count"></span>
        <button class="btn btn--secondary btn--sm" id="import"></button><button class="btn btn--outline btn--sm" id="add"></button></div>
      <div class="panel__body stack gap-8" id="list"></div>
    </section>
  </div>
</main>
<div style="position:sticky;bottom:64px;background:#fff;border-top:1px solid var(--border-default)"><div class="container row gap-8" style="height:64px;justify-content:flex-end">
  <span class="t-sm muted grow" id="save-note"></span>
  <button class="btn btn--secondary" id="cancel">Huỷ</button><button class="btn btn--primary" id="save">Lưu</button>
</div></div>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/data.js"></script>
<script>
/* Tab Practice (yêu cầu #1). Trình soạn câu hỏi + Nhập từ file. Luật: docs/specs/lh2/01-practice-mode.md (BR-ASM-02, 03, 07, 08) */
const { ICON, AppHeader, Alert, Modal, toast, esc } = LH; const D = LHData;
document.getElementById('header').innerHTML = AppHeader({ role: 'Admin', user: 'Lê Thị Mai' });
document.querySelectorAll('.chev').forEach((c) => c.innerHTML = ICON.chevronR);
document.getElementById('add').innerHTML = ICON.plus + 'Thêm câu hỏi';
document.getElementById('import').innerHTML = ICON.upload + 'Nhập từ file';
const sw = document.getElementById('sw');
const KEYS = 'ABCDEF', MAX_OPT = 6, MIN_OPT = 2, MAX_Q = 1000, MAX_O = 300, MAX_EX = 1000, MAX_FILE_Q = 200, MAX_MB = 5;
const EXAM = D.examQuestions; // đề thi cùng bài (so trùng BR-ASM-03)
let items = [], saveErr = '', dirty = false;

/* ---------- Kiểm tra 1 câu (dùng chung trình soạn + nhập file) ---------- */
const nq = (s) => String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); // BR-ASM-03: bỏ khoảng trắng thừa, không phân biệt hoa thường
function check(q, self = -1, pool = items) {
  const e = [], t = String(q.text || '').trim(), opts = q.options.map((o) => String(o || '').trim());
  if (!t) e.push('Nhập nội dung câu hỏi.'); else if (t.length > MAX_Q) e.push(`Câu hỏi tối đa ${MAX_Q} ký tự.`);
  if (opts.length < MIN_OPT) e.push(`Cần ít nhất ${MIN_OPT} lựa chọn.`);
  if (opts.length > MAX_OPT) e.push(`Tối đa ${MAX_OPT} lựa chọn.`);
  opts.forEach((o, i) => { if (!o) e.push(`Lựa chọn ${KEYS[i]} đang trống — nhập nội dung hoặc xoá dòng.`); else if (o.length > MAX_O) e.push(`Lựa chọn ${KEYS[i]} tối đa ${MAX_O} ký tự.`); });
  const seen = {}; opts.forEach((o, i) => { const k = nq(o); if (!k) return; if (seen[k] != null) e.push(`Lựa chọn ${KEYS[seen[k]]} và ${KEYS[i]} giống nhau.`); else seen[k] = i; });
  if (!q.correct.length) e.push('Chọn đáp án đúng.');
  if (q.type === 'single' && q.correct.length > 1) e.push('Loại Một đáp án chỉ có 1 đáp án đúng.');
  if (q.correct.some((c) => c >= opts.length)) e.push('Đáp án đúng không khớp lựa chọn nào.');
  if ((q.explain || '').length > MAX_EX) e.push(`Giải thích tối đa ${MAX_EX} ký tự.`);
  if (t) {
    const ex = EXAM.findIndex((x) => nq(x.text) === nq(t));
    if (ex >= 0) e.push(`Trùng với đề thi (câu ${ex + 1}). Hãy viết câu khác.`);
    const pr = pool.findIndex((x, i) => i !== self && nq(x.text) === nq(t));
    if (pr >= 0) e.push(`Trùng với câu Practice số ${pr + 1}.`);
  }
  return e;
}
const dupExam = (q) => EXAM.findIndex((x) => nq(x.text) === nq(q.text));

/* ---------- Danh sách ---------- */
function render() {
  const on = sw.checked;
  document.getElementById('list-panel').style.opacity = on ? 1 : .55;
  document.getElementById('count').textContent = `${items.length} câu`;
  document.getElementById('tab-count').textContent = items.length ? `(${items.length})` : '';
  document.getElementById('list').innerHTML = (saveErr === 'empty' ? `<div class="field__error">${ICON.alert}Thêm ít nhất 1 câu luyện tập trước khi bật chế độ luyện tập.</div>` : '') +
    (items.length ? items.map((q, k) => { const errs = check(q, k); return `<div class="qe-row ${errs.length ? 'qe-row--dup' : ''}" data-edit="${k}"><span class="qe-row__num">${k + 1}</span>
      <div class="qe-row__main"><div class="qe-row__text">${esc(q.text)}</div>
        <div class="qe-row__meta">${q.type === 'multi' ? 'Nhiều đáp án' : 'Một đáp án'} · ${q.options.length} lựa chọn · Đáp án đúng: <span class="qe-row__ans">${q.correct.map((c) => KEYS[c]).join(', ') || '—'}</span> · ${q.explain ? 'có giải thích' : 'chưa có giải thích'}</div>
        ${errs.length ? `<div class="field__error">${ICON.alert}${esc(errs[0])}${errs.length > 1 ? ` (+${errs.length - 1} lỗi)` : ''}</div>` : ''}</div>
      <button class="icon-btn" data-edit="${k}" aria-label="Sửa câu ${k + 1}" title="Sửa">${ICON.edit}</button><button class="icon-btn" data-del="${k}" aria-label="Xoá câu ${k + 1}" title="Xoá">${ICON.trash}</button></div>`; }).join('')
    : `<div class="t-sm muted" style="text-align:center;padding:24px">Chưa có câu luyện tập</div>`);
  document.getElementById('save-note').textContent = dirty ? 'Có thay đổi chưa lưu' : '';
}
document.getElementById('list').addEventListener('click', (e) => {
  const d = e.target.closest('[data-del]'); if (d) { e.stopPropagation(); askDelete(+d.dataset.del); return; }
  const r = e.target.closest('[data-edit]'); if (r) openEditor(+r.dataset.edit);
});
function askDelete(k) {
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'del-modal', size: 'sm', icon: 'trash', iconTone: 'danger', title: `Xoá câu ${k + 1}?`,
    body: `<p class="t-sm">${esc(items[k].text)}</p>`, foot: '<button class="btn btn--secondary" data-close>Huỷ</button><button class="btn btn--danger" id="del-ok">Xoá</button>' }));
  document.getElementById('del-ok').onclick = () => { items.splice(k, 1); dirty = true; document.getElementById('del-modal').remove(); render(); toast(`Đã xoá câu ${k + 1}`); };
}

/* ---------- Trình soạn câu hỏi (Thêm / Sửa) ---------- */
let draft = null, editIdx = -1, tried = false;
const blank = () => ({ type: 'single', text: '', options: ['', '', '', ''], correct: [], explain: '' });
function openEditor(k = -1) {
  editIdx = k; tried = false;
  draft = k >= 0 ? JSON.parse(JSON.stringify(items[k])) : blank();
  document.getElementById('qe-modal')?.remove();
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'qe-modal', size: 'lg', title: k >= 0 ? `Sửa câu ${k + 1}` : 'Thêm câu hỏi luyện tập',
 body: '<div id="qe-body" class="stack gap-16"></div>',
    foot: `<button class="btn btn--secondary" data-qe-cancel>Huỷ</button>${k < 0 ? '<button class="btn btn--outline" data-qe-save="more">Lưu và thêm câu khác</button>' : ''}<button class="btn btn--primary" data-qe-save="one">${k >= 0 ? 'Lưu thay đổi' : 'Lưu câu hỏi'}</button>` }));
  drawEditor(); document.getElementById('qe-text').focus();
}
function drawEditor() {
  const q = draft, errs = tried ? check(q, editIdx) : [], multi = q.type === 'multi';
  document.getElementById('qe-body').innerHTML = `
    ${errs.length ? `<div class="qe-err"><b class="t-sm" style="color:var(--danger-text)">Chưa lưu được — sửa ${errs.length} lỗi:</b><ul>${errs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <div class="field"><label class="field__label" for="qe-text">Nội dung câu hỏi<span class="req">*</span></label>
      <textarea class="input ${tried && !q.text.trim() ? 'is-error' : ''}" id="qe-text" maxlength="${MAX_Q}">${esc(q.text)}</textarea>
      <div class="counter"><span id="qe-n">${q.text.length}</span>/${MAX_Q}</div></div>
    <div class="field"><span class="field__label">Loại câu hỏi<span class="req">*</span></span>
      <div><div class="qe-type"><button type="button" data-type="single" class="${multi ? '' : 'is-on'}">Một đáp án</button><button type="button" data-type="multi" class="${multi ? 'is-on' : ''}">Nhiều đáp án</button></div></div>
</div>
    <div class="field"><span class="field__label">Lựa chọn và đáp án đúng<span class="req">*</span></span>
      <div class="stack gap-8">${q.options.map((o, i) => `<div class="qe-opt ${q.correct.includes(i) ? 'is-right' : ''}">
        <input type="${multi ? 'checkbox' : 'radio'}" name="qe-c" data-c="${i}" ${q.correct.includes(i) ? 'checked' : ''} aria-label="Đáp án đúng ${KEYS[i]}">
        <span class="qe-opt__k">${KEYS[i]}</span>
        <input class="input ${tried && !o.trim() ? 'is-error' : ''}" data-o="${i}" maxlength="${MAX_O}" value="${esc(o)}" placeholder="Lựa chọn ${KEYS[i]}">
        <button type="button" class="icon-btn" data-rm="${i}" ${q.options.length <= MIN_OPT ? 'disabled style="opacity:.35"' : ''} aria-label="Xoá lựa chọn ${KEYS[i]}">${ICON.x}</button></div>`).join('')}</div>
      ${q.options.length < MAX_OPT ? `<div><button type="button" class="btn btn--link" data-addopt>${ICON.plus}Thêm lựa chọn</button></div>` : ''}</div>
    <div class="field"><label class="field__label" for="qe-ex">Giải thích</label>
      <textarea class="input" id="qe-ex" maxlength="${MAX_EX}">${esc(q.explain)}</textarea>
</div>`;
}
document.addEventListener('input', (e) => {
  if (!draft || !e.target.closest('#qe-body')) return;
  if (e.target.id === 'qe-text') { draft.text = e.target.value; document.getElementById('qe-n').textContent = e.target.value.length; }
  if (e.target.id === 'qe-ex') draft.explain = e.target.value;
  if (e.target.dataset.o != null) draft.options[+e.target.dataset.o] = e.target.value;
});
document.addEventListener('change', (e) => {
  if (!draft || e.target.dataset.c == null) return; const i = +e.target.dataset.c;
  draft.correct = draft.type === 'single' ? [i] : (e.target.checked ? [...draft.correct, i].sort() : draft.correct.filter((x) => x !== i)); drawEditor();
});
document.addEventListener('click', (e) => {
  if (!draft || !e.target.closest('#qe-modal')) return;
  const ty = e.target.closest('[data-type]'); if (ty) { draft.type = ty.dataset.type; if (draft.type === 'single' && draft.correct.length > 1) draft.correct = [draft.correct[0]]; drawEditor(); return; }
  if (e.target.closest('[data-addopt]')) { draft.options.push(''); drawEditor(); document.querySelector(`[data-o="${draft.options.length - 1}"]`).focus(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm && draft.options.length > MIN_OPT) { const i = +rm.dataset.rm; draft.options.splice(i, 1); draft.correct = draft.correct.filter((c) => c !== i).map((c) => (c > i ? c - 1 : c)); drawEditor(); return; }
  if (e.target.closest('[data-qe-cancel]')) { closeEditor(); return; }
  const sv = e.target.closest('[data-qe-save]'); if (sv) {
    tried = true; draft.text = draft.text.trim(); draft.options = draft.options.map((o) => o.trim()); draft.explain = draft.explain.trim();
    if (check(draft, editIdx).length) { drawEditor(); document.querySelector('#qe-modal .modal__body').scrollTop = 0; return; }
    if (editIdx >= 0) items[editIdx] = draft; else items.push(draft);
    dirty = true; saveErr = ''; const n = editIdx >= 0 ? editIdx + 1 : items.length; render();
    if (sv.dataset.qeSave === 'more') { toast(`Đã thêm câu ${n}`); openEditor(-1); } else { closeEditor(); toast(editIdx >= 0 ? `Đã cập nhật câu ${n}` : `Đã thêm câu ${n}`); }
  }
});
function closeEditor() { document.getElementById('qe-modal')?.remove(); draft = null; }
/* Bấm nền mờ không đóng trình soạn / nhập file (tránh mất nội dung đang nhập) */
document.addEventListener('click', (e) => { if (e.target.matches('#qe-modal, #imp-modal')) e.stopImmediatePropagation(); }, true);
document.getElementById('add').onclick = () => openEditor(-1);

/* ---------- Nhập từ file (.xlsx / .csv) ---------- */
const HEAD = ['Loại', 'Câu hỏi', 'Lựa chọn A', 'Lựa chọn B', 'Lựa chọn C', 'Lựa chọn D', 'Lựa chọn E', 'Lựa chọn F', 'Đáp án đúng', 'Giải thích'];
const SAMPLE = [
  ['Một đáp án', 'Khi nào nên dùng subagent thay vì để agent chính tự làm?', 'Khi cần đọc nhiều dữ liệu dài, chỉ cần tóm tắt', 'Khi việc chỉ có 1 bước', 'Khi cần trả lời thật nhanh', '', '', '', 'A', 'Subagent giữ context của agent chính gọn.'],
  ['Nhiều đáp án', 'Những thông tin nào nên có trong mô tả tool?', 'Tool dùng để làm gì', 'Ví dụ tham số hợp lệ', 'Tên người viết tool', 'Khi nào không nên dùng tool', '', '', 'A,B,D', 'Mô tả rõ mục đích, ví dụ và giới hạn giúp agent chọn đúng tool.'],
];
let XLSXlib = null;
const loadXLSX = () => XLSXlib ? Promise.resolve(XLSXlib) : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = () => ok(XLSXlib = window.XLSX); s.onerror = () => no(new Error('cdn')); document.head.appendChild(s); });
function downloadTemplate() {
  const rows = [HEAD, ...SAMPLE];
  loadXLSX().then((X) => { const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = HEAD.map((h, i) => ({ wch: i === 1 ? 50 : i === 9 ? 40 : 22 })); const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Cau hoi Practice'); X.writeFile(wb, 'Mau_cau_hoi_Practice.xlsx'); })
    .catch(() => { const csv = '\ufeff' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'Mau_cau_hoi_Practice.csv'; a.click(); });
}
function parseCSV(text) {
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',' || c === ';') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); out.push(row); row = []; cell = ''; } else cell += c; }
  if (cell || row.length) { row.push(cell); out.push(row); }
  return out;
}
/* Một dòng file → câu hỏi + lỗi */
function rowToQ(r) {
  const cells = HEAD.map((_, i) => String(r[i] ?? '').trim()), errs = [];
  const tRaw = nq(cells[0]); const type = tRaw === 'nhiều đáp án' || tRaw === 'multi' ? 'multi' : tRaw === 'một đáp án' || tRaw === 'single' ? 'single' : null;
  if (!type) errs.push('Cột Loại phải là "Một đáp án" hoặc "Nhiều đáp án".');
  let opts = cells.slice(2, 8); while (opts.length && !opts[opts.length - 1]) opts.pop();
  const keys = cells[8].toUpperCase().split(/[\s,;]+/).filter(Boolean);
  const bad = keys.filter((k) => !KEYS.includes(k) || KEYS.indexOf(k) >= opts.length);
  if (!keys.length) errs.push('Thiếu Đáp án đúng (vd: B hoặc A,C).'); else if (bad.length) errs.push(`Đáp án đúng "${bad.join(', ')}" không có lựa chọn tương ứng.`);
  const q = { type: type || 'single', text: cells[1], options: opts, correct: [...new Set(keys.filter((k) => !bad.includes(k)).map((k) => KEYS.indexOf(k)))].sort(), explain: cells[9] };
  return { q, errs };
}
let imp = null; // { name, rows: [{line, q, errs}] }
function openImport() {
  imp = null; document.getElementById('imp-modal')?.remove();
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'imp-modal', size: 'lg', icon: 'upload', title: 'Nhập câu luyện tập từ file',
    body: '<div id="imp-body" class="stack gap-16"></div>', foot: '<button class="btn btn--secondary" data-close>Huỷ</button><button class="btn btn--primary" id="imp-ok" disabled>Nhập câu hợp lệ</button>' }));
  drawImport();
}
function drawImport(fileErr = '') {
  const body = document.getElementById('imp-body'); const okBtn = document.getElementById('imp-ok');
  if (!imp) {
    body.innerHTML = `<div><button class="btn btn--outline btn--sm" id="imp-tpl">${ICON.download}Tải file mẫu (.xlsx)</button></div>
      <label class="drop" id="imp-drop">${ICON.upload}<div class="t-sm fw-600" style="margin-top:8px">Kéo thả hoặc chọn file</div><div class="t-xs muted">.xlsx, .csv</div><input type="file" id="imp-file" accept=".xlsx,.csv" hidden></label>
      ${fileErr ? `<div class="field__error">${ICON.alert}${esc(fileErr)}</div>` : ''}`;
    okBtn.disabled = true; okBtn.textContent = 'Nhập câu hợp lệ';
    return;
  }
  const good = imp.rows.filter((r) => !r.errs.length), badN = imp.rows.length - good.length;
  body.innerHTML = `<div class="imp-sum"><span class="badge badge--neutral">${ICON.sheet}${esc(imp.name)}</span><span class="badge badge--success">${good.length} câu hợp lệ</span>${badN ? `<span class="badge badge--danger">${badN} câu lỗi</span>` : ''}<span class="grow"></span><button class="btn btn--link" id="imp-again">Chọn file khác</button></div>
    <div style="max-height:360px;overflow:auto;border:1px solid var(--border-default);border-radius:8px"><table class="table imp-table"><thead><tr><th>Dòng</th><th>Câu hỏi</th><th>Loại</th><th>Đáp án đúng</th><th>Kết quả</th></tr></thead><tbody>
    ${imp.rows.map((r) => `<tr class="${r.errs.length ? 'is-bad' : ''}"><td>${r.line}</td><td>${esc(r.q.text) || '<i class="muted">(trống)</i>'}<div class="t-xs muted">${r.q.options.length} lựa chọn</div></td><td>${r.q.type === 'multi' ? 'Nhiều' : 'Một'}</td><td>${r.q.correct.map((c) => KEYS[c]).join(', ') || '—'}</td>
      <td>${r.errs.length ? `<div class="field__error" style="align-items:flex-start">${ICON.alert}<span>${r.errs.map(esc).join('<br>')}</span></div>` : '<span class="badge badge--success">Hợp lệ</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  okBtn.disabled = !good.length; okBtn.textContent = good.length ? `Nhập ${good.length} câu hợp lệ` : 'Không có câu hợp lệ';
}
function readRows(name, rows) {
  rows = rows.filter((r) => r.some((c) => String(c ?? '').trim()));
  const head = (rows[0] || []).map((c) => nq(c));
  if (head[1] !== 'câu hỏi' || head[8] !== 'đáp án đúng') return drawImport('File không đúng mẫu. Tải file mẫu và giữ nguyên dòng tiêu đề.');
  const data = rows.slice(1);
  if (!data.length) return drawImport('File không có câu hỏi nào.');
  if (data.length > MAX_FILE_Q) return drawImport(`File có ${data.length} câu, vượt giới hạn ${MAX_FILE_Q} câu / file. Chia thành nhiều file.`);
  const out = []; // trùng trong file: so với các dòng hợp lệ phía trên
  data.forEach((r, i) => { const { q, errs } = rowToQ(r); const all = [...errs, ...check(q, -1, items).filter((x) => !(errs.some((y) => /Đáp án đúng/i.test(y)) && /đáp án đúng/i.test(x)))];
    const twin = out.findIndex((o) => !o.errs.length && nq(o.q.text) === nq(q.text)); if (q.text && twin >= 0) all.push(`Trùng với dòng ${out[twin].line} trong file.`);
    out.push({ line: i + 2, q, errs: [...new Set(all)] }); });
  imp = { name, rows: out }; drawImport();
}
function handleFile(f) {
  if (!f) return; const ext = f.name.split('.').pop().toLowerCase();
  if (!['xlsx', 'csv'].includes(ext)) return drawImport('Chỉ nhận file .xlsx hoặc .csv.');
  if (f.size > MAX_MB * 1024 * 1024) return drawImport(`File vượt ${MAX_MB} MB.`);
  if (ext === 'csv') { f.text().then((t) => readRows(f.name, parseCSV(t.replace(/^\ufeff/, '')))); return; }
  Promise.all([loadXLSX(), f.arrayBuffer()]).then(([X, buf]) => { const wb = X.read(buf); readRows(f.name, X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' })); })
    .catch(() => drawImport('Không đọc được file .xlsx. Thử lưu lại dạng .csv (UTF-8).'));
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('#imp-modal')) return;
  if (e.target.closest('#imp-tpl')) { e.preventDefault(); downloadTemplate(); }
  if (e.target.closest('#imp-again')) { imp = null; drawImport(); }
  if (e.target.closest('#imp-ok') && imp) { const good = imp.rows.filter((r) => !r.errs.length).map((r) => r.q); const from = items.length + 1; items.push(...good); dirty = true; saveErr = '';
    document.getElementById('imp-modal').remove(); render(); toast(`Đã nhập ${good.length} câu (câu ${from}–${items.length})`); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'imp-file') handleFile(e.target.files[0]); });
document.addEventListener('dragover', (e) => { const d = e.target.closest('#imp-drop'); if (d) { e.preventDefault(); d.classList.add('is-over'); } });
document.addEventListener('dragleave', (e) => { const d = e.target.closest('#imp-drop'); if (d) d.classList.remove('is-over'); });
document.addEventListener('drop', (e) => { const d = e.target.closest('#imp-drop'); if (d) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); } });
document.getElementById('import').onclick = openImport;

/* ---------- Lưu / Huỷ cả tab ---------- */
sw.onchange = () => { saveErr = ''; dirty = true; render(); };
document.getElementById('save').onclick = () => {
  if (sw.checked && !items.length) { saveErr = 'empty'; render(); return; }
  const bad = items.map((q, k) => (check(q, k).length ? k + 1 : 0)).filter(Boolean);
  if (bad.length) { render(); toast(`Còn ${bad.length} câu lỗi (câu ${bad.join(', ')}) — chưa lưu`); return; }
  dirty = false; render(); toast('Đã lưu đề luyện tập');
};
document.getElementById('cancel').onclick = () => {
  if (!dirty) { toast('Không có thay đổi'); return; }
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'cancel-modal', size: 'sm', icon: 'alert', iconTone: 'warning', title: 'Bỏ thay đổi chưa lưu?', body: '<p class="t-sm">Các câu vừa thêm, sửa, xoá sẽ không được lưu.</p>',
    foot: '<button class="btn btn--secondary" data-close>Tiếp tục soạn</button><button class="btn btn--danger" id="cancel-ok">Bỏ thay đổi</button>' }));
  document.getElementById('cancel-ok').onclick = () => { document.getElementById('cancel-modal').remove(); demo.set('open', 'none'); toast('Đã bỏ thay đổi'); };
};

const demo = LH.DemoBar('#1 Practice — tab Practice (Admin L&D)', [
  { label: 'Trạng thái', key: 'st', options: [['legacy', 'Bài cũ (tắt sẵn)'], ['empty', 'Bật, chưa có câu'], ['dup', 'Có câu trùng đề thi'], ['ok', 'Hợp lệ']] },
  { label: 'Mở sẵn', key: 'open', options: [['none', 'Không'], ['add', 'Thêm câu hỏi'], ['edit', 'Sửa câu 1'], ['import', 'Nhập từ file']] },
], (s) => {
  saveErr = ''; dirty = false; closeEditor(); document.getElementById('imp-modal')?.remove();
  sw.checked = s.st !== 'legacy';
  items = s.st === 'legacy' || s.st === 'empty' ? [] : D.practiceQuestions.map((q) => ({ explain: '', ...JSON.parse(JSON.stringify(q)) }));
  if (s.st === 'dup') items.splice(1, 0, { ...JSON.parse(JSON.stringify(D.examQuestions[2])), text: '  khi nào nên chọn WORKFLOW cố định thay vì agent tự chủ? ' });
  if (s.st === 'empty') saveErr = 'empty';
  document.getElementById('legacy').innerHTML = s.st === 'legacy' ? Alert({ tone: 'warning', icon: 'alert', title: 'Bài test có từ trước bản LearningHub 2', text: 'Practice đã tắt. Soạn bộ câu riêng để bật lại.' }) : '';
  render();
  if (s.open === 'add') openEditor(-1);
  if (s.open === 'edit' && items.length) openEditor(0);
  if (s.open === 'import') openImport();
});
</script>
