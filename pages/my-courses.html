<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My courses · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x"><link rel="stylesheet" href="../assets/css/lh2-wave2.css?v=1125b">
<link rel="stylesheet" href="../assets/css/ds.css?v=1125b">
</head>
<body class="page">
<!-- Learner Experience 2.2 + 3.2 · BR-MC-01, 03, 04 (Notion LH2 Product Docs No 9, Đợt 2 · Gói 5).
     Một danh sách (không tab) + Status có số đếm · Time · Search my courses · Sort by. -->
<div id="header"></div>
<main class="container page__in stack gap-24">
  <div class="row gap-16" style="align-items:flex-end"><div class="grow" id="back"></div><span id="slot" class="t-sm" style="margin-bottom:32px"></span></div>
  <div class="toolbar" id="bar"></div>
  <div class="course-grid" id="grid"></div>
</main>
<div id="footer"></div>
<script src="../assets/js/components.js?v=1125d"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/lh2-wave2.js?v=1124a"></script>
<script>
const { ICON, AppHeader, AppFooter, BackLink, FilterDropdown, Button, esc } = LH; const D = LHData;
document.getElementById('header').innerHTML = AppHeader();
document.getElementById('back').innerHTML = BackLink('My courses', { href: 'home.html' });
document.getElementById('footer').innerHTML = AppFooter();
const TIME = [['all', 'All time'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days']];
const SORT = [['last', 'Recently Accessed'], ['pg', 'Progress: High to Low'], ['az', 'Name A–Z']];
const f = { st: 'all', pd: 'all', q: '', sort: 'last' };
let courses = [];
const base = () => D.catalog.filter((c) => ['learning', 'done', 'fail'].includes(c.st)).map((c) => ({ ...c, sub: c.tags && c.tags[0],
  ...(c.title.startsWith('QA AUTOMATION _ MODULE 2') ? { mand: true, sched: '01/11 – 15/11/2026', overdue: true } : {}),
  ...(c.title.startsWith('CCAR-F') ? { sched: '10/11 – 10/12/2026' } : {}) }));
const extra = [
  { title: 'HARNESS IS AL YOU NEED', cat: 'Data & AI', sub: 'AI', cover: '../assets/img/covers/harness.png', lessons: 4, hours: '5h 0m', st: 'closed', my: 50, progress: 40, video: [2, 5], test: [0, 1], lastDays: 20, pub: 60 },
  { title: 'PROMPTS ENGINEERING', cat: 'Data & AI', sub: 'Prompting', lessons: 3, hours: '3h 0m', st: 'removed', my: 70, progress: 66, video: [2, 3], test: [0, 0], lastDays: 40, pub: 120 },
];
const filtered = (st) => courses.filter((c) => LHW2.rank(c, f.q) > 0)
  .filter((c) => st === 'all' || c.st === st)          // BR-MC-01: Closed, Access Removed chỉ ở All
  .filter((c) => f.pd === 'all' || (c.my != null && c.my <= +f.pd));
function render() {
  const elective = courses.filter((c) => c.st === 'learning' && !c.mand).length;
  document.getElementById('slot').innerHTML = `In progress: <b>${elective}/3</b> elective courses`;
  const counts = ['all', 'learning', 'done', 'fail'].map((k) => filtered(k).length);
  const STATUS = [['all', `All (${counts[0]})`], ['learning', `In Progress (${counts[1]})`], ['done', `Completed (${counts[2]})`], ['fail', `Failed (${counts[3]})`]];
  if (!document.getElementById('mq')) document.getElementById('bar').innerHTML = `<div id="fd" class="row gap-8"></div>
    <label class="input-wrap" style="width:300px">${ICON.search}<input class="input" id="mq" placeholder="Search my courses"></label><span class="grow"></span><div id="fs"></div>`;
  document.getElementById('fd').innerHTML = FilterDropdown({ key: 'st', label: 'Status:', value: f.st, options: STATUS })
    + FilterDropdown({ key: 'pd', label: 'Time:', value: f.pd, options: TIME });

  document.getElementById('fs').innerHTML = FilterDropdown({ key: 'sort', label: 'Sort by:', value: f.sort, def: f.sort, options: SORT, align: 'right' });
  const list = filtered(f.st);
  list.sort(f.sort === 'pg' ? (a, b) => (b.progress || 0) - (a.progress || 0) : f.sort === 'az' ? (a, b) => a.title.localeCompare(b.title) : (a, b) => (a.lastDays ?? 1e9) - (b.lastDays ?? 1e9));
  const grid = document.getElementById('grid');
  if (!courses.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${ICON.book}<b>You haven't enrolled in any courses yet.</b><a class="wbtn" href="course-search.html">Browse Courses</a></div>`; return; }
  if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${ICON.book}<b>No courses match your filters.</b>${Button({ label: 'Clear Filters', variant: 'outline', attrs: 'data-clear' })}</div>`; return; }
  grid.innerHTML = list.map((c) => LHW2.card(c, { q: f.q, mine: true })).join('');
}
document.addEventListener('fdd:change', (e) => { f[e.detail.key] = e.detail.value; render(); });
document.addEventListener('input', (e) => { if (e.target.id === 'mq') { f.q = e.target.value; render(); } });
document.addEventListener('click', (e) => { if (e.target.closest('[data-clear]')) { Object.assign(f, { st: 'all', pd: 'all' }); render(); } });
LH.DemoBar('LH2 · My courses (Đợt 2 · Gói 5)', [
  { label: 'Data', key: 'k', options: [['full', 'In Progress + Completed + Failed + Closed + Access Removed'], ['empty', 'Not enrolled yet']] },
  { label: 'Quick filter', key: 'pre', options: [['none', 'None'], ['done', 'Completed'], ['d30', 'Last 30 days']] },
], (s) => {
  courses = s.k === 'empty' ? [] : [...base(), ...extra];
  Object.assign(f, { st: s.pre === 'done' ? 'done' : 'all', pd: s.pre === 'd30' ? '30' : 'all' });
  render();
});
</script>
</body>
</html>
