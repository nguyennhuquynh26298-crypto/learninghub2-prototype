<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1120x"><link rel="stylesheet" href="../assets/css/base.css?v=1120x"><link rel="stylesheet" href="../assets/css/components.css?v=1120x">
<link rel="stylesheet" href="../assets/css/ds.css?v=1121a">
</head>
<body class="page">
<!-- Chép bố cục learninghub.techvify.com/ : header 64 → category 60 → container py-13 → My Courses → All Courses → footer -->
<div id="header"></div>
<div id="cats"></div>
<main class="container page__in">
  <section>
    <div id="h-my"></div>
    <div class="my-row" id="learning"></div>
  </section>
  <section>
    <div id="h-all"></div>
    <div class="course-grid" id="featured"></div>
  </section>
</main>
<div id="footer"></div>
<script src="../assets/js/components.js?v=1123a"></script>
<script src="../assets/js/data.js?v=1120y"></script>
<script src="../assets/js/enroll-limit.js?v=1118r"></script>
<script src="../assets/js/search.js?v=1120y"></script>
<script>
const { AppHeader, CategoryNav, AppFooter, SectionHead, CourseCard, EnrollSlotPanel, EmptySlotCard } = LH; const D = LHData;
document.getElementById('header').innerHTML = AppHeader();
document.getElementById('cats').innerHTML = CategoryNav();
document.getElementById('footer').innerHTML = AppFooter();
const card = (c, st, mandatory) => CourseCard({ title: c.title, desc: c.desc, cover: c.cover, lessons: c.lessons, hours: c.hours, progress: c.progress || 0, video: c.video, test: c.test, sched: c.sched, state: st, mandatory });
let full, mand; // mand: học viên có khoá bắt buộc (Course Audience · Mandatory Course) — không tính vào 3 khoá tự chọn (BR-ENR-10)
function render() {
  // My Courses: tối đa 2 thẻ + khung Suất học (khoá còn lại xem ở View More)
  // BR-ENR-01: chỉ khoá Đang học tính suất (tối đa 3); Hoàn thành, Không đạt không tính
  /* D-119 / D-139: used = số khoá tự chọn Đang học (tối đa 3). Khoá Mandatory không cộng vào used / không tạo “+1 slot”. */
  const used = full ? 3 : (LH.App.mode ? Math.min(3, D.catalog.filter((c) => c.st === 'learning').length) : 2);
  const learning = D.catalog.filter((c) => c.st === 'learning').slice(0, Math.min(2, used));
  const cards = learning.map((c) => card(c, 'in-progress')).slice(0, 2);
  /* Chip elective x/3; mandatory ghi chú riêng, không đổi mẫu số 3 */
  document.getElementById('h-my').innerHTML = SectionHead('My Courses', 'myCourses', 'my-courses.html', EnrollSlotPanel({ used, limit: 3, mandatory: mand ? 1 : 0 }));
  /* Còn suất (< 3): tối đa 2 thẻ khoá + khung Enroll another → Search → Start Course. Đủ 3/3: chỉ thẻ, không khung add. */
  const left = Math.max(0, 3 - used);
  document.getElementById('learning').innerHTML = cards.join('') + (left > 0 ? EmptySlotCard(left) : '');
  // All Courses
  const st = full ? 'limit-reached' : 'default';
  const all = D.catalog.filter((c) => c.st === 'none').slice(0, 6);
  document.getElementById('h-all').innerHTML = SectionHead('All Courses', 'allCourses', 'course-search.html');
  /* Khoá bắt buộc: nhãn Mandatory, Start luôn được kể cả 3/3 — không chiếm suất */
  document.getElementById('featured').innerHTML = all.map((c, k) => card(c, c.restricted ? 'restricted' : (mand && k === 0 ? 'default' : st), mand && k === 0 && !c.restricted)).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-start]'); if (b) { e.preventDefault(); const t = b.closest('.course-card').querySelector('.course-card__title').textContent;
    const isMand = !!b.closest('.course-card').querySelector('.cc-mand');
    if (full && !isMand) {
      const pad = D.myCourses.length >= 3 ? D.myCourses : [...D.myCourses, { title: 'Git for Beginners', progress: 22, last: '5 days ago' }].slice(0, 3);
      LHEnroll.open({ target: t, courses: pad });
    } else location.href = LH.App.mode ? LH.App.courseHref(t) : 'course-detail.html'; return; }
});
LH.DemoBar('LH2 Đợt 1 · Home (Enrollment 3.2)', [{ label: 'Suất', key: 'f', options: [['0', 'Đang học 2/3 khoá tự chọn'], ['1', 'Đạt giới hạn 3/3']] }, { label: 'Khoá bắt buộc', key: 'm', options: [['0', 'Không có'], ['1', 'Có 1 khoá Mandatory']] }], (s) => { full = LH.App.mode ? D.catalog.filter((c) => c.st === 'learning').length >= 3 : s.f === '1'; mand = s.m === '1'; render(); });
</script>
</body>
</html>
