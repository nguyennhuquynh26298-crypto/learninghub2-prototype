<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Role Management · LearningHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1117a"><link rel="stylesheet" href="../assets/css/base.css?v=1117a"><link rel="stylesheet" href="../assets/css/components.css?v=1117a">
<link rel="stylesheet" href="../assets/css/admin.css?v=1117a">
</head>
<body>
<div id="header"></div>
<main></main>
<script src="../assets/js/components.js?v=1117a"></script>
<script src="../assets/js/data.js?v=1117a"></script>
<script src="../assets/js/admin-frame.js?v=1117a"></script>
<script>
const { esc, Tag } = LH;
LHFrame.list({
  active: 'roles',
  demoTitle: 'Role Management · LH1',
  demoRole: [['admin', 'Admin']],
  eyebrow: 'Settings · Role Management',
  title: 'Role Management',
  desc: 'Create and manage roles assigned to employees.',
  cta: 'Create role',
  search: 'Search roles',
  cols: ['Role name', 'Code', 'Description', 'Permission', ['Actions', 't-act']],
  rows: [
    { name: 'PM', code: 'T001-26', desc: 'Project Management', perm: 'User' },
    { name: 'BA', code: 'T003-12', desc: 'Business Analyst', perm: 'User' },
    { name: 'CEO/Admin', code: 'T002-01', desc: 'Administrator', perm: 'Admin' },
    { name: 'Editor', code: 'T004-08', desc: 'Course editor (L&D)', perm: 'User' },
  ],
  blank: { code: '—' },
  cell: (r) => `<td class="t-name"><b>${esc(r.name)}</b></td><td>${esc(r.code)}</td><td>${esc(r.desc)}</td><td>${Tag(r.perm, r.perm === 'Admin' ? 'info' : 'neutral')}</td>`,
  menu: (r, i) => [{ label: 'View', icon: 'eye', attrs: `data-frm-detail="${i}"` }, { label: 'Edit', icon: 'edit', attrs: `data-frm-edit="${i}"` }, { label: 'Delete', icon: 'trash', danger: true, attrs: `data-frm-del="${i}"` }],
  empty: { icon: 'shield', title: 'No roles', desc: 'Create the first role with the button above.', cta: '<button class="btn-cta" data-frm-new>Create role</button>' },
  delTitle: 'Delete this role?', delText: (r) => `Employees with role <b>${esc(r.name)}</b> will lose it.`,
  form: {
    newTitle: 'Create role', editTitle: 'Edit role', detailTitle: 'Role details',
    fields: [
      { key: 'name', label: 'Role name', req: true, unique: true, ph: 'Enter role name', max: 60 },
      { key: 'perm', label: 'Permission', type: 'select', options: ['Admin', 'User'], req: true, ph: 'Select permission' },
      { key: 'desc', label: 'Description', type: 'textarea', ph: 'Description…', full: true },
    ],
  },
});
</script>
</body>
</html>
