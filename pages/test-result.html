<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết quả bài thi · Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=1113c"><link rel="stylesheet" href="../assets/css/base.css?v=1113c"><link rel="stylesheet" href="../assets/css/components.css?v=1113c">
</head>
<body>
<!-- Khung /quiz của web (nền #F7F7F7 → thẻ trắng → cột 768) + thanh trên dính.
     Chốt 11/11 (Larry): tối đa 3 lượt; lượt 2, 3 chỉ làm lại câu sai (câu đúng giữ); điểm chính thức = điểm cao nhất;
     Đạt → khoá; đáp án đúng + giải thích mở khi Đạt hoặc dùng hết 3 lượt. Chế độ ẩn chỉ hiện lựa chọn của tôi + Đúng/Sai từng câu (BR-ASM-12). Review = danh sách cuộn + lọc. -->
<div class="quiz-page"><div id="bar"></div><div class="stage-card"><div class="quiz">
  <div id="summary"></div>
  <div id="answer-note" style="margin-bottom:24px"></div>
  <section>
    <div class="row" style="margin-bottom:12px"><b class="grow">Lịch sử lượt làm</b><span class="t-xs muted">Bấm một lượt để xem lại</span></div>
    <table class="table att-table" id="attempts"></table>
  </section>
  <section id="review">
    <div class="rv-head"><h2 id="review-title"></h2><div id="filters"></div></div>
    <div class="wq-list" id="qs"></div>
  </section>
</div></div></div>
<script src="../assets/js/components.js?v=1113c"></script>
<script src="../assets/js/data.js?v=1113c"></script>
<script>
const { WebQuestion, ResultSummary, ReviewFilter, QuizTopBar, Alert, Badge, esc } = LH; const D = LHData; const T = D.test; const N = D.examFull.length;
const MAX = 3, KEY = 'lhExamAttempts';
/* Kịch bản demo (điểm từng lượt). live = lượt thật vừa nộp ở exam.html */
const SCEN = {
  live: { label: 'Bài vừa nộp' },
  one: { attempts: [56], label: 'Lượt 1 chưa đạt' },
  perfect: { attempts: [56, 78], label: 'Lượt 2 Đạt 78 — khoá, mở đáp án' },
  last: { attempts: [56, 62, 66], label: 'Hết 3 lượt chưa đạt — điểm cao nhất 66' },
};
let sel = null, filter = 'all', A; // A = [{score, chosen, minutes}]
const isOk = (q) => q.chosen.length && q.chosen.length === q.correct.length && q.chosen.every((c) => q.correct.includes(c));
/* Bài làm demo của 1 lượt: lấy bộ mẫu rồi chỉnh cho khớp điểm */
function sheet(score) {
  const need = Math.round(score / 100 * N);
  const qs = D.examFull.map((q) => ({ ...q, chosen: [...q.chosen] }));
  let right = qs.filter(isOk).length;
  for (const q of qs) { if (right >= need) break; if (!isOk(q)) { q.chosen = [...q.correct]; right++; } }
  for (const q of [...qs].reverse()) { if (right <= need) break; if (isOk(q)) { q.chosen = [(q.correct[0] + 1) % q.options.length]; right--; } }
  return qs.map((q) => q.chosen);
}
/* Lượt sau chỉ sửa câu sai của lượt trước → bài làm cộng dồn */
function sheetFrom(prev, score) {
  const need = Math.round(score / 100 * N); const qs = D.examFull.map((q, k) => ({ ...q, chosen: [...prev[k]] }));
  let right = qs.filter(isOk).length;
  for (const q of qs) { if (right >= need) break; if (!isOk(q)) { q.chosen = [...q.correct]; right++; } }
  return qs.map((q) => q.chosen);
}
function load(key) {
  if (key === 'live') return JSON.parse(localStorage.getItem(KEY) || '[]');
  let prev = null;
  return SCEN[key].attempts.map((score, k) => { const ch = prev ? sheetFrom(prev, score) : sheet(score);
    const redo = prev ? D.examFull.filter((q, i) => !isOk({ ...q, chosen: prev[i] })).length : 0; prev = ch;
    return { score, chosen: ch, minutes: 31 - k * 8, redo }; });
}
function render() {
  if (!A.length) { document.querySelector('.quiz').innerHTML = `<div class="empty"><p>Chưa có lượt nào được nộp.</p><a class="wbtn" href="exam.html?sc=new">Vào làm bài</a></div>`; return; }
  const used = A.length, latest = used - 1, idx = sel ?? latest, at = A[idx];
  /* Chốt 11/11: khoá + mở đáp án khi Đạt hoặc hết 3 lượt; điểm chính thức = điểm cao nhất. */
  const best = Math.max(...A.map((x) => x.score)), perfect = best >= T.passMark, reveal = used >= MAX || perfect, canRetry = !reveal;
  const qs = D.examFull.map((q, k) => ({ ...q, chosen: at.chosen[k] || [] }));
  const right = qs.filter(isOk).length, blank = qs.filter((q) => !q.chosen.length).length;
  document.getElementById('bar').innerHTML = QuizTopBar({ mode: 'review', title: T.name, right: '<a class="wbtn wbtn--outline" href="test-start.html">Đóng</a>' });
  document.getElementById('summary').innerHTML = ResultSummary({ score: at.score, passMark: T.passMark, right, wrong: N - right - blank, blank, total: N, minutes: at.minutes,
    attemptNo: idx + 1, maxAttempts: MAX, used, result: at.score >= T.passMark ? 'pass' : 'fail', canRetry: canRetry && idx === latest, isLatest: idx === latest, best });
  document.getElementById('answer-note').innerHTML = perfect
    ? Alert({ tone: 'success', icon: 'check', title: 'Bạn đã đạt — đáp án và giải thích đã mở', text: 'Bài thi đã khoá, không làm lại.' })
    : reveal ? Alert({ tone: 'neutral', icon: 'eye', title: 'Đáp án và giải thích đã mở', text: `Hết ${MAX} lượt · Điểm chính thức: ${best}` })
    : Alert({ tone: 'info', icon: 'eyeOff', title: 'Đáp án đúng đang ẩn', text: `Hiện khi Đạt hoặc hết ${MAX} lượt · còn ${MAX - used} lượt` });
  document.getElementById('attempts').innerHTML = `<thead><tr><th>Lượt</th><th>Ngày nộp</th><th>Điểm</th><th>Kết quả</th><th></th></tr></thead><tbody>` + A.map((x, k) =>
    `<tr data-k="${k}" class="${k === idx ? 'is-sel' : ''}"><td>Lượt ${k + 1}</td><td>${x.at ? new Date(x.at).toLocaleString('vi-VN') : `0${6 + k}/11/2026 ${9 + k}:${String(10 + k * 7).padStart(2, '0')}`}</td><td><b>${x.score}</b>/100</td><td>${x.score >= T.passMark ? Badge('Đạt', 'success') : Badge('Chưa đạt', 'danger')}</td><td>${k === latest ? Badge(reveal ? 'Điểm chính thức' : 'Điểm cao nhất', 'info') : ''}${x.redo ? `<span class="t-xs muted" style="margin-left:6px">làm lại ${x.redo} câu</span>` : ''}</td></tr>`).join('') + '</tbody>';
  const marked = qs.map((q, k) => ({ q, k, ok: isOk(q) }));
  const cnt = { all: N, correct: right, incorrect: N - right };
  document.getElementById('review-title').textContent = `Xem lại bài làm — lượt ${idx + 1}`;
  document.getElementById('filters').innerHTML = ReviewFilter(filter, cnt);
  document.getElementById('qs').innerHTML = marked.filter((m) => filter === 'all' || (filter === 'correct') === m.ok)
    .map(({ q, k }) => WebQuestion({ n: k + 1, ...q, state: reveal ? 'review-revealed' : 'review-hidden' })).join('');
}
document.getElementById('attempts').addEventListener('click', (e) => { const r = e.target.closest('tr[data-k]'); if (r) { sel = +r.dataset.k; render(); } });
document.getElementById('filters').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } });
document.addEventListener('click', (e) => { if (e.target.closest('[data-retry]')) location.href = 'exam.html?sc=new'; });
LH.DemoBar('#2 Kết quả & xem lại', [
  { label: 'Kịch bản', key: 'sc', value: localStorage.getItem(KEY) ? 'live' : 'one', options: Object.entries(SCEN).map(([k, v]) => [k, v.label]) },
], (s) => { A = load(s.sc); sel = null; filter = 'all'; render(); });
</script>
</body>
</html>
