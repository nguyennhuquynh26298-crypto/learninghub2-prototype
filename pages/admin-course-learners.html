<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  .vl-ex { cursor: pointer; }
  .adm-box__head .adm-inline-search input { width: 230px; }
  .vl-acts { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .vl-ex.is-on { border-color: var(--adm-primary); color: var(--adm-primary); background: var(--adm-primary-50); }
  /* Nguồn: web thật /dashboard/settings/course-management/[instanceId]/learners
   * (LearnerProgressPage · StatCards · column.tsx · LearnerQuizSubTable) — dựng lại theo style Admin LH2 */
  .kpi-grid button.kpi-card { cursor: pointer; }
  .kpi-grid button.kpi-card:hover { box-shadow: 0 0 0 1px var(--adm-primary) inset, var(--adm-lift); }
  .kpi-card--trend.is-active { box-shadow: 0 0 0 2px var(--adm-primary) inset; }
  .kpi-card__sub { order: 3; font-size: var(--fs-xs); color: var(--adm-sub); }
  .kpi-card--trend.kpi-card--info { --kpi-line: #2e90fa; } .kpi-card--info .kpi-card__ic { background: var(--c-bg-hover); color: var(--c-brand); }
  .kpi-card--trend.kpi-card--success { --kpi-line: #46b003; } .kpi-card--trend.kpi-card--warning { --kpi-line: #dc6803; }
  .kpi-card--success .kpi-card__value { color: var(--c-success-icon); } .kpi-card--info .kpi-card__value { color: var(--c-brand); }
  @media (max-width: 1023px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 599px) { .kpi-grid { grid-template-columns: minmax(0, 1fr); } }
  .person { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .person b { display: block; font-weight: 600; }
  .person small { display: block; font-size: var(--fs-xs); color: var(--adm-sub); }
  .pg { min-width: 140px; } .pg b { font-size: var(--fs-sm); color: var(--c-brand); } .pg.is-done b { color: var(--c-success-icon); }
  .pg .progress { margin-top: 6px; background: var(--c-bg-hover); } .pg .progress > i { background: var(--c-brand); } .pg.is-done .progress > i { background: var(--c-success-icon); }
  .row-x { width: 32px; height: 32px; border: 1px solid var(--adm-stroke); border-radius: 8px; background: var(--c-white); color: var(--adm-sub); display: inline-grid; place-items: center; cursor: pointer; }
  .row-x svg { width: 18px; height: 18px; transition: transform .15s; }
  .row-x:hover { border-color: var(--adm-primary); color: var(--adm-primary); }
  tr.is-open .row-x { background: var(--adm-primary-50); border-color: var(--adm-primary); color: var(--adm-primary); } tr.is-open .row-x svg { transform: rotate(180deg); }
  tr[data-row] { cursor: pointer; }
  .adm-table tr.sub > td { height: auto; padding: 0 0 16px; border-top: 0; background: var(--c-bg-subtle); }
  .adm-table tr.sub:hover > td { background: var(--c-bg-subtle); }
  .qsub { margin: 0 16px; padding: 16px; background: var(--c-white); border: 1px solid var(--adm-stroke); border-radius: 12px; }
  .qsub h3 { margin: 0 0 8px; font-size: var(--fs-sm); font-weight: 600; color: var(--adm-body); }
  .qsub table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
  .qsub th { text-align: left; font-weight: 500; font-size: var(--fs-sm); color: var(--adm-sub); padding: 8px 12px; border-bottom: 1px solid var(--adm-stroke); }
  .qsub td { padding: 10px 12px; border-top: 1px solid var(--c-bg-hover); color: var(--adm-body); }
  .qsub td .stage-tag { margin-left: 8px; height: 20px; font-size: var(--fs-xs); }
  .qsub__empty { padding: 16px; text-align: center; color: var(--adm-sub); font-size: var(--fs-sm); }
  .pager { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding-top: 16px; font-size: var(--fs-sm); color: var(--adm-sub); }
  .pager__btns { display: flex; gap: 4px; }
  .pager__btns button { min-width: 34px; height: 34px; border: 1px solid var(--adm-stroke); border-radius: 8px; background: var(--c-white); color: var(--adm-body); font: 500 var(--fs-sm) Inter, sans-serif; cursor: pointer; display: inline-grid; place-items: center; }
  .pager__btns button.is-on { background: var(--adm-primary); border-color: var(--adm-primary); color: var(--c-white); }
  .pager__btns button:disabled { opacity: .4; cursor: default; }
  .pager__btns svg { width: 16px; height: 16px; }
</style>

<body>
<div id="header"></div>
<main>
  <div id="head"></div>
  <div class="kpi-grid" id="kpis"></div>
  <section class="adm-box">
    <div class="adm-box__head adm-box__head--tools"><h2 class="adm-box__title" style="flex:1">Learner progress</h2>
      <label class="adm-inline-search"><input id="q" placeholder="Search name or department…"><span></span></label>
      <label class="filter-btn" id="st-wrap"></label>
      <button type="button" class="filter-btn vl-ex" id="ex-wrap" data-ex hidden></button>
      <button type="button" class="btn-cta btn-cta--line" data-export id="export"></button></div>
    <div class="adm-card" id="tbl"></div>
  </section>
</main>
<script src="../assets/js/components.js?v=1125ai"></script>
<script src="../assets/js/data.js?v=1123c"></script>
<script src="../assets/js/export-modal.js?v=1125a"></script>
<script>
/* View Learners — LH1 /learners + LH2 Đợt 1 (docs Notion 18/11/2026)
 * Course Audience 3.4: Learning Status = Not Enrolled · In Progress · Completed · Failed · Access Removed · Closed · Unenrolled (bỏ Not Started).
 * Thao tác dòng (chỉ Admin L&D): Unenroll (In Progress, Reason 10–500) · Reopen Attempts (Failed còn quyền, Exam 3.5) · Remove (mọi dòng còn quyền).
 * Course Audience v1.1 (D-156, BR-AUD-16): danh sách học viên + Excluded / Re-add chuyển từ tab Audience sang đây. Cột Source. Khoá Restricted có dòng Not Enrolled.
 * Learning Data Export 2.1: nút Export Data mở popup xuất của khoá. Exam BR-EX-05: điểm chính thức = cao nhất. */
const { ICON, Avatar, esc, toast, AdminLayout, AdminHead, AdminTable, AdminEmpty, Tag, Progress, Modal, RowMenu, AdminConfirm } = LH;
const $ = (id) => document.getElementById(id);
const P = new URLSearchParams(location.search);
const COURSE = P.get('t') || 'AI Agent Engineering';
const QUIZZES = ['Test Domain 1 · Agent architecture', 'Test Domain 2 · Tool design & MCP', 'Final Exam'];
const ST = { progress: ['In Progress', 'info'], done: ['Completed', 'published'], failed: ['Failed', 'pending'], removed: ['Access Removed', 'draft'], unenrolled: ['Unenrolled', 'neutral'], closed: ['Closed', 'neutral'], none: ['Not Enrolled', 'neutral'] };
const PAGE = 8;
const SEED = [
  ['Nguyễn Văn An', 'Development', 100, '02/10/2026'], ['Trần Thị Bích', 'QA', 100, '02/10/2026'], ['Lê Minh Châu', 'Development', 72, '03/10/2026', 'failed'],
  ['Phạm Quốc Dũng', 'DevOps', 45, '05/10/2026'], ['Hoàng Thu Hà', 'L&D', 100, '05/10/2026'], ['Vũ Đức Huy', 'Development', 0, '08/10/2026'],
  ['Đặng Ngọc Lan', 'QA', 18, '08/10/2026', 'removed'], ['Bùi Thanh Long', 'BA', 100, '10/10/2026'], ['Đỗ Thị Mai', 'HR', 12, '12/10/2026', 'unenrolled'],
  ['Ngô Gia Nam', 'Development', 60, '14/10/2026'], ['Dương Phương Oanh', 'BA', 88, '15/10/2026', 'failed'], ['Lý Hoàng Phúc', 'DevOps', 0, '20/10/2026'],
  ['Mai Anh Quân', 'Development', 100, '21/10/2026'], ['Trịnh Thảo Vy', 'QA', 33, '25/10/2026'],
  ['Phan Minh Tú', 'QA', 0, '—', 'none'], ['Cao Thị Yến', 'Design', 0, '—', 'none'],
];
/* Source (Course Audience 3.4, D-191): khoá Restricted chọn job title UI/UX Designer, phòng QA, Development, BA + vài cá nhân.
   Job title không có cột riêng nên Source ghi kèm tên job title; tên phòng đã ở cột Department */
const SRC_JOBS = { Design: 'UI/UX Designer' };
const SRC_DEPTS = ['QA', 'Development', 'BA'];
const slug = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().split(' ');
function quizOf(status, pct, i) {
  return QUIZZES.map((title, k) => {
    const total = k === 2 ? 32 : 10, need = Math.ceil(0.8 * total);
    if (status === 'done') return { title, tot: total, used: 1 + ((i + k) % 3), best: 80 + ((i * 7 + k * 5) % 20), result: 'Passed' };
    if (status === 'failed' && k === 1) return { title, tot: total, used: 3, best: 70, result: 'Failed' };
    const tried = k < (pct >= 60 ? 2 : pct > 0 ? 1 : 0);
    if (!tried) return { title, used: 0, best: null, result: 'Not Attempted' };
    const used = 1 + ((i + k) % 2), best = 50 + ((i * 11 + k * 13) % 45), pass = Math.round(best / 100 * total) >= need;
    return { title, tot: total, used, best, result: pass ? 'Passed' : `Not Passed (${3 - used} attempts left)` };
  });
}
const learners = SEED.map(([name, dept, pct, enrolled, force], i) => {
  const s = slug(name);
  const status = force || (pct === 100 ? 'done' : 'progress');
  const source = SRC_JOBS[dept] ? `Job Title: ${SRC_JOBS[dept]}` : SRC_DEPTS.includes(dept) ? 'Department' : 'Individual';
  return { name, email: `${s.slice(-1)[0]}.${s.slice(0, -1).join('')}@techvify.com.vn`, dept, pct, enrolled, status, source, quiz: quizOf(status, pct, i), reopened: false };
});

let rows = learners, q = '', st = 'all', page = 1, open = new Set();
$('q').parentNode.querySelector('span').innerHTML = ICON.search;
$('q').placeholder = 'Search by name or department…';
$('export').innerHTML = ICON.download + 'Export Data';
document.querySelector('.adm-box__title').textContent = 'Learner Progress';

function kpis() {
  const n = (k) => rows.filter((r) => r.status === k).length, tot = rows.filter((r) => r.status !== 'removed').length;
  /* 25/11 rà UI: thẻ chỉ số chỉ còn nhãn + số (Course Audience 3.4); câu giải thích chuyển vào chú thích rê chuột */
  const card = (key, label, value, sub, icon, tone) => `<button type="button" class="kpi-card kpi-card--trend ${tone ? 'kpi-card--' + tone : ''} ${st === key ? 'is-active' : ''}" data-kpi="${key}" aria-pressed="${st === key}" title="${sub}">
    <span class="kpi-card__text"><span class="kpi-card__label">${label}</span><span class="kpi-card__value">${value}</span></span><span class="kpi-card__ic">${ICON[icon]}</span></button>`;
  $('kpis').innerHTML = card('all', 'Total Learners', tot, 'Learners with access to this course', 'usersRound', '')
    + card('done', 'Completed', n('done'), `${tot ? Math.round(n('done') / tot * 100) : 0}% completion rate`, 'award', 'success')
    + card('progress', 'In Progress', n('progress'), 'Enrolled, not finished yet', 'play', 'info')
    + card('failed', 'Failed', n('failed'), 'Used all 3 exam attempts without passing', 'x', 'warning');
}
function quizSub(r) {
  return `<div class="qsub"><h3>Quiz results</h3><div class="adm-scroll"><table><thead><tr><th>Quiz</th><th>Attempts Used / 3</th><th>Final Score</th><th>Result</th></tr></thead><tbody>${r.quiz.map((z) => `<tr>
    <td>${esc(z.title)}</td><td>${z.used}/3${r.reopened && z.result === 'Not Attempted' ? ' · reopened' : ''}</td><td>${z.best == null ? '—' : `${Math.round(z.best / 100 * z.tot)}/${z.tot}`}</td>
    <td>${Tag(z.result, z.result === 'Passed' ? 'published' : z.result === 'Failed' ? 'pending' : z.result === 'Not Attempted' ? 'neutral' : 'info')}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function actions(r, i) {
  /* Excluded: chỉ còn Re-add (BR-AUD-06). Dòng còn quyền: Reopen Attempts (Failed) hiện ngoài; Unenroll + Remove trong menu dòng */
  if (r.status === 'removed') return `<button type="button" class="btn-cta btn-cta--outline btn-cta--sm" data-readd="${i}">Re-add</button>`;
  const items = [];
  if (r.status === 'failed') items.push({ label: 'Reopen Attempts', icon: 'repeat', attrs: `data-reopen="${i}"` });
  if (r.status === 'progress') items.push({ label: 'Unenroll', icon: 'logout', attrs: `data-unenroll="${i}"` });
  items.push({ label: 'Remove', icon: 'trash', danger: true, attrs: `data-remove="${i}"` });
  return RowMenu(items);
}
function table() {
  const nq = LH.norm(q.trim());
  const list = rows.filter((r) => (st === 'all' ? r.status !== 'removed' : r.status === st) && (!nq || LH.norm(r.name + ' ' + r.dept + ' ' + r.email).includes(nq)));
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); page = Math.min(page, pages);
  const cur = list.slice((page - 1) * PAGE, page * PAGE);
  const cols = ['Learner', 'Department', ['Source', 'col-opt'], 'Progress', ['Enroll Date', 'col-opt'], 'Learning Status', ['', 't-act']];
  const empty = !rows.length
    ? AdminEmpty({ icon: 'usersRound', title: 'No learners yet', desc: 'Nobody has enrolled in this course yet.', compact: true })
    : AdminEmpty({ icon: 'search', title: 'No learners found', desc: 'Try another keyword or clear the status filter.', compact: true });
  $('tbl').innerHTML = AdminTable(cols, cur.length ? cur.map((r) => {
    const i = rows.indexOf(r), on = open.has(i);
    return `<tr data-row="${i}" class="${on ? 'is-open' : ''}"><td><div class="person">${Avatar(r.name, 'sm')}<div><b>${esc(r.name)}</b><small>${esc(r.email)}</small></div></div></td>
      <td>${esc(r.dept)}</td>
      <td class="col-opt">${esc(r.source)}</td>
      <td><div class="pg ${r.pct === 100 ? 'is-done' : ''}"><b>${r.pct}%</b>${Progress(r.pct)}</div></td>
      <td class="col-opt">${r.enrolled}</td><td>${Tag(...ST[r.status])}</td>
      <td class="t-act"><span class="vl-acts">${actions(r, i)}${r.status === 'none' ? '' : `<button type="button" class="row-x" aria-expanded="${on}" aria-label="Quiz results">${ICON.chevronD}</button>`}</span></td></tr>
      ${on ? `<tr class="sub"><td colspan="${cols.length}">${quizSub(r)}</td></tr>` : ''}`;
  }).join('') : `<tr><td colspan="${cols.length}">${empty}</td></tr>`)
    + (list.length > PAGE ? `<div class="pager"><span>${(page - 1) * PAGE + 1}–${Math.min(page * PAGE, list.length)} of ${list.length} learners</span><div class="pager__btns">
      <button data-pg="${page - 1}" ${page === 1 ? 'disabled' : ''} aria-label="Previous page">${ICON.chevronL}</button>
      ${Array.from({ length: pages }, (_, k) => `<button data-pg="${k + 1}" class="${page === k + 1 ? 'is-on' : ''}">${k + 1}</button>`).join('')}
      <button data-pg="${page + 1}" ${page === pages ? 'disabled' : ''} aria-label="Next page">${ICON.chevronR}</button></div></div>` : '');
  $('export').disabled = !rows.length;
}
function filters() {
  $('st-wrap').innerHTML = `${ICON.filter}<select id="st"><option value="all">All statuses</option>${Object.entries(ST).filter(([k]) => k !== 'removed').map(([v, [t]]) => `<option value="${v}" ${st === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  /* Excluded (n): bộ lọc riêng cạnh trạng thái; 0 thì ẩn (Course Audience 3.4) */
  const ex = rows.filter((r) => r.status === 'removed').length;
  $('ex-wrap').hidden = !ex;
  $('ex-wrap').innerHTML = `Excluded (${ex})`; $('ex-wrap').setAttribute('aria-pressed', st === 'removed'); $('ex-wrap').classList.toggle('is-on', st === 'removed');
}
function draw() { kpis(); filters(); table(); }
function render(role) {
  const r = LH.admRole(role);
  if (r !== 'admin') {
    AdminLayout({ active: 'courses', collapsed: true, role: r });
    $('head').innerHTML = AdminHead({ back: 'admin-courses.html?r=' + r, title: 'View Learners', desc: 'Admin L&D only.' });
    $('kpis').innerHTML = ''; $('tbl').innerHTML = `<div class="empty">${ICON.shield}<b>Access restricted</b><p>Only Admin L&amp;D can view learners of a course.</p></div>`;
    return;
  }
  AdminLayout({ active: 'courses', collapsed: true, role: r });
  $('head').innerHTML = AdminHead({ back: 'admin-courses.html?r=admin', eyebrow: 'Course Management · View Learners', title: esc(COURSE),
    right: `<a class="btn-cta btn-cta--soft" href="course-editor.html?r=admin&st=published&tab=audience&t=${encodeURIComponent(COURSE)}">${ICON.users}Audience</a>` });
  draw();
}

/* Popup Unenroll — Course Audience 3.4, 3.7 */
function unenroll(r) {
  document.getElementById('m-un')?.remove();
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'm-un', size: 'sm', icon: 'alert', iconTone: 'warning', title: `Unenroll ${esc(r.name)}?`,
    body: `<p class="t-sm">The course will be removed from their in-progress list and free up a slot. Progress (${r.pct}%) is kept if they enroll again.</p>
      <div class="adm-field" style="margin-top:12px"><label>Reason <span class="req">*</span></label><textarea class="adm-input" id="un-r" rows="3" maxlength="500" placeholder="Why are you unenrolling this learner?"></textarea><p class="adm-err" id="un-e"></p></div>`,
    foot: '<button type="button" class="btn-cta btn-cta--line" data-close>Cancel</button><button type="button" class="btn-cta btn-cta--danger" data-un-ok>Confirm</button>' }));
  /* Luật chung: Confirm tắt tới khi Reason đủ 10 ký tự */
  const unBtn = document.querySelector('#m-un [data-un-ok]'); unBtn.disabled = true;
  $('un-r').addEventListener('input', () => { unBtn.disabled = $('un-r').value.trim().length < 10; });
  document.getElementById('m-un').addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { document.getElementById('m-un').remove(); return; }
    if (!e.target.closest('[data-un-ok]')) return;
    const v = $('un-r').value.trim();
    if (v.length < 10 || v.length > 500) { $('un-e').textContent = 'Reason must be 10–500 characters.'; return; }
    r.status = 'unenrolled'; document.getElementById('m-un').remove(); draw(); toast(`${r.name} unenrolled`);
  });
}
/* Popup Reopen Attempts — Exam 3.5 (BR-EX-12) */
function reopen(r) {
  const failed = r.quiz.filter((z) => z.result === 'Failed');
  document.getElementById('m-re')?.remove();
  document.body.insertAdjacentHTML('beforeend', Modal({ id: 'm-re', size: 'md', icon: 'repeat', title: 'Reopen Attempts',
    desc: `${esc(r.name)} will get 3 new attempts. The first new attempt uses the latest version of the quiz.`,
    body: `<div class="stack" style="display:flex;flex-direction:column;gap:12px">
      <div class="adm-field"><label>Quiz <span class="req">*</span></label><select class="adm-input" id="re-q">${failed.length > 1 ? '<option value="">Select quiz</option>' : ''}${failed.map((z) => `<option>${esc(z.title)}</option>`).join('')}</select></div>
      <div class="adm-field"><label>Reason <span class="req">*</span></label><textarea class="adm-input" id="re-r" rows="3" maxlength="500" placeholder="Why are you reopening attempts?"></textarea><p class="adm-err" id="re-e"></p></div>
      <div class="alert alert--warning" role="status">${ICON.alert}<div>This learner has already seen the answers to the current questions. Consider updating the quiz before reopening.</div></div></div>`,
    foot: '<button type="button" class="btn-cta btn-cta--line" data-close>Cancel</button><button type="button" class="btn-cta" data-re-ok>Reopen</button>' }));
  /* Luật chung: Reopen tắt tới khi chọn Quiz và Reason đủ 10 ký tự */
  const reBtn = document.querySelector('#m-re [data-re-ok]');
  const reSync = () => { reBtn.disabled = !$('re-q').value || $('re-r').value.trim().length < 10; };
  reSync(); $('re-r').addEventListener('input', reSync); $('re-q').addEventListener('change', reSync);
  document.getElementById('m-re').addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) { document.getElementById('m-re').remove(); return; }
    if (!e.target.closest('[data-re-ok]')) return;
    const v = $('re-r').value.trim();
    if (!$('re-q').value) { $('re-e').textContent = 'Please select a quiz.'; return; }
    if (v.length < 10 || v.length > 500) { $('re-e').textContent = 'Reason must be 10–500 characters.'; return; }
    r.status = 'progress'; r.reopened = true; r.quiz = r.quiz.map((z) => (z.result === 'Failed' ? { ...z, used: 0, best: null, result: 'Not Attempted' } : z));
    document.getElementById('m-re').remove(); draw(); toast(`Attempts reopened for ${r.name}`);
  });
}

document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-kpi]'); if (k) { st = k.dataset.kpi === st && st !== 'all' ? 'all' : k.dataset.kpi; page = 1; draw(); return; }
  const pg = e.target.closest('[data-pg]'); if (pg) { page = +pg.dataset.pg; open.clear(); table(); return; }
  if (e.target.closest('[data-export]')) { LHExport.open({ course: COURSE, code: COURSE.split(' ')[0].toUpperCase(), total: rows.length, source: 'View Learners' }); return; }
  const un = e.target.closest('[data-unenroll]'); if (un) { unenroll(rows[+un.dataset.unenroll]); return; }
  const re = e.target.closest('[data-reopen]'); if (re) { reopen(rows[+re.dataset.reopen]); return; }
  if (e.target.closest('[data-ex]')) { st = st === 'removed' ? 'all' : 'removed'; page = 1; draw(); return; }
  const rm = e.target.closest('[data-remove]'); if (rm) { const r = rows[+rm.dataset.remove];
    AdminConfirm({ title: 'Remove learner?', text: `Remove ${esc(r.name)} from this course? They will lose access immediately; their progress is kept.`, ok: 'Remove', danger: true,
      onOk: () => { r.prev = r.status; r.status = 'removed'; draw(); toast(`${r.name} removed · moved to Excluded`); } }); return; }
  const ra = e.target.closest('[data-readd]'); if (ra) { const r = rows[+ra.dataset.readd]; r.status = r.prev || (r.pct === 100 ? 'done' : r.enrolled === '—' ? 'none' : 'progress'); draw(); toast(`${r.name} re-added · can learn again`); return; }
  const tr = e.target.closest('tr[data-row]'); if (tr && !e.target.closest('button')) { const i = +tr.dataset.row; open.has(i) ? open.delete(i) : open.add(i); table(); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'st') { st = e.target.value; page = 1; draw(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value; page = 1; table(); } });
LH.DemoBar('View Learners · LH1 + LH2 Đợt 1 (Remove · Re-add · Unenroll · Reopen Attempts · Export Data)', [
  { label: 'Role', key: 'r', options: [['admin', 'Admin'], ['editor', 'Editor (blocked)']] },
  { label: 'Data', key: 'data', options: [['full', 'Has learners'], ['empty', 'Empty']] },
], (s) => { rows = s.data === 'empty' ? [] : learners; open.clear(); render(s.r); });
</script>
</body>
</html>
